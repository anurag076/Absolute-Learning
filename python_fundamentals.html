<script type="text/x-tmpl" id="m1-theory">
<h3>Variables and Data Types</h3>
<p>Python uses dynamic typing — you assign a value and Python determines the type. Every piece of network data has a type: device names are strings, VLAN IDs are integers, CPU usage is a float, reachability is a boolean.</p>
<h4>Core Data Types</h4>
<table class="tbl"><thead><tr><th>Type</th><th>Example</th><th>Network Automation Use</th></tr></thead><tbody>
<tr><td><code>int</code></td><td><code>vlan_id = 100</code></td><td>VLAN IDs, port numbers, AS numbers, retry counts</td></tr>
<tr><td><code>float</code></td><td><code>cpu = 87.5</code></td><td>CPU %, latency ms, bandwidth utilisation</td></tr>
<tr><td><code>str</code></td><td><code>hostname = "R1"</code></td><td>Device names, IPs, CLI commands, config text</td></tr>
<tr><td><code>bool</code></td><td><code>is_up = True</code></td><td>Interface state, reachability, compliance result</td></tr>
<tr><td><code>NoneType</code></td><td><code>result = None</code></td><td>Missing data, unset values, no-return functions</td></tr>
</tbody></table>
<h4>Variables, Naming and Type Conversion</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">naming conventions and conversion</span></div><pre><span class="cm"># snake_case for variables (PEP 8 standard)</span>
<span class="vr">device_name</span>      = <span class="st">"SW-CORE-01"</span>
<span class="vr">mgmt_ip</span>          = <span class="st">"192.168.100.1"</span>
<span class="vr">ssh_port</span>         = <span class="nm">22</span>
<span class="vr">cpu_percent</span>      = <span class="nm">45.7</span>
<span class="vr">is_reachable</span>     = <span class="kw">True</span>
<span class="vr">last_backup</span>      = <span class="kw">None</span>
<span class="vr">DEFAULT_TIMEOUT</span>  = <span class="nm">10</span>     <span class="cm"># ALL_CAPS = constant by convention</span>

<span class="cm"># Multiple assignment in one line</span>
<span class="vr">host</span>, <span class="vr">user</span>, <span class="vr">pwd</span> = <span class="st">"10.1.1.1"</span>, <span class="st">"admin"</span>, <span class="st">"cisco"</span>

<span class="cm"># Type conversion — essential for API data</span>
<span class="vr">port_str</span> = <span class="fn">str</span>(<span class="nm">22</span>)           <span class="cm"># int  → "22"</span>
<span class="vr">vlan_int</span> = <span class="fn">int</span>(<span class="st">"100"</span>)        <span class="cm"># str  → 100</span>
<span class="vr">cpu_f</span>    = <span class="fn">float</span>(<span class="st">"87.5"</span>)    <span class="cm"># str  → 87.5</span>
<span class="vr">alive</span>    = <span class="fn">bool</span>(<span class="nm">1</span>)            <span class="cm"># int  → True (0=False)</span>

<span class="cm"># Check type at runtime</span>
<span class="fn">print</span>(<span class="fn">type</span>(ssh_port))         <span class="cm"># &lt;class 'int'&gt;</span>
<span class="fn">print</span>(<span class="fn">type</span>(last_backup))      <span class="cm"># &lt;class 'NoneType'&gt;</span></pre></div>
<div class="note y"><p><strong>Mutable vs Immutable:</strong> str, int, float, bool, tuple are immutable — cannot be changed in place. list, dict, set are mutable — can be modified. This matters when passing data to functions.</p></div>
</script>
<script type="text/x-tmpl" id="m1-industry">
<h3>Data Types in Real Network Automation</h3>
<p>The most common bug in automation scripts is a type mismatch — an API returns <code>"100"</code> (string) but your code treats it as <code>100</code> (integer). Always convert types at the boundary, right when data enters your script.</p>
<div class="g2">
  <div class="card"><h5>String data everywhere</h5><p>Hostnames, IPs, CLI commands, interface names, platform strings. Most API and SSH data arrives as strings — even numeric fields like port IDs often come as strings from REST APIs.</p></div>
  <div class="card g"><h5>Convert at the boundary</h5><p>Convert types when reading from files, APIs, YAML, or user input — not buried in the middle of logic. One conversion at entry means zero type bugs downstream.</p></div>
</div>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">common type bugs and fixes</span></div><pre><span class="cm"># BUG: API returns VLAN as string — arithmetic fails</span>
<span class="vr">vlan_api</span> = <span class="st">"100"</span>                  <span class="cm"># looks like a number, it's a string</span>
<span class="cm"># next_vlan = vlan_api + 1   →  TypeError: can only concatenate str!</span>
<span class="vr">next_vlan</span> = <span class="fn">int</span>(vlan_api) + <span class="nm">1</span>    <span class="cm"># Fix: 101</span>

<span class="cm"># BUG: comparing int to string — always False</span>
<span class="vr">vlan_id</span> = <span class="nm">100</span>
<span class="fn">print</span>(vlan_id == <span class="st">"100"</span>)           <span class="cm"># False — different types</span>
<span class="fn">print</span>(vlan_id == <span class="fn">int</span>(<span class="st">"100"</span>))     <span class="cm"># True</span>

<span class="cm"># BUG: bool from string</span>
<span class="fn">print</span>(<span class="kw">True</span> == <span class="st">"True"</span>)             <span class="cm"># False!</span>
<span class="vr">active</span> = <span class="st">"True"</span> == <span class="st">"True"</span>        <span class="cm"># Correct: bool True</span>

<span class="cm"># ALWAYS use is None (not == None)</span>
<span class="kw">if</span> result <span class="kw">is</span> <span class="kw">None</span>:                <span class="cm"># correct</span>
    <span class="fn">print</span>(<span class="st">"No result from device"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m1-practical">
<h3>Variables in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">device_profile.py</span></div><pre><span class="vr">hostname</span>         = <span class="st">"SW-CORE-01"</span>
<span class="vr">mgmt_ip</span>          = <span class="st">"192.168.100.10"</span>
<span class="vr">platform</span>         = <span class="st">"cisco_ios"</span>
<span class="vr">ssh_port</span>         = <span class="nm">22</span>
<span class="vr">timeout</span>          = <span class="nm">10</span>
<span class="vr">cpu_utilisation</span>  = <span class="nm">45.7</span>
<span class="vr">is_reachable</span>     = <span class="kw">True</span>
<span class="vr">last_backup</span>      = <span class="kw">None</span>

<span class="fn">print</span>(<span class="st">"="</span> * <span class="nm">40</span>)
<span class="fn">print</span>(f<span class="st">"Device  : {hostname}"</span>)
<span class="fn">print</span>(f<span class="st">"IP      : {mgmt_ip}:{ssh_port}"</span>)
<span class="fn">print</span>(f<span class="st">"CPU     : {cpu_utilisation:.1f}%"</span>)
<span class="fn">print</span>(f<span class="st">"Status  : {'UP' if is_reachable else 'DOWN'}"</span>)
<span class="fn">print</span>(f<span class="st">"Backup  : {last_backup or 'Never'}"</span>)
<span class="fn">print</span>(<span class="st">"="</span> * <span class="nm">40</span>)
<span class="fn">print</span>(f<span class="st">"\nType of ssh_port     : {type(ssh_port).__name__}"</span>)
<span class="fn">print</span>(f<span class="st">"Type of cpu         : {type(cpu_utilisation).__name__}"</span>)
<span class="fn">print</span>(f<span class="st">"Type of is_reachable: {type(is_reachable).__name__}"</span>)
<span class="fn">print</span>(f<span class="st">"Type of last_backup : {type(last_backup).__name__}"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m1-practice">
<h3>Practice — Variables &amp; Data Types</h3>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 1 — Device Profile Variables</div><div class="pt">Create typed variables and print a formatted report</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>Create variables for a router: hostname (str), ip (str), vlan_count (int), uptime_hours (float), managed (bool), last_push = None. Print a formatted summary using f-strings.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">hostname</span>     = <span class="st">"R1-BRANCH"</span>
<span class="vr">ip</span>           = <span class="st">"10.10.10.1"</span>
<span class="vr">vlan_count</span>   = <span class="nm">25</span>
<span class="vr">uptime_hours</span> = <span class="nm">1248.5</span>
<span class="vr">managed</span>      = <span class="kw">True</span>
<span class="vr">last_push</span>    = <span class="kw">None</span>

<span class="fn">print</span>(f<span class="st">"Hostname  : {hostname}"</span>)
<span class="fn">print</span>(f<span class="st">"IP        : {ip}"</span>)
<span class="fn">print</span>(f<span class="st">"VLANs     : {vlan_count}"</span>)
<span class="fn">print</span>(f<span class="st">"Uptime    : {uptime_hours:.1f} hrs"</span>)
<span class="fn">print</span>(f<span class="st">"Managed   : {managed}"</span>)
<span class="fn">print</span>(f<span class="st">"Last Push : {last_push or 'Never'}"</span>)</pre></div></div></div></div>

<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 2 — Fix API Type Mismatches</div><div class="pt">Convert strings to correct types</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>API returns: <code>port="22"</code>, <code>vlan="100"</code>, <code>cpu="78.3"</code>, <code>active="True"</code>. Convert each to the correct Python type. Verify with type(). Check if cpu &gt; 75.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">port</span>   = <span class="fn">int</span>(<span class="st">"22"</span>)
<span class="vr">vlan</span>   = <span class="fn">int</span>(<span class="st">"100"</span>)
<span class="vr">cpu</span>    = <span class="fn">float</span>(<span class="st">"78.3"</span>)
<span class="vr">active</span> = <span class="st">"True"</span> == <span class="st">"True"</span>   <span class="cm"># bool True</span>

<span class="fn">print</span>(<span class="fn">type</span>(port),   port)    <span class="cm"># &lt;class 'int'&gt; 22</span>
<span class="fn">print</span>(<span class="fn">type</span>(vlan),   vlan)    <span class="cm"># &lt;class 'int'&gt; 100</span>
<span class="fn">print</span>(<span class="fn">type</span>(cpu),    cpu)     <span class="cm"># &lt;class 'float'&gt; 78.3</span>
<span class="fn">print</span>(<span class="fn">type</span>(active), active)  <span class="cm"># &lt;class 'bool'&gt; True</span>
<span class="kw">if</span> cpu > <span class="nm">75</span>:
    <span class="fn">print</span>(<span class="st">"WARNING: CPU above 75%"</span>)</pre></div></div></div></div>

<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 3 — Multiple Assignment</div><div class="pt">Unpack connection details in one line</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>In one line, assign hostname="FW-01", ip="10.0.0.254", role="firewall". Print: <code>FW-01 (firewall) — 10.0.0.254</code></p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">hostname</span>, <span class="vr">ip</span>, <span class="vr">role</span> = <span class="st">"FW-01"</span>, <span class="st">"10.0.0.254"</span>, <span class="st">"firewall"</span>
<span class="fn">print</span>(f<span class="st">"{hostname} ({role}) — {ip}"</span>)
<span class="cm"># FW-01 (firewall) — 10.0.0.254</span></pre></div></div></div></div>

<script type="text/x-tmpl" id="m1-interview">
<h3>Interview Questions — Variables &amp; Data Types</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is dynamic typing and what risks does it create in network automation?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Dynamic typing means Python determines types at runtime — you write <code>x = 5</code> without declaring <code>int x</code>. Faster to write, but type mismatches only appear at runtime, not at compile time.</p><p><strong>Risk:</strong> An API returning <code>"100"</code> instead of <code>100</code> won't fail until you try arithmetic — possibly after successfully processing 49 other devices. Always validate and convert types at boundaries (when reading from APIs, files, user input).</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Why use <code>is None</code> instead of <code>== None</code>?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><code>is</code> checks identity — whether both variables point to the same object. <code>None</code> is a singleton in Python, so <code>is None</code> is the definitive check. A class can override <code>__eq__</code> to return <code>True</code> when compared to None, making <code>== None</code> unreliable. PEP 8 explicitly states: always use <code>is None</code> or <code>is not None</code>.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Your script reads VLAN IDs from YAML and gets a list of strings. <code>vlans[-1] + 1</code> throws TypeError. Fix it cleanly.</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Convert at the boundary — when you read the YAML — so the rest of your script always works with integers:</p><div class="sbox"><span style="color:#8b949e"># Convert entire list at load time</span>
<span style="color:#ffa657">vlans</span> = [<span style="color:#d2a8ff">int</span>(v) <span style="color:#ff7b72">for</span> v <span style="color:#ff7b72">in</span> yaml_data[<span style="color:#a5d6ff">"vlans"</span>]]
<span style="color:#ffa657">next_vlan</span> = vlans[-<span style="color:#79c0ff">1</span>] + <span style="color:#79c0ff">1</span>   <span style="color:#8b949e"># works correctly now</span></div></div></div>
</script>
<script type="text/x-tmpl" id="m2-theory">
<h3>Strings — The Backbone of CLI Automation</h3>
<p>Almost everything from a network device is text — CLI output, API JSON, config files. Python's string toolkit makes parsing device output, building commands, and formatting reports straightforward.</p>
<h4>Essential String Methods</h4>
<table class="tbl"><thead><tr><th>Method</th><th>Example</th><th>Result</th><th>Network Use</th></tr></thead><tbody>
<tr><td><code>.strip()</code></td><td><code>" R1 ".strip()</code></td><td><code>"R1"</code></td><td>Clean CLI output whitespace</td></tr>
<tr><td><code>.split()</code></td><td><code>"10.1.1.1".split(".")</code></td><td><code>["10","1","1","1"]</code></td><td>Parse IP octets, CLI columns</td></tr>
<tr><td><code>.splitlines()</code></td><td><code>output.splitlines()</code></td><td>list of lines</td><td>Parse multi-line CLI output</td></tr>
<tr><td><code>.join()</code></td><td><code>",".join(["10","20"])</code></td><td><code>"10,20"</code></td><td>Build trunk VLAN strings</td></tr>
<tr><td><code>.replace()</code></td><td><code>"Gi0/0".replace("Gi","GigE")</code></td><td><code>"GigE0/0"</code></td><td>Normalise interface names</td></tr>
<tr><td><code>.upper()/.lower()</code></td><td><code>"sw-01".upper()</code></td><td><code>"SW-01"</code></td><td>Case-insensitive comparison</td></tr>
<tr><td><code>.startswith()</code></td><td><code>"Gi0/0".startswith("Gi")</code></td><td><code>True</code></td><td>Filter interface types</td></tr>
<tr><td><code>.endswith()</code></td><td><code>"backup.cfg".endswith(".cfg")</code></td><td><code>True</code></td><td>Filter file types</td></tr>
<tr><td><code>.find()</code></td><td><code>output.find("down")</code></td><td>int or -1</td><td>Locate keyword in output</td></tr>
<tr><td><code>.count()</code></td><td><code>output.count("!")</code></td><td>int</td><td>Count config sections</td></tr>
</tbody></table>
<h4>f-Strings — Modern Formatting</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">f-string features</span></div><pre><span class="vr">hostname</span> = <span class="st">"SW-01"</span>; <span class="vr">ip</span> = <span class="st">"10.1.1.10"</span>; <span class="vr">cpu</span> = <span class="nm">87.512</span>; <span class="vr">status</span> = <span class="st">"up"</span>

<span class="fn">print</span>(f<span class="st">"{hostname} → {ip}"</span>)              <span class="cm"># basic substitution</span>
<span class="fn">print</span>(f<span class="st">"{hostname:15} {ip:18} {cpu:.1f}%"</span>) <span class="cm"># width alignment</span>
<span class="fn">print</span>(f<span class="st">"{'✓ UP' if status=='up' else '✗ DOWN'}"</span>) <span class="cm"># inline expression</span>

<span class="cm"># Multiline config block</span>
<span class="vr">cfg</span> = f<span class="st">"""interface Gi0/0
 ip address {ip} 255.255.255.0
 description {hostname}
 no shutdown"""</span></pre></div>
</script>
<script type="text/x-tmpl" id="m2-industry">
<h3>String Parsing in Network Automation</h3>
<p>Parsing CLI output is the most common string task in network automation. Devices return walls of text — extract the specific values you need line by line.</p>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">parse show ip interface brief</span></div><pre><span class="vr">output</span> = <span class="st">"""Interface      IP-Address   OK? Method Status   Protocol
GigabitEthernet0/0  10.1.1.1  YES NVRAM  up       up
GigabitEthernet0/1  10.1.2.1  YES NVRAM  up       up
GigabitEthernet0/2  unassigned YES NVRAM  down     down"""</span>

<span class="vr">down_list</span> = []
<span class="kw">for</span> line <span class="kw">in</span> output.<span class="fn">splitlines</span>()[<span class="nm">1</span>:]:  <span class="cm"># skip header row</span>
    <span class="kw">if not</span> line.<span class="fn">strip</span>(): <span class="kw">continue</span>
    <span class="vr">parts</span>  = line.<span class="fn">split</span>()             <span class="cm"># split on any whitespace</span>
    <span class="vr">iface</span>  = parts[<span class="nm">0</span>]
    <span class="vr">status</span> = parts[<span class="nm">4</span>]
    <span class="vr">icon</span>   = <span class="st">"✓"</span> <span class="kw">if</span> status == <span class="st">"up"</span> <span class="kw">else</span> <span class="st">"✗"</span>
    <span class="fn">print</span>(f<span class="st">"  {icon} {iface:30} [{status}]"</span>)
    <span class="kw">if</span> status == <span class="st">"down"</span>:
        down_list.<span class="fn">append</span>(iface)

<span class="fn">print</span>(f<span class="st">"\n⚠ Down interfaces: {down_list}"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m2-practical">
<h3>String Methods in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">string_toolkit.py</span></div><pre><span class="cm"># 1. Normalise interface names</span>
<span class="kw">def</span> <span class="fn">short_int</span>(name):
    <span class="kw">return</span> (name.<span class="fn">strip</span>()
               .<span class="fn">replace</span>(<span class="st">"GigabitEthernet"</span>, <span class="st">"Gi"</span>)
               .<span class="fn">replace</span>(<span class="st">"FastEthernet"</span>,    <span class="st">"Fa"</span>)
               .<span class="fn">replace</span>(<span class="st">"TenGigabitEthernet"</span>, <span class="st">"Te"</span>))

<span class="fn">print</span>(<span class="fn">short_int</span>(<span class="st">" GigabitEthernet0/1 "</span>))  <span class="cm"># Gi0/1</span>

<span class="cm"># 2. Extract network from IP address</span>
<span class="vr">ip</span>     = <span class="st">"192.168.10.5"</span>
<span class="vr">octets</span> = ip.<span class="fn">split</span>(<span class="st">"."</span>)
<span class="fn">print</span>(f<span class="st">"{'.'.join(octets[:3])}.0/24"</span>)  <span class="cm"># 192.168.10.0/24</span>

<span class="cm"># 3. Build trunk VLAN command string</span>
<span class="vr">vlans</span>    = [<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>]
<span class="vr">vlan_str</span> = <span class="st">","</span>.<span class="fn">join</span>(<span class="fn">str</span>(v) <span class="kw">for</span> v <span class="kw">in</span> vlans)
<span class="fn">print</span>(f<span class="st">"switchport trunk allowed vlan {vlan_str}"</span>)

<span class="cm"># 4. Generate IOS interface config blocks</span>
<span class="vr">ifaces</span> = [(<span class="st">"Gi0/0"</span>, <span class="st">"10.1.1.1"</span>), (<span class="st">"Gi0/1"</span>, <span class="st">"10.1.2.1"</span>)]
<span class="kw">for</span> iface, ip <span class="kw">in</span> ifaces:
    <span class="fn">print</span>(f<span class="st">"interface {iface}\n ip address {ip} 255.255.255.0\n no shutdown\n!"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m2-practice">
<h3>Practice — Strings</h3>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 1 — Parse CLI Line</div><div class="pt">split() and index access</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>Given: <code>line = "GigabitEthernet0/0    10.1.1.1    YES NVRAM  up   up"</code>. Extract and print the interface name, IP address, and status using split().</p>

<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 2 — Build IOS Config Commands</div><div class="pt">f-strings and join()</div></div><span class="chv">▼</span></div>

<script type="text/x-tmpl" id="m2-interview">
<h3>Interview Questions — Strings</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between <code>split()</code> with no argument and <code>split(" ")</code>? Which should you use for CLI parsing?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><code>split()</code> splits on any whitespace (spaces, tabs, newlines) and discards empty strings — robust for CLI output with inconsistent spacing. <code>split(" ")</code> splits only on a single space and keeps empty strings between consecutive spaces, giving wrong index positions for CLI output like <code>"Gi0/0    10.1.1.1"</code>. Always use <code>split()</code> with no argument for CLI parsing.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Parse the IOS version from: "Cisco IOS Software, Version 15.6(3)M4, RELEASE SOFTWARE". Extract just "15.6(3)M4".</span><span class="qa-chv">▼</span></div><div class="qa-ans"><div class="sbox"><span style="color:#ffa657">line</span> = <span style="color:#a5d6ff">"Cisco IOS Software, Version 15.6(3)M4, RELEASE SOFTWARE"</span>
<span style="color:#ffa657">version</span> = line.<span style="color:#d2a8ff">split</span>(<span style="color:#a5d6ff">"Version "</span>)[<span style="color:#79c0ff">1</span>].<span style="color:#d2a8ff">split</span>(<span style="color:#a5d6ff">","</span>)[<span style="color:#79c0ff">0</span>]
<span style="color:#d2a8ff">print</span>(version)   <span style="color:#8b949e"># 15.6(3)M4</span></div><p style="margin-top:8px">For production, use Netmiko's TextFSM integration (<code>use_textfsm=True</code>) which handles all IOS version formats automatically across platforms.</p></div></div>
</script>
<script type="text/x-tmpl" id="m3-theory">
<h3>Lists and Tuples — Ordered Collections</h3>
<p>Lists store multiple values in order and can be changed. Tuples are immutable versions. Lists power every bulk operation — device inventories, command queues, API results, collected outputs.</p>
<h4>List Operations</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">list operations</span></div><pre><span class="vr">devices</span> = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"SW-01"</span>, <span class="st">"SW-02"</span>]
<span class="cm"># Access</span>
<span class="fn">print</span>(devices[<span class="nm">0</span>])      <span class="cm"># "R1"  — first</span>
<span class="fn">print</span>(devices[-<span class="nm">1</span>])     <span class="cm"># "SW-02" — last</span>
<span class="fn">print</span>(devices[<span class="nm">1</span>:<span class="nm">3</span>])    <span class="cm"># ["R2","SW-01"] — slice</span>
<span class="cm"># Modify</span>
devices.<span class="fn">append</span>(<span class="st">"FW-01"</span>)       <span class="cm"># add to end</span>
devices.<span class="fn">insert</span>(<span class="nm">0</span>, <span class="st">"CORE"</span>)    <span class="cm"># insert at index 0</span>
devices.<span class="fn">remove</span>(<span class="st">"R2"</span>)         <span class="cm"># remove by value</span>
devices.<span class="fn">pop</span>()                <span class="cm"># remove and return last</span>
devices.<span class="fn">extend</span>([<span class="st">"R3"</span>,<span class="st">"R4"</span>]) <span class="cm"># merge — keeps list flat</span>
<span class="cm"># Info</span>
<span class="fn">print</span>(<span class="fn">len</span>(devices))           <span class="cm"># count</span>
<span class="fn">print</span>(<span class="st">"R1"</span> <span class="kw">in</span> devices)       <span class="cm"># True/False</span>
devices.<span class="fn">sort</span>()               <span class="cm"># sort in place</span>
<span class="cm"># List comprehension</span>
<span class="vr">routers</span> = [d <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> d.<span class="fn">startswith</span>(<span class="st">"R"</span>)]
<span class="vr">upper</span>   = [d.<span class="fn">upper</span>() <span class="kw">for</span> d <span class="kw">in</span> devices]
<span class="vr">cmds</span>    = [f<span class="st">"vlan {v}"</span> <span class="kw">for</span> v <span class="kw">in</span> [<span class="nm">10</span>,<span class="nm">20</span>,<span class="nm">30</span>]]</pre></div>
<h4>Tuples — Immutable Fixed Records</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">tuples</span></div><pre><span class="vr">reserved_vlans</span>  = (<span class="nm">1</span>, <span class="nm">1002</span>, <span class="nm">1003</span>, <span class="nm">1004</span>, <span class="nm">1005</span>)
<span class="vr">conn_details</span>    = (<span class="st">"10.1.1.1"</span>, <span class="nm">22</span>, <span class="st">"admin"</span>)
<span class="cm"># Tuple unpacking — very clean</span>
<span class="vr">ip</span>, <span class="vr">port</span>, <span class="vr">user</span> = conn_details
<span class="fn">print</span>(f<span class="st">"ssh {user}@{ip}:{port}"</span>)
<span class="cm"># Tuples can be dict keys (lists cannot)</span>
<span class="vr">routes</span> = {(<span class="st">"10.1.0.0"</span>, <span class="nm">16</span>): <span class="st">"via R1"</span>}</pre></div>
</script>
<script type="text/x-tmpl" id="m3-industry">
<h3>Lists in Real Network Automation</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">device scan and VLAN trunk builder</span></div><pre><span class="cm"># Track online / offline devices</span>
<span class="vr">lab_devices</span> = [<span class="st">"192.168.100.1"</span>, <span class="st">"192.168.100.2"</span>, <span class="st">"192.168.100.10"</span>]
<span class="vr">online</span>  = []
<span class="vr">offline</span> = []
<span class="kw">for</span> ip <span class="kw">in</span> lab_devices:
    (online <span class="kw">if</span> <span class="fn">ping_ok</span>(ip) <span class="kw">else</span> offline).<span class="fn">append</span>(ip)
<span class="fn">print</span>(f<span class="st">"Online: {len(online)}/{len(lab_devices)}"</span>)
<span class="cm"># Build trunk VLAN string from list</span>
<span class="vr">allowed_vlans</span> = [<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>]
<span class="vr">trunk_cmd</span> = <span class="st">"switchport trunk allowed vlan "</span> + \
    <span class="st">","</span>.<span class="fn">join</span>(<span class="fn">str</span>(v) <span class="kw">for</span> v <span class="kw">in</span> sorted(allowed_vlans))
<span class="fn">print</span>(trunk_cmd)</pre></div>
</script>
<script type="text/x-tmpl" id="m3-practical">
<h3>Lists in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">vlan_manager.py</span></div><pre><span class="vr">allowed</span> = [<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>]
<span class="kw">for</span> v <span class="kw">in</span> [<span class="nm">200</span>, <span class="nm">300</span>]:
    <span class="kw">if</span> v <span class="kw">not in</span> allowed: allowed.<span class="fn">append</span>(v)
<span class="kw">for</span> v <span class="kw">in</span> [<span class="nm">30</span>]:
    <span class="kw">if</span> v <span class="kw">in</span> allowed: allowed.<span class="fn">remove</span>(v)
allowed.<span class="fn">sort</span>()
<span class="fn">print</span>(<span class="st">"VLANs:"</span>, allowed)
<span class="fn">print</span>(<span class="st">"switchport trunk allowed vlan"</span>, <span class="st">","</span>.<span class="fn">join</span>(<span class="fn">str</span>(v) <span class="kw">for</span> v <span class="kw">in</span> allowed))
<span class="cm"># Command queue pattern</span>
<span class="vr">commands</span> = []
<span class="kw">for</span> v <span class="kw">in</span> allowed:
    commands.<span class="fn">append</span>(f<span class="st">"vlan {v}"</span>)
    commands.<span class="fn">append</span>(f<span class="st">" name DATA_{v}"</span>)
<span class="fn">print</span>(<span class="st">"\n"</span>.<span class="fn">join</span>(commands))</pre></div>
</script>
<script type="text/x-tmpl" id="m3-practice">
<h3>Practice — Lists &amp; Tuples</h3>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 1 — Device Inventory</div><div class="pt">append, remove, sort, len</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>Start with <code>["R1","R2","SW-01","SW-02"]</code>. Add "FW-01", remove "R2", sort alphabetically, print count and final list.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">devices</span> = [<span class="st">"R1"</span>,<span class="st">"R2"</span>,<span class="st">"SW-01"</span>,<span class="st">"SW-02"</span>]
devices.<span class="fn">append</span>(<span class="st">"FW-01"</span>)
devices.<span class="fn">remove</span>(<span class="st">"R2"</span>)
devices.<span class="fn">sort</span>()
<span class="fn">print</span>(f<span class="st">"Count  : {len(devices)}"</span>)
<span class="fn">print</span>(f<span class="st">"Devices: {devices}"</span>)
<span class="cm"># ['FW-01', 'R1', 'SW-01', 'SW-02']</span></pre></div></div></div></div>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 2 — List Comprehension</div><div class="pt">Filter routers into uppercase</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>From <code>["R1","R2","SW-01","SW-02","FW-01","R3"]</code> use a comprehension to get only routers (start with "R") in uppercase.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">devices</span> = [<span class="st">"R1"</span>,<span class="st">"R2"</span>,<span class="st">"SW-01"</span>,<span class="st">"SW-02"</span>,<span class="st">"FW-01"</span>,<span class="st">"R3"</span>]
<span class="vr">routers</span> = [d.<span class="fn">upper</span>() <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> d.<span class="fn">startswith</span>(<span class="st">"R"</span>)]
<span class="fn">print</span>(routers)  <span class="cm"># ['R1', 'R2', 'R3']</span></pre></div></div></div></div>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 3 — Tuple Unpacking</div><div class="pt">Unpack connection tuple</div></div><span class="chv">▼</span></div>

<span class="cm"># ssh admin@192.168.1.1 -p 22</span></pre></div></div></div></div>
</script>
<script type="text/x-tmpl" id="m3-interview">
<h3>Interview Questions — Lists &amp; Tuples</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between <code>append()</code> and <code>extend()</code>?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><code>append(x)</code> adds x as a single element — if x is a list it becomes a nested list. <code>extend(iterable)</code> unpacks and adds each item individually, keeping the list flat. Use <code>extend()</code> to merge device lists. Use <code>append()</code> to add one device or one command.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">When would you choose a tuple over a list?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Use tuples for data that must not change: connection parameters <code>(host, port, user)</code>, reserved VLANs, dict keys (lists cannot be dict keys), or when returning multiple values from a function. Tuples communicate intent — "this data is fixed." For anything you'll add/remove items from, use a list.</p></div></div>
</script>
<script type="text/x-tmpl" id="m4-theory">
<h3>Dictionaries and Sets</h3>
<p>Dictionaries map keys to values — the most important structure in network automation. Every API response, YAML inventory, and Netmiko connection parameter is a dict. Sets hold unique values — perfect for VLAN deduplication.</p>
<h4>Dictionary Operations</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">dict operations</span></div><pre><span class="vr">device</span> = {
    <span class="st">"hostname"</span> : <span class="st">"R1"</span>,
    <span class="st">"ip"</span>       : <span class="st">"192.168.1.1"</span>,
    <span class="st">"platform"</span> : <span class="st">"cisco_ios"</span>,
    <span class="st">"port"</span>     : <span class="nm">22</span>,
    <span class="st">"reachable"</span>: <span class="kw">True</span>,
}
<span class="cm"># Access — always prefer .get() for safety</span>
<span class="fn">print</span>(device[<span class="st">"hostname"</span>])          <span class="cm"># "R1" — KeyError if missing</span>
<span class="fn">print</span>(device.<span class="fn">get</span>(<span class="st">"hostname"</span>))      <span class="cm"># "R1" — None if missing</span>
<span class="fn">print</span>(device.<span class="fn">get</span>(<span class="st">"secret"</span>, <span class="st">""</span>))    <span class="cm"># ""  — default value</span>
<span class="cm"># Modify</span>
device[<span class="st">"timeout"</span>] = <span class="nm">30</span>            <span class="cm"># add / update</span>
<span class="kw">del</span> device[<span class="st">"timeout"</span>]             <span class="cm"># delete key</span>
<span class="kw">if</span> <span class="st">"ip"</span> <span class="kw">in</span> device: <span class="fn">print</span>(<span class="st">"IP set"</span>)
<span class="cm"># Iterate all key-value pairs</span>
<span class="kw">for</span> k, v <span class="kw">in</span> device.<span class="fn">items</span>():
    <span class="fn">print</span>(f<span class="st">"  {k}: {v}"</span>)
<span class="cm"># Dict comprehension — hostname:ip map</span>
<span class="vr">ip_map</span> = {d[<span class="st">"hostname"</span>]:d[<span class="st">"ip"</span>] <span class="kw">for</span> d <span class="kw">in</span> inventory}</pre></div>
<h4>Sets — Unique Values and Set Algebra</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">set operations for VLAN compliance</span></div><pre><span class="vr">sw01</span> = {<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>}
<span class="vr">sw02</span> = {<span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">200</span>}
<span class="fn">print</span>(sw01 | sw02)   <span class="cm"># union:        {10,20,30,100,200}</span>
<span class="fn">print</span>(sw01 &amp; sw02)   <span class="cm"># intersection: {20,30} — on both</span>
<span class="fn">print</span>(sw01 - sw02)   <span class="cm"># difference:   {10,100} — SW-01 only</span>
<span class="cm"># Deduplicate a list</span>
<span class="vr">raw</span>    = [<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">10</span>, <span class="nm">30</span>, <span class="nm">20</span>]
<span class="vr">unique</span> = <span class="fn">sorted</span>(<span class="fn">set</span>(raw))  <span class="cm"># [10, 20, 30]</span></pre></div>
</script>
<script type="text/x-tmpl" id="m4-industry">
<h3>Dictionaries in Real Network Automation</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Netmiko dict, safe nested access, report building</span></div><pre><span class="cm"># Netmiko connection dict — ** unpacks as kwargs</span>
<span class="vr">conn</span> = {
    <span class="st">"device_type"</span>: <span class="st">"cisco_ios"</span>,
    <span class="st">"host"</span>       : <span class="st">"10.1.1.1"</span>,
    <span class="st">"username"</span>   : <span class="st">"admin"</span>,
    <span class="st">"password"</span>   : <span class="st">"cisco"</span>,
    <span class="st">"timeout"</span>    : <span class="nm">10</span>,
}
<span class="cm"># ConnectHandler(**conn)</span>

<span class="cm"># Safe nested access — chain .get() calls</span>
<span class="vr">ip</span> = (response
       .<span class="fn">get</span>(<span class="st">"data"</span>, {})
       .<span class="fn">get</span>(<span class="st">"devices"</span>, [{}])[<span class="nm">0</span>]
       .<span class="fn">get</span>(<span class="st">"mgmtIpAddress"</span>, <span class="st">"unknown"</span>))

<span class="cm"># Build report dict during loop</span>
<span class="vr">report</span> = {}
<span class="kw">for</span> d <span class="kw">in</span> devices:
    report[d[<span class="st">"hostname"</span>]] = {
        <span class="st">"status"</span>  : <span class="st">"UP"</span> <span class="kw">if</span> <span class="fn">ping_ok</span>(d[<span class="st">"ip"</span>]) <span class="kw">else</span> <span class="st">"DOWN"</span>,
        <span class="st">"platform"</span>: d[<span class="st">"platform"</span>],
    }</pre></div>
</script>
<script type="text/x-tmpl" id="m4-practical">
<h3>Dictionaries in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">inventory_report.py</span></div><pre><span class="vr">inventory</span> = [
    {<span class="st">"hostname"</span>:<span class="st">"R1"</span>,   <span class="st">"ip"</span>:<span class="st">"10.1.1.1"</span>,  <span class="st">"type"</span>:<span class="st">"router"</span>, <span class="st">"up"</span>:<span class="kw">True</span>},
    {<span class="st">"hostname"</span>:<span class="st">"R2"</span>,   <span class="st">"ip"</span>:<span class="st">"10.1.1.2"</span>,  <span class="st">"type"</span>:<span class="st">"router"</span>, <span class="st">"up"</span>:<span class="kw">False</span>},
    {<span class="st">"hostname"</span>:<span class="st">"SW-01"</span>,<span class="st">"ip"</span>:<span class="st">"10.1.1.10"</span>, <span class="st">"type"</span>:<span class="st">"switch"</span>, <span class="st">"up"</span>:<span class="kw">True</span>},
]

<span class="vr">up_count</span> = <span class="fn">sum</span>(<span class="nm">1</span> <span class="kw">for</span> d <span class="kw">in</span> inventory <span class="kw">if</span> d[<span class="st">"up"</span>])
<span class="fn">print</span>(f<span class="st">"\n{up_count}/{len(inventory)} UP"</span>)
<span class="vr">ip_map</span> = {d[<span class="st">"hostname"</span>]:d[<span class="st">"ip"</span>] <span class="kw">for</span> d <span class="kw">in</span> inventory}
<span class="fn">print</span>(<span class="st">"R1 IP:"</span>, ip_map[<span class="st">"R1"</span>])</pre></div>
</script>
<script type="text/x-tmpl" id="m4-practice">
<h3>Practice — Dictionaries &amp; Sets</h3>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 1 — Safe Dict Access</div><div class="pt">get() with defaults</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>Create a device dict (hostname, ip, platform). Safely access a missing key "secret" using <code>.get()</code> with default "not set". Check if "ip" exists before printing.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">device</span> = {<span class="st">"hostname"</span>:<span class="st">"SW-CORE"</span>, <span class="st">"ip"</span>:<span class="st">"10.0.0.1"</span>, <span class="st">"platform"</span>:<span class="st">"cisco_ios"</span>}
<span class="fn">print</span>(device.<span class="fn">get</span>(<span class="st">"hostname"</span>))
<span class="fn">print</span>(device.<span class="fn">get</span>(<span class="st">"secret"</span>, <span class="st">"not set"</span>))
<span class="kw">if</span> <span class="st">"ip"</span> <span class="kw">in</span> device:
    <span class="fn">print</span>(f<span class="st">"IP: {device['ip']}"</span>)</pre></div></div></div></div>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 2 — Dict Comprehension</div><div class="pt">Build hostname → ip mapping</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>From a list of device dicts with "hostname" and "ip" keys, build a dict comprehension mapping hostname to ip. Look up "SW-01"'s IP.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>

]

<span class="fn">print</span>(ip_map[<span class="st">"SW-01"</span>])  <span class="cm"># 10.1.1.10</span></pre></div></div></div></div>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 3 — VLAN Compliance with Sets</div><div class="pt">Set difference and intersection</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>Required VLANs: <code>{10,20,30,100}</code>. Found on switch: <code>{10,20,99,100,200}</code>. Print missing VLANs and unauthorised VLANs.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="vr">required</span>     = {<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>}
<span class="vr">actual</span>       = {<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">99</span>, <span class="nm">100</span>, <span class="nm">200</span>}
<span class="vr">missing</span>      = required - actual   <span class="cm"># {30}</span>
<span class="vr">unauthorised</span> = actual - required   <span class="cm"># {99, 200}</span>
<span class="fn">print</span>(<span class="st">"Missing:     "</span>, missing)
<span class="fn">print</span>(<span class="st">"Unauthorised:"</span>, unauthorised)</pre></div></div></div></div>
</script>
<script type="text/x-tmpl" id="m4-interview">
<h3>Interview Questions — Dictionaries &amp; Sets</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Why use <code>.get()</code> instead of direct bracket access for API responses?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Direct access <code>dict["key"]</code> raises <code>KeyError</code> if the key is missing — crashing your script. API responses frequently have optional fields depending on device model or software version. <code>.get("key", default)</code> returns the default safely. In production: use <code>.get()</code> for optional fields, and bracket access only where you know the key is always present and want to fail loudly if it isn't.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Find VLANs configured on one switch but not another for a compliance audit. How do you do this efficiently in Python?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Set difference — built exactly for this:</p><div class="sbox"><span style="color:#ffa657">sw01</span> = {<span style="color:#79c0ff">10</span>,<span style="color:#79c0ff">20</span>,<span style="color:#79c0ff">30</span>,<span style="color:#79c0ff">100</span>}
<span style="color:#ffa657">required</span> = {<span style="color:#79c0ff">10</span>,<span style="color:#79c0ff">20</span>,<span style="color:#79c0ff">30</span>}
<span style="color:#d2a8ff">print</span>(<span style="color:#a5d6ff">"Missing:"</span>, required - sw01)
<span style="color:#d2a8ff">print</span>(<span style="color:#a5d6ff">"Extra:  "</span>, sw01 - required)</div><p style="margin-top:8px">Much cleaner and faster than nested for loops — O(n) vs O(n²).</p></div></div>
</script>
<script type="text/x-tmpl" id="m5-theory">
<h3>Conditional Statements — Decision Making</h3>
<p>Conditionals let your script make decisions — check reachability before connecting, classify device status, trigger alerts when thresholds are crossed. Every automation script is full of conditionals.</p>
<h4>if / elif / else</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">conditionals with network examples</span></div><pre><span class="vr">cpu</span> = <span class="nm">87.5</span>
<span class="kw">if</span> cpu >= <span class="nm">90</span>:
    <span class="fn">print</span>(<span class="st">"CRITICAL"</span>)
<span class="kw">elif</span> cpu >= <span class="nm">75</span>:
    <span class="fn">print</span>(<span class="st">"WARNING"</span>)
<span class="kw">elif</span> cpu >= <span class="nm">50</span>:
    <span class="fn">print</span>(<span class="st">"MODERATE"</span>)
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="st">"OK"</span>)           <span class="cm"># WARNING</span>

<span class="cm"># Comparison operators: == != > < >= <= in not-in is is-not</span>
<span class="cm"># Logical operators: and  or  not</span>

<span class="cm"># Truthy/Falsy — Falsy: 0, "", [], {}, None, False</span>
<span class="vr">failed</span> = []
<span class="kw">if</span> failed:              <span class="cm"># empty list is Falsy — won't run</span>
    <span class="fn">print</span>(<span class="st">"some failed"</span>)

<span class="cm"># Ternary (one-line) conditional</span>
<span class="vr">icon</span>    = <span class="st">"✓"</span> <span class="kw">if</span> status == <span class="st">"up"</span> <span class="kw">else</span> <span class="st">"✗"</span>
<span class="vr">timeout</span> = custom_t <span class="kw">if</span> custom_t <span class="kw">else</span> <span class="nm">10</span>  <span class="cm"># use default if None/0</span></pre></div>
<h4>Compound Conditions</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">and / or / not / in</span></div><pre><span class="cm"># and — both must be True</span>
<span class="kw">if</span> is_reachable <span class="kw">and</span> is_authenticated:
    <span class="fn">configure_device</span>()
<span class="cm"># or — at least one True</span>
<span class="kw">if</span> status == <span class="st">"up"</span> <span class="kw">or</span> status == <span class="st">"active"</span>:
    <span class="fn">print</span>(<span class="st">"interface running"</span>)
<span class="cm"># not — negate</span>
<span class="kw">if not</span> is_reachable:
    <span class="fn">print</span>(<span class="st">"skipping offline device"</span>)
<span class="cm"># in — membership test</span>
<span class="kw">if</span> vlan <span class="kw">not in</span> allowed_vlans:
    <span class="fn">print</span>(f<span class="st">"VLAN {vlan} not authorised"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m5-industry">
<h3>Conditionals in Real Network Automation</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">device compliance checker</span></div><pre><span class="kw">def</span> <span class="fn">check_device</span>(device):
    <span class="kw">if not</span> device.<span class="fn">get</span>(<span class="st">"reachable"</span>):
        <span class="kw">return</span> <span class="st">"SKIP"</span>, <span class="st">"Unreachable"</span>
    <span class="vr">cpu</span> = device.<span class="fn">get</span>(<span class="st">"cpu"</span>, <span class="nm">0</span>)
    <span class="kw">if</span> cpu > <span class="nm">90</span>:
        <span class="kw">return</span> <span class="st">"FAIL"</span>, f<span class="st">"CPU critical: {cpu}%"</span>
    <span class="kw">if not</span> device.<span class="fn">get</span>(<span class="st">"ntp_synced"</span>):
        <span class="kw">return</span> <span class="st">"FAIL"</span>, <span class="st">"NTP not synced"</span>
    <span class="vr">ios</span> = device.<span class="fn">get</span>(<span class="st">"ios_version"</span>, <span class="st">""</span>)
    <span class="kw">if</span> ios <span class="kw">and</span> <span class="st">"12."</span> <span class="kw">in</span> ios:
        <span class="kw">return</span> <span class="st">"FAIL"</span>, <span class="st">"EOL IOS version"</span>
    <span class="kw">return</span> <span class="st">"PASS"</span>, <span class="st">"All checks OK"</span></pre></div>
</script>
<script type="text/x-tmpl" id="m5-practical">
<h3>Conditionals in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">interface_audit.py</span></div><pre><span class="vr">interfaces</span> = [
    {<span class="st">"name"</span>:<span class="st">"Gi0/0"</span>, <span class="st">"status"</span>:<span class="st">"up"</span>,   <span class="st">"errors"</span>:<span class="nm">0</span>},
    {<span class="st">"name"</span>:<span class="st">"Gi0/1"</span>, <span class="st">"status"</span>:<span class="st">"down"</span>, <span class="st">"errors"</span>:<span class="nm">0</span>},
    {<span class="st">"name"</span>:<span class="st">"Gi0/2"</span>, <span class="st">"status"</span>:<span class="st">"up"</span>,   <span class="st">"errors"</span>:<span class="nm">1500</span>},
]
<span class="kw">for</span> i <span class="kw">in</span> interfaces:
    <span class="kw">if</span> i[<span class="st">"status"</span>] == <span class="st">"down"</span>:
        <span class="fn">print</span>(f<span class="st">"[DOWN] {i['name']} — investigate"</span>)
    <span class="kw">elif</span> i[<span class="st">"status"</span>] == <span class="st">"up"</span> <span class="kw">and</span> i[<span class="st">"errors"</span>] > <span class="nm">1000</span>:
        <span class="fn">print</span>(f<span class="st">"[WARN] {i['name']} — {i['errors']} errors"</span>)
    <span class="kw">else</span>:
        <span class="fn">print</span>(f<span class="st">"[OK]   {i['name']}"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m5-practice">
<h3>Practice — Conditionals</h3>
<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 1 — CPU Alert Function</div><div class="pt">if/elif/else with thresholds</div></div><span class="chv">▼</span></div>
<div class="pb" style="display:none"><p>Write <code>cpu_alert(cpu)</code> that returns "CRITICAL" if cpu≥90, "WARNING" if ≥75, "MODERATE" if ≥50, else "OK". Test with 95, 80, 60, 30.</p>
<button class="stb" onclick="tS(this)">▶ Show Solution</button>
<div class="sb2"><div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">Solution</span></div><pre><span class="kw">def</span> <span class="fn">cpu_alert</span>(cpu):
    <span class="kw">if</span>   cpu >= <span class="nm">90</span>: <span class="kw">return</span> <span class="st">"CRITICAL"</span>
    <span class="kw">elif</span> cpu >= <span class="nm">75</span>: <span class="kw">return</span> <span class="st">"WARNING"</span>
    <span class="kw">elif</span> cpu >= <span class="nm">50</span>: <span class="kw">return</span> <span class="st">"MODERATE"</span>
    <span class="kw">else</span>:           <span class="kw">return</span> <span class="st">"OK"</span>

<span class="kw">for</span> v <span class="kw">in</span> [<span class="nm">95</span>, <span class="nm">80</span>, <span class="nm">60</span>, <span class="nm">30</span>]:
    <span class="fn">print</span>(f<span class="st">"CPU {v:3}% → {cpu_alert(v)}"</span>)</pre></div></div></div></div>

<script type="text/x-tmpl" id="m5-interview">
<h3>Interview Questions — Conditionals</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between <code>==</code> and <code>is</code>? When should you use each?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><code>==</code> checks value equality. <code>is</code> checks identity — both variables point to the exact same object in memory. Always use <code>is None</code> / <code>is not None</code> for None checks (PEP 8 requirement). For all other comparisons use <code>==</code>. Never use <code>is</code> with strings or numbers — Python caches some values so it may accidentally work, but it's not guaranteed.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Your script checks <code>if device["status"] == "Up":</code> but never matches even though devices are up. What is the likely cause?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Case sensitivity. Different APIs and device platforms return status in different cases — <code>"up"</code>, <code>"UP"</code>, <code>"Up"</code>, <code>"active"</code>. Python string comparison is case-sensitive so <code>"up" == "Up"</code> is False.</p><p><strong>Fix:</strong> Normalise before comparing: <code>device["status"].lower() == "up"</code> — handles any capitalisation. This is one of the most common bugs in multi-vendor automation.</p></div></div>
</script>
<script type="text/x-tmpl" id="m6-theory">
<h3>Loops — The Engine of Automation</h3>
<p>Loops are why automation exists. Write an operation once and execute it across all 50 devices. Python has two loop types: <code>for</code> iterates over a known collection; <code>while</code> repeats while a condition is True.</p>
<h4>for Loop — Every Pattern</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">for loop patterns</span></div><pre><span class="vr">devices</span> = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"SW-01"</span>]

<span class="cm"># Basic — iterate list</span>
<span class="kw">for</span> device <span class="kw">in</span> devices:
    <span class="fn">print</span>(f<span class="st">"Connecting to {device}"</span>)

<span class="cm"># enumerate — index + value (most useful)</span>
<span class="kw">for</span> i, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
    <span class="fn">print</span>(f<span class="st">"[{i}/{len(devices)}] {device}"</span>)

<span class="cm"># dict items</span>
<span class="kw">for</span> k, v <span class="kw">in</span> device_info.<span class="fn">items</span>():
    <span class="fn">print</span>(f<span class="st">"  {k}: {v}"</span>)

<span class="cm"># range() — numeric range</span>
<span class="kw">for</span> vlan <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">10</span>, <span class="nm">51</span>, <span class="nm">10</span>):  <span class="cm"># 10,20,30,40,50</span>
    <span class="fn">print</span>(f<span class="st">"vlan {vlan}"</span>)

<span class="cm"># zip() — two lists in parallel</span>
<span class="kw">for</span> name, ip <span class="kw">in</span> <span class="fn">zip</span>([<span class="st">"R1"</span>,<span class="st">"R2"</span>], [<span class="st">"10.1.1.1"</span>,<span class="st">"10.1.1.2"</span>]):
    <span class="fn">print</span>(f<span class="st">"{name} → {ip}"</span>)

<span class="cm"># break and continue</span>
<span class="kw">for</span> device <span class="kw">in</span> devices:
    <span class="kw">if not</span> <span class="fn">is_reachable</span>(device):
        <span class="kw">continue</span>          <span class="cm"># skip offline, move to next</span>
    <span class="fn">configure</span>(device)</pre></div>
<h4>while Loop — Retry and Polling</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">while loop: retry and poll patterns</span></div><pre><span class="kw">import</span> time

<span class="cm"># Retry pattern</span>
<span class="vr">attempts</span>  = <span class="nm">0</span>
<span class="vr">connected</span> = <span class="kw">False</span>
<span class="kw">while</span> attempts < <span class="nm">3</span> <span class="kw">and not</span> connected:
    <span class="kw">try</span>:
        <span class="fn">connect</span>(<span class="st">"10.1.1.1"</span>); connected = <span class="kw">True</span>
    <span class="kw">except</span>:
        attempts += <span class="nm">1</span>; time.<span class="fn">sleep</span>(<span class="nm">5</span>)

<span class="cm"># Poll until device is up</span>
<span class="kw">while not</span> <span class="fn">ping_ok</span>(<span class="st">"10.1.1.1"</span>):
    <span class="fn">print</span>(<span class="st">"Waiting for device..."</span>)
    time.<span class="fn">sleep</span>(<span class="nm">5</span>)
<span class="fn">print</span>(<span class="st">"Device is UP!"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m6-industry">
<h3>Loops in Real Network Automation</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">multi-device config push with error tracking</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="vr">devices</span>  = [<span class="st">"192.168.1.1"</span>, <span class="st">"192.168.1.2"</span>, <span class="st">"192.168.1.3"</span>]
<span class="vr">commands</span> = [<span class="st">"ntp server 8.8.8.8"</span>, <span class="st">"logging buffered 10000"</span>]
<span class="vr">success</span>, <span class="vr">failed</span> = [], []

<span class="kw">for</span> num, ip <span class="kw">in</span> <span class="fn">enumerate</span>(devices, <span class="nm">1</span>):
    <span class="fn">print</span>(f<span class="st">"[{num}/{len(devices)}] {ip}..."</span>, end=<span class="st">" "</span>)
    <span class="kw">try</span>:
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(device_type=<span class="st">"cisco_ios"</span>, host=ip,
                            username=<span class="st">"admin"</span>, password=<span class="st">"cisco"</span>) <span class="kw">as</span> net:
            net.<span class="fn">send_config_set</span>(commands)
            net.<span class="fn">save_config</span>()
        success.<span class="fn">append</span>(ip); <span class="fn">print</span>(<span class="st">"OK"</span>)
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        failed.<span class="fn">append</span>(ip); <span class="fn">print</span>(f<span class="st">"FAILED: {e}"</span>)

<span class="fn">print</span>(f<span class="st">"\nDone: {len(success)} OK | {len(failed)} failed"</span>)
<span class="kw">if</span> failed: <span class="fn">print</span>(<span class="st">"Failed:"</span>, failed)</pre></div>
</script>
<script type="text/x-tmpl" id="m6-practical">
<h3>Loops in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">device_scanner.py</span></div><pre><span class="kw">import</span> subprocess

<span class="kw">def</span> <span class="fn">ping_ok</span>(ip):
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip], capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="vr">devices</span> = [
    {<span class="st">"hostname"</span>:<span class="st">"R1"</span>,   <span class="st">"ip"</span>:<span class="st">"192.168.1.1"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"R2"</span>,   <span class="st">"ip"</span>:<span class="st">"192.168.1.2"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"SW-01"</span>,<span class="st">"ip"</span>:<span class="st">"192.168.1.10"</span>},
]
<span class="vr">results</span> = []
<span class="kw">for</span> num, d <span class="kw">in</span> <span class="fn">enumerate</span>(devices, <span class="nm">1</span>):
    up     = <span class="fn">ping_ok</span>(d[<span class="st">"ip"</span>])
    status = <span class="st">"UP"</span> <span class="kw">if</span> up <span class="kw">else</span> <span class="st">"DOWN"</span>
    results.<span class="fn">append</span>({**d, <span class="st">"status"</span>: status})
    <span class="fn">print</span>(f<span class="st">"[{num}/{len(devices)}] {d['hostname']:10} [{status}]"</span>)

<span class="vr">up_count</span> = <span class="fn">sum</span>(<span class="nm">1</span> <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if</span> r[<span class="st">"status"</span>]==<span class="st">"UP"</span>)
<span class="fn">print</span>(f<span class="st">"\n{up_count}/{len(devices)} reachable"</span>)</pre></div>
</script>

<div class="pi"><div class="ph" onclick="tP(this)"><div><div class="pn">Exercise 1 — Progress Report Loop</div><div class="pt">enumerate with count</div></div><span class="chv">▼</span></div>

<script type="text/x-tmpl" id="m6-interview">
<h3>Interview Questions — Loops</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">When would you use a <code>while</code> loop instead of a <code>for</code> loop in network automation?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Use <code>while</code> when you don't know how many iterations are needed: waiting for a device to boot (poll until it responds), retrying a connection up to N times with delays, reading a stream until EOF, or processing a queue until empty. Use <code>for</code> when you have a known collection to iterate — it's cleaner and cannot accidentally become an infinite loop.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Your loop sends commands to 100 devices. Device 47 raises an exception crashing the entire loop. How do you fix it so the loop continues with device 48?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Wrap the loop body in try/except. One bad device must never kill the entire batch:</p><div class="sbox"><span style="color:#ffa657">failed</span> = []
<span style="color:#ff7b72">for</span> device <span style="color:#ff7b72">in</span> devices:
    <span style="color:#ff7b72">try</span>:
        <span style="color:#d2a8ff">configure</span>(device)
    <span style="color:#ff7b72">except</span> Exception <span style="color:#ff7b72">as</span> e:
        <span style="color:#d2a8ff">print</span>(f<span style="color:#a5d6ff">"✗ {device['hostname']}: {e}"</span>)
        failed.<span style="color:#d2a8ff">append</span>(device[<span style="color:#a5d6ff">"hostname"</span>])</div><p style="margin-top:8px">Always collect failures to a list and print a summary at the end. This is a fundamental pattern in production automation.</p></div></div>
</script>
<script type="text/x-tmpl" id="m7-theory">
<h3>Functions — Write Once, Reuse Everywhere</h3>
<p>Functions are named reusable blocks of code. Instead of repeating SSH logic for every device, write it once as a function and call it anywhere. Functions make code readable, testable, and maintainable.</p>
<h4>Defining and Calling Functions</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">function syntax and features</span></div><pre><span class="cm"># Basic function with docstring</span>
<span class="kw">def</span> <span class="fn">ping_ok</span>(ip: str, timeout: int = <span class="nm">1</span>) -> bool:
    <span class="st">"""Return True if device responds to ping."""</span>
    <span class="kw">import</span> subprocess
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],
                        capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="cm"># Default parameters</span>
<span class="kw">def</span> <span class="fn">build_conn</span>(host, platform=<span class="st">"cisco_ios"</span>, port=<span class="nm">22</span>, timeout=<span class="nm">10</span>):
    <span class="kw">return</span> {<span class="st">"device_type"</span>:platform, <span class="st">"host"</span>:host,
             <span class="st">"port"</span>:port, <span class="st">"timeout"</span>:timeout}

<span class="cm"># Return multiple values (as tuple)</span>
<span class="kw">def</span> <span class="fn">scan</span>(devices):
    <span class="vr">up</span>   = [d <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> <span class="fn">ping_ok</span>(d[<span class="st">"ip"</span>])]
    <span class="vr">down</span> = [d <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> <span class="kw">not</span> <span class="fn">ping_ok</span>(d[<span class="st">"ip"</span>])]
    <span class="kw">return</span> up, down

<span class="vr">online</span>, <span class="vr">offline</span> = <span class="fn">scan</span>(inventory)

<span class="cm"># Call with keyword args — readable</span>
<span class="vr">c1</span> = <span class="fn">build_conn</span>(<span class="st">"10.1.1.1"</span>)
<span class="vr">c2</span> = <span class="fn">build_conn</span>(<span class="st">"10.1.1.2"</span>, platform=<span class="st">"juniper_junos"</span>)</pre></div>
<h4>*args and **kwargs</h4>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">flexible arguments</span></div><pre><span class="cm"># *args — variable positional arguments</span>
<span class="kw">def</span> <span class="fn">add_vlans</span>(*vlans):
    <span class="kw">for</span> v <span class="kw">in</span> vlans: <span class="fn">print</span>(f<span class="st">"vlan {v}"</span>)
<span class="fn">add_vlans</span>(<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>)

<span class="cm"># **kwargs — variable keyword arguments</span>
<span class="kw">def</span> <span class="fn">debug_device</span>(**info):
    <span class="kw">for</span> k, v <span class="kw">in</span> info.<span class="fn">items</span>(): <span class="fn">print</span>(f<span class="st">"  {k}: {v}"</span>)
<span class="fn">debug_device</span>(host=<span class="st">"10.1.1.1"</span>, user=<span class="st">"admin"</span>)</pre></div>
</script>
<script type="text/x-tmpl" id="m7-industry">
<h3>Functions in Real Network Automation</h3>
<p>Build a personal toolkit of reusable functions. A well-structured automation script has small, focused functions and a clean main block that calls them — like three layers: primitives → operations → main.</p>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">three-layer architecture</span></div><pre><span class="cm"># Layer 1 — primitives</span>
<span class="kw">def</span> <span class="fn">ping_ok</span>(ip): ...
<span class="kw">def</span> <span class="fn">ssh_run</span>(device, cmd): ...
<span class="kw">def</span> <span class="fn">build_conn</span>(device): ...

<span class="cm"># Layer 2 — device operations</span>
<span class="kw">def</span> <span class="fn">get_version</span>(device):
    <span class="kw">return</span> <span class="fn">ssh_run</span>(device, <span class="st">"show version"</span>)

<span class="kw">def</span> <span class="fn">audit_device</span>(device):
    <span class="kw">if not</span> <span class="fn">ping_ok</span>(device[<span class="st">"ip"</span>]):
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"error"</span>:<span class="st">"unreachable"</span>}
    ver = <span class="fn">get_version</span>(device)
    <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>, <span class="st">"version"</span>:ver}

<span class="cm"># Layer 3 — main</span>
<span class="vr">results</span> = [<span class="fn">audit_device</span>(d) <span class="kw">for</span> d <span class="kw">in</span> inventory]</pre></div>
</script>
<script type="text/x-tmpl" id="m7-practical">
<h3>Functions in Practice</h3>
<div class="cb"><div class="ch"><span class="lg">Python</span><span class="fn">net_toolkit.py — reusable function library</span></div><pre><span class="kw">import</span> subprocess, json
<span class="kw">from</span> datetime <span class="kw">import</span> datetime
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="kw">def</span> <span class="fn">ping_ok</span>(ip: str, timeout: int = <span class="nm">1</span>) -> bool:
    <span class="st">"""True if device responds to ping."""</span>
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],
                        capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">build_conn</span>(device: dict) -> dict:
    <span class="st">"""Build Netmiko connection dict from device record."""</span>
    <span class="kw">return</span> {
        <span class="st">"device_type"</span>: device[<span class="st">"platform"</span>],
        <span class="st">"host"</span>       : device[<span class="st">"ip"</span>],
        <span class="st">"username"</span>   : device[<span class="st">"username"</span>],
        <span class="st">"password"</span>   : device[<span class="st">"password"</span>],
        <span class="st">"timeout"</span>    : device.<span class="fn">get</span>(<span class="st">"timeout"</span>, <span class="nm">10</span>),
    }

<span class="kw">def</span> <span class="fn">save_report</span>(data, name: str = <span class="st">"report"</span>) -> str:
    <span class="st">"""Save data to timestamped JSON file."""</span>
    ts   = datetime.<span class="fn">now</span>().<span class="fn">strftime</span>(<span class="st">"%Y%m%d_%H%M"</span>)
    path = f<span class="st">"{name}_{ts}.json"</span>
    <span class="kw">with</span> <span class="fn">open</span>(path, <span class="st">"w"</span>) <span class="kw">as</span> f:
        json.<span class="fn">dump</span>(data, f, indent=<span class="nm">2</span>)
    <span class="fn">print</span>(f<span class="st">"Saved: {path}"</span>)
    <span class="kw">return</span> path

<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    <span class="fn">print</span>(<span class="st">"net_toolkit — import this module, don't run it directly"</span>)</pre></div>
</script>

<div class="pb" style="display:none"><p>Write <code>check_device(device, cpu_threshold=90, check_ntp=True)</code> returning (status, message). Status: "PASS", "FAIL", or "SKIP". Test with three device dicts.</p>

    {<span class="st">"hostname"</span>:<span class="st">"R2"</span>,<span class="st">"reachable"</span>:<span class="kw">True</span>, <span class="st">"cpu"</span>:<span class="nm">95</span>,<span class="st">"ntp_synced"</span>:<span class="kw">True</span>},
