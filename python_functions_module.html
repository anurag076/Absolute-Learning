<script type="text/x-tmpl" id="m11-theory">
<h3>Passing Functions as Arguments — Callbacks</h3>
<p>In Python, functions are objects. You can pass a function as an argument to another function. This might sound weird but it's incredibly useful — it lets you write generic loops that do customised work per device.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">function_as_argument.py</span></div><pre><span class="cm"># A generic "run for all devices" function</span>
<span class="kw">def</span> <span class="fn">for_each_device</span>(devices: list, action) -> list:
    <span class="st">"""Run 'action' function for each device. Collect and return results."""</span>
    results = []
    <span class="kw">for</span> num, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
        <span class="fn">print</span>(f<span class="st">"[{num}/{len(devices)}] {device['hostname']}..."</span>, end=<span class="st">" "</span>)
        result = <span class="fn">action</span>(device)     <span class="cm"># call whatever function was passed</span>
        results.<span class="fn">append</span>(result)
        <span class="fn">print</span>(<span class="st">"OK"</span> <span class="kw">if</span> result.<span class="fn">get</span>(<span class="st">"ok"</span>) <span class="kw">else</span> <span class="st">"FAIL"</span>)
    <span class="kw">return</span> results

<span class="cm"># Different action functions</span>
<span class="kw">def</span> <span class="fn">check_ping</span>(device):
    <span class="kw">return</span> {<span class="st">"hostname"</span>:device[<span class="st">"hostname"</span>], <span class="st">"ok"</span>:<span class="fn">ping</span>(device[<span class="st">"ip"</span>])}

<span class="kw">def</span> <span class="fn">get_version</span>(device):
    <span class="kw">return</span> <span class="fn">run_commands</span>(device, [<span class="st">"show version"</span>])

<span class="kw">def</span> <span class="fn">backup_now</span>(device):
    output = <span class="fn">ssh_cmd</span>(device, <span class="st">"show running-config"</span>)
    fname  = f<span class="st">"{device['hostname']}_backup.txt"</span>
    <span class="kw">with</span> <span class="fn">open</span>(fname, <span class="st">"w"</span>) <span class="kw">as</span> f: f.<span class="fn">write</span>(output <span class="kw">or</span> <span class="st">""</span>)
    <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>, <span class="st">"hostname"</span>:device[<span class="st">"hostname"</span>], <span class="st">"file"</span>:fname}

<span class="cm"># Pass different actions to the same generic loop</span>
ping_results    = <span class="fn">for_each_device</span>(devices, check_ping)
version_results = <span class="fn">for_each_device</span>(devices, get_version)
backup_results  = <span class="fn">for_each_device</span>(devices, backup_now)</pre></div>
</script>

<script type="text/x-tmpl" id="m11-industry">
<h3>Generic Loops in Production</h3>
<p>This pattern — a generic loop that accepts a function — means you write the loop boilerplate (progress printing, error handling, result collection) once, and swap in different actions. It's used in frameworks like Nornir which does exactly this at scale.</p>
<div class="note f"><p><strong>This is how Nornir works internally.</strong> You define tasks as functions, and Nornir's runner calls your task function for every host. Your task function gets a Task object, does its work, returns a result. Generic loop + swappable function = Nornir.</p></div>
</script>

<script type="text/x-tmpl" id="m11-practical">
<h3>Generic Device Runner — EVE-NG</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">generic_runner.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> yaml, json
<span class="kw">from</span> eve_utils <span class="kw">import</span> ping, ssh_cmd, save_report

<span class="kw">def</span> <span class="fn">run_task</span>(devices: list, task_fn, task_name: str = <span class="st">"task"</span>) -> list:
    <span class="st">"""Generic runner — call task_fn for every device.</span>

<span class="st">    Args:</span>
<span class="st">        devices  : List of device dicts from inventory.</span>
<span class="st">        task_fn  : Function to call for each device.</span>
<span class="st">        task_name: Label for progress output.</span>

<span class="st">    Returns:</span>
<span class="st">        List of result dicts from task_fn.</span>
<span class="st">    """</span>
    total   = <span class="fn">len</span>(devices)
    results = []
    <span class="fn">print</span>(f<span class="st">"Running [{task_name}] on {total} devices..."</span>)
    <span class="kw">for</span> num, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
        name = device[<span class="st">"hostname"</span>]
        <span class="fn">print</span>(f<span class="st">"  [{num:02d}/{total}] {name}..."</span>, end=<span class="st">" "</span>)
        <span class="kw">try</span>:
            result = <span class="fn">task_fn</span>(device)
            <span class="fn">print</span>(<span class="st">"OK"</span> <span class="kw">if</span> result.<span class="fn">get</span>(<span class="st">"ok"</span>,<span class="kw">True</span>) <span class="kw">else</span> <span class="st">"FAIL"</span>)
        <span class="kw">except</span> Exception <span class="kw">as</span> e:
            result = {<span class="st">"hostname"</span>:name,<span class="st">"ok"</span>:<span class="kw">False</span>,<span class="st">"error"</span>:<span class="fn">str</span>(e)}
            <span class="fn">print</span>(f<span class="st">"ERROR: {e}"</span>)
        results.<span class="fn">append</span>(result)
    ok = <span class="fn">sum</span>(<span class="nm">1</span> <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if</span> r.<span class="fn">get</span>(<span class="st">"ok"</span>,<span class="kw">True</span>))
    <span class="fn">print</span>(f<span class="st">"Done: {ok}/{total} succeeded"</span>)
    <span class="kw">return</span> results

<span class="cm"># Define task functions</span>
<span class="kw">def</span> <span class="fn">task_ping</span>(device):
    up = <span class="fn">ping</span>(device[<span class="st">"ip"</span>])
    <span class="kw">return</span> {<span class="st">"hostname"</span>:device[<span class="st">"hostname"</span>],<span class="st">"ok"</span>:up,<span class="st">"status"</span>:<span class="st">"UP"</span> <span class="kw">if</span> up <span class="kw">else</span> <span class="st">"DOWN"</span>}

<span class="kw">def</span> <span class="fn">task_get_version</span>(device):
    out = <span class="fn">ssh_cmd</span>(device, <span class="st">"show version"</span>)
    <span class="kw">return</span> {<span class="st">"hostname"</span>:device[<span class="st">"hostname"</span>],<span class="st">"ok"</span>:out <span class="kw">is not</span> <span class="kw">None</span>,<span class="st">"output"</span>:out}

<span class="cm"># Use the generic runner with different tasks</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

ping_results    = <span class="fn">run_task</span>(devices, task_ping,        <span class="st">"ping check"</span>)
version_results = <span class="fn">run_task</span>(devices, task_get_version,  <span class="st">"get version"</span>)

<span class="fn">save_report</span>(ping_results,    <span class="st">"ping"</span>)
<span class="fn">save_report</span>(version_results, <span class="st">"version"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m12-theory">
<h3>Capstone — A Complete Function-Based Network Automation Script</h3>
<p>This capstone brings together everything from this module. The script is built from clean, documented, composable functions. Each function does one thing. The main block is short and readable. This is exactly how professional network automation code is written.</p>
<h4>What the Capstone Builds</h4>
<div class="g2">
  <div class="card e"><h5>Toolkit Layer</h5><p>ping(), load_lab(), ssh_run_commands(), push_baseline_config(), save_report() — all with docstrings and type hints.</p></div>
  <div class="card"><h5>Operation Layer</h5><p>check_device(), audit_device(), configure_device() — compose the toolkit functions.</p></div>
  <div class="card g"><h5>Runner</h5><p>run_task() generic runner — calls any operation on all devices.</p></div>
  <div class="card y"><h5>Main Script</h5><p>10 lines — loads inventory, runs tasks, saves reports. Zero complexity.</p></div>
</div>
</script>

<script type="text/x-tmpl" id="m12-industry">
<h3>This is Production-Quality Code Structure</h3>
<p>The architecture in the capstone is used in real enterprise automation scripts. If you took this structure to a job interview and explained how the layers work, any senior network automation engineer would be impressed.</p>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab — Running the Capstone</div><p>With your EVE-NG lab running and SSH configured on all devices, the capstone script will: check all devices for reachability, SSH to reachable ones, collect show commands, optionally push a baseline config, and save a complete JSON report — all in a clean, maintainable, extensible structure.</p></div>
</script>

<script type="text/x-tmpl" id="m12-practical">
<h3>Full Capstone Script</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">network_automation_capstone.py</span><span class="etag">EVE-NG</span></div><pre><span class="st">"""
network_automation_capstone.py
================================
Full function-based network automation script.
Loads EVE-NG inventory, audits all devices, saves report.
"""</span>
<span class="kw">import</span> subprocess, yaml, json, os
<span class="kw">from</span> datetime <span class="kw">import</span> datetime
<span class="kw">from</span> typing <span class="kw">import</span> Dict, List, Optional
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="cm"># ═══════════════════════════════════════════════
# LAYER 1 — Primitives
# ═══════════════════════════════════════════════</span>

<span class="kw">def</span> <span class="fn">ping</span>(ip: str, timeout: int = <span class="nm">1</span>) -> bool:
    <span class="st">"""True if device responds to ping."""</span>
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">load_lab</span>(path: str = <span class="st">"eve_inventory.yaml"</span>) -> Dict:
    <span class="st">"""Load inventory YAML. Returns empty dict on error."""</span>
    <span class="kw">try</span>:
        <span class="kw">with</span> <span class="fn">open</span>(path) <span class="kw">as</span> f: <span class="kw">return</span> yaml.<span class="fn">safe_load</span>(f)
    <span class="kw">except</span> FileNotFoundError:
        <span class="fn">print</span>(f<span class="st">"Inventory not found: {path}"</span>); <span class="kw">return</span> {}

<span class="kw">def</span> <span class="fn">ssh_commands</span>(device: Dict, commands: List[str]) -> Dict:
    <span class="st">"""Run show commands on device. Returns ok/outputs dict."""</span>
    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>],<span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],<span class="st">"timeout"</span>:<span class="nm">10</span>}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            outputs = {cmd: net.<span class="fn">send_command</span>(cmd) <span class="kw">for</span> cmd <span class="kw">in</span> commands}
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>,<span class="st">"outputs"</span>:outputs,<span class="st">"error"</span>:<span class="kw">None</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>,<span class="st">"outputs"</span>:{},<span class="st">"error"</span>:<span class="fn">str</span>(e)}

<span class="kw">def</span> <span class="fn">save_report</span>(data, name: str = <span class="st">"report"</span>) -> str:
    <span class="st">"""Save data as timestamped JSON. Returns filename."""</span>
    ts   = datetime.<span class="fn">now</span>().<span class="fn">strftime</span>(<span class="st">"%Y%m%d_%H%M"</span>)
    path = f<span class="st">"{name}_{ts}.json"</span>
    <span class="kw">with</span> <span class="fn">open</span>(path,<span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(data,f,indent=<span class="nm">2</span>)
    <span class="fn">print</span>(f<span class="st">"Saved: {path}"</span>); <span class="kw">return</span> path

<span class="cm"># ═══════════════════════════════════════════════
# LAYER 2 — Device Operations
# ═══════════════════════════════════════════════</span>

AUDIT_COMMANDS = [
    <span class="st">"show version"</span>,
    <span class="st">"show ip interface brief"</span>,
    <span class="st">"show ip route summary"</span>,
]

<span class="kw">def</span> <span class="fn">audit_device</span>(device: Dict) -> Dict:
    <span class="st">"""Full audit of one device. Returns complete result dict."""</span>
    name = device[<span class="st">"hostname"</span>]

    <span class="kw">if not</span> <span class="fn">ping</span>(device[<span class="st">"ip"</span>]):                  <span class="cm"># layer 1 call</span>
        <span class="kw">return</span> {<span class="st">"hostname"</span>:name,<span class="st">"ok"</span>:<span class="kw">False</span>,<span class="st">"reachable"</span>:<span class="kw">False</span>,<span class="st">"error"</span>:<span class="st">"unreachable"</span>}

    result = <span class="fn">ssh_commands</span>(device, AUDIT_COMMANDS)  <span class="cm"># layer 1 call</span>
    <span class="kw">return</span> {
        <span class="st">"hostname"</span>  : name,
        <span class="st">"ip"</span>        : device[<span class="st">"ip"</span>],
        <span class="st">"type"</span>      : device.<span class="fn">get</span>(<span class="st">"type"</span>),
        <span class="st">"reachable"</span> : <span class="kw">True</span>,
        <span class="st">"ok"</span>        : result[<span class="st">"ok"</span>],
        <span class="st">"outputs"</span>   : result[<span class="st">"outputs"</span>],
        <span class="st">"error"</span>     : result[<span class="st">"error"</span>]
    }

<span class="cm"># ═══════════════════════════════════════════════
# LAYER 3 — Generic Runner
# ═══════════════════════════════════════════════</span>

<span class="kw">def</span> <span class="fn">run_task</span>(devices: List[Dict], task_fn, label: str = <span class="st">"task"</span>) -> List[Dict]:
    <span class="st">"""Run task_fn on every device. Collect and return results."""</span>
    total   = <span class="fn">len</span>(devices)
    results = []
    <span class="fn">print</span>(f<span class="st">"\n[{label}] Running on {total} devices..."</span>)
    <span class="kw">for</span> num, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
        name = device[<span class="st">"hostname"</span>]
        <span class="fn">print</span>(f<span class="st">"  [{num:02d}/{total}] {name}..."</span>, end=<span class="st">" "</span>)
        result = <span class="fn">task_fn</span>(device)
        results.<span class="fn">append</span>(result)
        <span class="fn">print</span>(<span class="st">"OK"</span> <span class="kw">if</span> result.<span class="fn">get</span>(<span class="st">"ok"</span>) <span class="kw">else</span> f<span class="st">"FAIL ({result.get('error','')})"</span>)
    ok = <span class="fn">sum</span>(<span class="nm">1</span> <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if</span> r.<span class="fn">get</span>(<span class="st">"ok"</span>))
    <span class="fn">print</span>(f<span class="st">"  → {ok}/{total} succeeded"</span>)
    <span class="kw">return</span> results

<span class="cm"># ═══════════════════════════════════════════════
# MAIN — Orchestration (10 lines)
# ═══════════════════════════════════════════════</span>

<span class="kw">if</span> __name__ == <span class="st">"__main__"</span>:
    lab     = <span class="fn">load_lab</span>()
    <span class="kw">if not</span> lab:
        <span class="fn">print</span>(<span class="st">"No inventory found."</span>); exit(<span class="nm">1</span>)

    devices = lab[<span class="st">"devices"</span>]
    <span class="fn">print</span>(f<span class="st">"Lab: {lab.get('lab_name','EVE-NG')} — {len(devices)} devices"</span>)

    audit_results = <span class="fn">run_task</span>(devices, audit_device, <span class="st">"Full Audit"</span>)
    <span class="fn">save_report</span>(audit_results, <span class="st">"lab_audit"</span>)

    ok   = [r <span class="kw">for</span> r <span class="kw">in</span> audit_results <span class="kw">if</span> r[<span class="st">"ok"</span>]]
    fail = [r <span class="kw">for</span> r <span class="kw">in</span> audit_results <span class="kw">if not</span> r[<span class="st">"ok"</span>]]
    <span class="fn">print</span>(f<span class="st">"\n=== SUMMARY ==="</span>)
    <span class="fn">print</span>(f<span class="st">"Total:   {len(devices)}"</span>)
    <span class="fn">print</span>(f<span class="st">"Success: {len(ok)}"</span>)
    <span class="fn">print</span>(f<span class="st">"Failed:  {len(fail)}"</span>)
    <span class="kw">for</span> r <span class="kw">in</span> fail: <span class="fn">print</span>(f<span class="st">"  ✗ {r['hostname']}: {r.get('error','?')}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m12-flow">
<h3>Capstone Architecture — Three Layers</h3>
<div class="fb">
  <div class="fr"><div class="fn2 b" style="width:100%">Layer 1 (Primitives): ping() · load_lab() · ssh_commands() · save_report()</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 f" style="width:100%">Layer 2 (Operations): audit_device() — calls ping() and ssh_commands()</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 g" style="width:100%">Layer 3 (Runner): run_task(devices, audit_device) — calls Layer 2</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 y" style="width:100%">Main: load → run_task → save_report — 10 lines, zero complexity</div></div>
</div>
</script>

var M=[
  {id:1,  title:"What is a Function? Why You Need One",       level:"basic"},

var cur=0;
var TABS=["theory","industry","practical","flow","practice"];
function getSection(id,tab){var el=document.getElementById("m"+id+"-"+tab);return el?el.textContent:"<p style='color:var(--mut)'>Loading...</p>";}
function renderSidebar(){var h="";for(var i=0;i<M.length;i++){h+="<div class='ti"+(i===cur?" active":"")+"' onclick='selectTopic("+i+")'><span class='tn'>"+String(M[i].id).padStart(2,"0")+"</span><span class='tt'>"+M[i].title+"</span><span class='lbg lb-"+M[i].level+"'>"+M[i].level+"</span></div>";}document.getElementById("tlist").innerHTML=h;}
function renderContent(){var m=M[cur];document.getElementById("ttl").textContent=m.title;var lb=document.getElementById("tlvl");lb.textContent=m.level;lb.className="lbg lb-"+m.level;lb.style.display="inline-block";for(var i=0;i<TABS.length;i++)document.getElementById(TABS[i]).innerHTML=getSection(m.id,TABS[i]);document.getElementById("sft").textContent="Topic "+m.id+" of "+M.length+"  ·  "+m.level;}
function selectTopic(i){cur=i;renderSidebar();renderContent();switchTab("theory");document.getElementById("ct").scrollTop=0;closeSidebar();}
function switchTab(tab){document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("active");});document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});document.getElementById(tab).classList.add("active");var idx=TABS.indexOf(tab);if(idx>=0)document.querySelectorAll(".tab")[idx].classList.add("active");document.getElementById("ct").scrollTop=0;}
document.querySelectorAll(".tab").forEach(function(el){el.addEventListener("click",function(){switchTab(el.getAttribute("data-tab"));});});
function tP(header){var body=header.nextElementSibling;var chev=header.querySelector(".chv");var open=body.style.display==="block";body.style.display=open?"none":"block";if(chev)chev.classList.toggle("op",!open);}
function tS(btn){var box=btn.nextElementSibling;var open=box.classList.contains("open");box.classList.toggle("open",!open);btn.textContent=open?"▶ Show Solution":"▼ Hide Solution";}
function openSidebar(){document.getElementById("sb").classList.add("open");document.getElementById("ovl").classList.add("open");}
function closeSidebar(){document.getElementById("sb").classList.remove("open");document.getElementById("ovl").classList.remove("open");}
document.getElementById("hbg").addEventListener("click",function(){document.getElementById("sb").classList.contains("open")?closeSidebar():openSidebar();});
document.getElementById("ovl").addEventListener("click",closeSidebar);
renderSidebar();renderContent();
</script>
