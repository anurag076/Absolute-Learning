<!-- ═══ TOPIC 1 ═══ -->
<script type="text/x-tmpl" id="m1-theory">
<h3>What is a Loop and Why Does a Network Engineer Need It?</h3>
<p>Before any Python syntax — think about your actual job. You SSH into 10 routers one by one and run the same command. You check the same VLAN on 50 switches. You ping 30 hosts from a list. That's a loop. You're doing the same thing to a collection of things. Python just does it 100x faster.</p>
<h4>Two Types of Loops</h4>
<div class="g2">
  <div class="card"><h5>for loop</h5><p>Use when you know the collection — a list of device IPs, a list of VLANs, an API response. Loop <em>for each item</em> in that list.</p></div>
  <div class="card y"><h5>while loop</h5><p>Use when you don't know how many times — keep looping <em>while</em> a condition is true. Waiting for a device to come up, polling an API task.</p></div>
</div>
<h4>Basic Syntax</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">basic_loop.py</span></div><pre><span class="cm"># for loop — goes through each item</span>
devices = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"SW-01"</span>, <span class="st">"SW-02"</span>]

<span class="kw">for</span> device <span class="kw">in</span> devices:
    <span class="fn">print</span>(<span class="st">"Connecting to:"</span>, device)

<span class="cm"># while loop — keep going until condition is False</span>
attempts = <span class="nm">0</span>
<span class="kw">while</span> attempts &lt; <span class="nm">3</span>:
    <span class="fn">print</span>(<span class="st">"Attempt"</span>, attempts + <span class="nm">1</span>)
    attempts += <span class="nm">1</span></pre></div>
<div class="note p"><p><strong>Senior engineer tip:</strong> In network automation, 90% of loops are <code>for</code> loops — over device lists, interface lists, API responses. Use <code>while</code> mainly for polling — waiting until a device is reachable or an async job finishes.</p></div>
</script>

<script type="text/x-tmpl" id="m1-industry">
<h3>Loops Replace Hours of Manual Work</h3>
<table class="tbl"><thead><tr><th>Manual Task</th><th>With a Loop</th><th>Time Saved</th></tr></thead><tbody>
<tr><td>SSH into 50 switches one by one, check version</td><td><code>for device in switches: check_version(device)</code></td><td>2 hrs → 30 sec</td></tr>
<tr><td>Ping 100 hosts from a list</td><td><code>for host in host_list: ping(host)</code></td><td>45 min → 10 sec</td></tr>
<tr><td>Add VLAN 200 to 30 access switches</td><td><code>for sw in access_switches: add_vlan(sw, 200)</code></td><td>1 hr → 1 min</td></tr>
<tr><td>Backup running config on all devices</td><td><code>for device in all_devices: backup(device)</code></td><td>3 hrs → 2 min</td></tr>
</tbody></table>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab</div><p>In your EVE-NG lab, instead of opening PuTTY to each device separately, a Python loop connects to all of them automatically. Same concept as production — just different IP addresses.</p></div>
</script>

<script type="text/x-tmpl" id="m1-practical">
<h3>Your First Network Loop</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">first_loop.py</span></div><pre><span class="cm"># A simple but real device report loop</span>
devices = [
    <span class="st">"192.168.100.1"</span>,   <span class="cm"># R1</span>
    <span class="st">"192.168.100.2"</span>,   <span class="cm"># R2</span>
    <span class="st">"192.168.100.10"</span>,  <span class="cm"># SW-01</span>
    <span class="st">"192.168.100.11"</span>,  <span class="cm"># SW-02</span>
]

<span class="fn">print</span>(<span class="st">"Device Scan Report"</span>)
<span class="fn">print</span>(<span class="st">"="</span> * <span class="nm">30</span>)

<span class="kw">for</span> ip <span class="kw">in</span> devices:
    <span class="fn">print</span>(f<span class="st">"Checking: {ip}"</span>)

<span class="fn">print</span>(f<span class="st">"Total: {len(devices)} devices"</span>)

<span class="cm"># range() — loop a set number of times</span>
<span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">1</span>, <span class="nm">6</span>):
    <span class="fn">print</span>(<span class="st">"Attempt"</span>, i)     <span class="cm"># 1, 2, 3, 4, 5</span>

<span class="cm"># Useful: generate VLAN IDs</span>
<span class="kw">for</span> vlan <span class="kw">in</span> <span class="fn">range</span>(<span class="nm">10</span>, <span class="nm">51</span>, <span class="nm">10</span>):
    <span class="fn">print</span>(f<span class="st">"vlan {vlan}"</span>)    <span class="cm"># 10, 20, 30, 40, 50</span></pre></div>
</script>

<script type="text/x-tmpl" id="m1-flow">
<h3>How a for Loop Works Step by Step</h3>
<div class="fb">
  <div class="fr"><div class="fn2 p">devices = ["R1","R2","R3"]</div></div>
  <div style="height:6px"></div>
  <div class="fr"><div class="fn2 b">Iteration 1: device = "R1" → run body</div></div>
  <div class="fr"><div class="fn2 b">Iteration 2: device = "R2" → run body</div></div>
  <div class="fr"><div class="fn2 b">Iteration 3: device = "R3" → run body</div></div>
  <div style="height:6px"></div>
  <div class="fr"><div class="fn2 g">No more items → loop ends → script continues</div></div>
</div>
<h4>for vs while — Quick Decision</h4>
<table class="tbl"><thead><tr><th>Situation</th><th>Use</th></tr></thead><tbody>
<tr><td>Loop over a list of devices / VLANs / interfaces</td><td><code>for</code></td></tr>
<tr><td>Loop N times (range)</td><td><code>for</code></td></tr>
<tr><td>Wait until device is reachable</td><td><code>while</code></td></tr>
<tr><td>Retry until API succeeds</td><td><code>while</code></td></tr>
</tbody></table>
</script>

<!-- ═══ TOPIC 2 ═══ -->
<script type="text/x-tmpl" id="m2-theory">
<h3>for Loop — Every Variation You'll Actually Use</h3>
<p>The <code>for</code> loop works on anything iterable — lists, dicts, strings, tuples, file lines, API responses. Here's every pattern you'll use in network automation.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">for_loop_all_patterns.py</span></div><pre><span class="cm"># Loop over a list</span>
vlans = [<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>]
<span class="kw">for</span> vlan <span class="kw">in</span> vlans:
    <span class="fn">print</span>(f<span class="st">"vlan {vlan}"</span>)

<span class="cm"># Loop over dict keys</span>
iface_ips = {<span class="st">"GigE0/0"</span>: <span class="st">"10.0.0.1"</span>, <span class="st">"GigE0/1"</span>: <span class="st">"10.0.1.1"</span>}
<span class="kw">for</span> iface <span class="kw">in</span> iface_ips:          <span class="cm"># keys only</span>
    <span class="fn">print</span>(iface)

<span class="cm"># Loop over dict keys AND values — use .items()</span>
<span class="kw">for</span> iface, ip <span class="kw">in</span> iface_ips.<span class="fn">items</span>():
    <span class="fn">print</span>(f<span class="st">"interface {iface}"</span>)
    <span class="fn">print</span>(f<span class="st">" ip address {ip} 255.255.255.0"</span>)

<span class="cm"># Loop over list of dicts (most common in API responses)</span>
devices = [
    {<span class="st">"hostname"</span>: <span class="st">"SW-01"</span>, <span class="st">"ip"</span>: <span class="st">"10.1.1.1"</span>},
    {<span class="st">"hostname"</span>: <span class="st">"SW-02"</span>, <span class="st">"ip"</span>: <span class="st">"10.1.1.2"</span>},
]
<span class="kw">for</span> device <span class="kw">in</span> devices:
    <span class="fn">print</span>(device[<span class="st">"hostname"</span>], device[<span class="st">"ip"</span>])</pre></div>
</script>

<script type="text/x-tmpl" id="m2-industry">
<h3>for Loops on Real API Responses</h3>
<p>API responses are lists of dicts. Your loop goes through each device/interface/VLAN and does something with it. The structure is always the same.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">parse_dnac_response.py</span></div><pre>devices = r.<span class="fn">json</span>()[<span class="st">"response"</span>]   <span class="cm"># list of device dicts</span>

<span class="kw">for</span> d <span class="kw">in</span> devices:
    name   = d[<span class="st">"hostname"</span>]
    ip     = d[<span class="st">"managementIpAddress"</span>]
    status = d[<span class="st">"reachabilityStatus"</span>]
    <span class="fn">print</span>(f<span class="st">"{name:20} {ip:16} {status}"</span>)</pre></div>
<div class="note g"><p><strong>The pattern never changes:</strong> get a list from somewhere → loop over it → do something per item. That "something" changes (print, SSH, configure, compare) but the loop structure stays identical.</p></div>
</script>

<script type="text/x-tmpl" id="m3-theory">
<h3>while Loop — Keep Going Until Something Changes</h3>
<p>The <code>while</code> loop keeps running as long as a condition is True. In networking this is perfect for waiting — a device to come up after a reboot, an API async job to finish, a link to recover.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">while_patterns.py</span></div><pre><span class="cm"># Basic while — runs until count hits limit</span>
count = <span class="nm">0</span>
<span class="kw">while</span> count &lt; <span class="nm">5</span>:
    <span class="fn">print</span>(<span class="st">"Polling..."</span>)
    count += <span class="nm">1</span>

<span class="cm"># while True + break — most common pattern</span>
<span class="kw">import</span> time

attempt = <span class="nm">0</span>
<span class="kw">while</span> <span class="kw">True</span>:
    attempt += <span class="nm">1</span>
    <span class="fn">print</span>(f<span class="st">"Attempt {attempt}: checking device..."</span>)
    <span class="kw">if</span> attempt == <span class="nm">3</span>:       <span class="cm"># simulate device coming up</span>
        <span class="fn">print</span>(<span class="st">"Device is UP!"</span>)
        <span class="kw">break</span>
    <span class="kw">if</span> attempt &gt;= <span class="nm">5</span>:
        <span class="fn">print</span>(<span class="st">"Giving up."</span>)
        <span class="kw">break</span>
    time.<span class="fn">sleep</span>(<span class="nm">2</span>)

<span class="cm"># while-else — else runs only if we didn't break</span>
attempts = <span class="nm">0</span>
<span class="kw">while</span> attempts &lt; <span class="nm">5</span>:
    <span class="kw">if</span> <span class="fn">device_is_up</span>():
        <span class="fn">print</span>(<span class="st">"Connected!"</span>)
        <span class="kw">break</span>
    attempts += <span class="nm">1</span>
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="st">"All attempts failed."</span>)   <span class="cm"># only if no break</span></pre></div>
<div class="note r"><p><strong>Danger — infinite loop:</strong> <code>while True:</code> with no <code>break</code> runs forever. Always have an exit condition — a <code>break</code> or a counter that eventually makes the condition False.</p></div>
</script>

<script type="text/x-tmpl" id="m3-industry">
<h3>while Loops in Real Network Automation</h3>
<h4>Three Real Scenarios</h4>
<ul>
<li><strong>Device reboot:</strong> You rebooted a router. Poll every 5 seconds until ping responds.</li>
<li><strong>DNAC async task:</strong> You posted a template deployment. Keep polling <code>/task/{id}</code> until status is "success" or "failed".</li>
<li><strong>EVE-NG lab startup:</strong> You started a topology. Wait until all VMs respond to ping before running your automation script.</li>
</ul>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab Use Case</div><p>After you click "Start" on a lab topology, devices take 30-90 seconds to boot. A while loop that pings every 5 seconds and tells you exactly when each device is ready is genuinely useful — run it, walk away, and it alerts you when the lab is ready.</p></div>
</script>

<script type="text/x-tmpl" id="m3-practical">
<h3>while Loop — EVE-NG Boot Waiter</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">wait_for_lab.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> subprocess, time

<span class="kw">def</span> <span class="fn">ping_ok</span>(ip):
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],
                        capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="cm"># Wait for all EVE-NG devices to boot</span>
lab_devices = {
    <span class="st">"R1"</span>   : <span class="st">"192.168.100.1"</span>,
    <span class="st">"R2"</span>   : <span class="st">"192.168.100.2"</span>,
    <span class="st">"SW-01"</span>: <span class="st">"192.168.100.10"</span>,
}

ready    = <span class="fn">set</span>()
max_wait = <span class="nm">120</span>   <span class="cm"># 2 minutes max</span>
elapsed  = <span class="nm">0</span>

<span class="fn">print</span>(<span class="st">"Waiting for EVE-NG lab to be ready..."</span>)

<span class="kw">while</span> <span class="fn">len</span>(ready) &lt; <span class="fn">len</span>(lab_devices) <span class="kw">and</span> elapsed &lt; max_wait:
    <span class="kw">for</span> name, ip <span class="kw">in</span> lab_devices.<span class="fn">items</span>():
        <span class="kw">if</span> name <span class="kw">not in</span> ready <span class="kw">and</span> <span class="fn">ping_ok</span>(ip):
            ready.<span class="fn">add</span>(name)
            <span class="fn">print</span>(f<span class="st">"  ✓ {name} is UP  ({len(ready)}/{len(lab_devices)})"</span>)
    <span class="kw">if</span> <span class="fn">len</span>(ready) &lt; <span class="fn">len</span>(lab_devices):
        time.<span class="fn">sleep</span>(<span class="nm">5</span>)
        elapsed += <span class="nm">5</span>

<span class="kw">if</span> <span class="fn">len</span>(ready) == <span class="fn">len</span>(lab_devices):
    <span class="fn">print</span>(<span class="st">"All devices ready! Starting automation..."</span>)
<span class="kw">else</span>:
    <span class="fn">print</span>(f<span class="st">"Timeout! Only {len(ready)}/{len(lab_devices)} came up."</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m3-flow">
<h3>while Loop Flow</h3>
<div class="fb">
  <div class="fr"><div class="fn2 p">Start</div><div class="fa">→</div><div class="fn2 y">Check condition — True?</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 r">False → exit loop, continue script</div></div>
  <div class="fr"><div class="fn2 g">True → run body → go back, check again</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 b">break anywhere → exit immediately</div></div>
</div>
</script>

<script type="text/x-tmpl" id="m4-theory">
<h3>break, continue, pass — Controlling Your Loop</h3>
<div class="g3">
  <div class="card g"><h5>break</h5><p>Stop the loop completely right now. Jump out and continue the code after the loop.</p></div>
  <div class="card y"><h5>continue</h5><p>Skip the rest of this iteration. Jump to the top and start the next item.</p></div>
  <div class="card"><h5>pass</h5><p>Do nothing. A placeholder when a code block is required but you haven't written it yet.</p></div>
</div>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">break_continue_pass.py</span></div><pre><span class="cm"># break — stop when you find what you need</span>
devices = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"R3"</span>, <span class="st">"R4"</span>]
<span class="kw">for</span> d <span class="kw">in</span> devices:
    <span class="fn">print</span>(<span class="st">"Checking"</span>, d)
    <span class="kw">if</span> d == <span class="st">"R3"</span>:
        <span class="fn">print</span>(<span class="st">"Found R3! Stopping."</span>)
        <span class="kw">break</span>         <span class="cm"># R4 never gets checked</span>

<span class="cm"># continue — skip offline devices, carry on</span>
status = {<span class="st">"R1"</span>:<span class="st">"online"</span>, <span class="st">"R2"</span>:<span class="st">"offline"</span>, <span class="st">"R3"</span>:<span class="st">"online"</span>}
<span class="kw">for</span> device, s <span class="kw">in</span> status.<span class="fn">items</span>():
    <span class="kw">if</span> s == <span class="st">"offline"</span>:
        <span class="fn">print</span>(f<span class="st">"Skipping {device} — offline"</span>)
        <span class="kw">continue</span>      <span class="cm"># jump to next iteration</span>
    <span class="fn">print</span>(f<span class="st">"Configuring {device}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m4-industry">
<h3>Why These Matter in Production Scripts</h3>
<p><code>continue</code> is the most used. When looping over 100 devices and 3 are offline, you don't let those 3 crash your whole script. You skip them, log them, and keep going with the other 97.</p>
<div class="note g"><p><strong>Golden rule:</strong> In any bulk script, check if a device is reachable before configuring it. Use <code>continue</code> to skip unreachable ones. Never let one bad device kill the entire loop.</p></div>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab</div><p>In your lab, some VMs might not be started or might have crashed. A <code>continue</code> in your loop skips them gracefully and works on the devices that ARE up — much better than your script crashing on the first offline device.</p></div>
</script>

<script type="text/x-tmpl" id="m4-practical">
<h3>break and continue in Real Scripts</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">robust_device_loop.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> subprocess

<span class="kw">def</span> <span class="fn">ping_ok</span>(ip):
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

devices = [
    {<span class="st">"name"</span>:<span class="st">"R1"</span>,    <span class="st">"ip"</span>:<span class="st">"192.168.100.1"</span>},
    {<span class="st">"name"</span>:<span class="st">"R2"</span>,    <span class="st">"ip"</span>:<span class="st">"192.168.100.2"</span>},
    {<span class="st">"name"</span>:<span class="st">"SW-01"</span>, <span class="st">"ip"</span>:<span class="st">"192.168.100.10"</span>},
]

success, failed = [], []

<span class="kw">for</span> device <span class="kw">in</span> devices:
    name = device[<span class="st">"name"</span>]
    ip   = device[<span class="st">"ip"</span>]

    <span class="kw">if not</span> <span class="fn">ping_ok</span>(ip):
        <span class="fn">print</span>(f<span class="st">"[SKIP] {name} not reachable"</span>)
        failed.<span class="fn">append</span>(name)
        <span class="kw">continue</span>          <span class="cm"># skip to next device</span>

    <span class="fn">print</span>(f<span class="st">"[OK]   {name} — processing..."</span>)
    success.<span class="fn">append</span>(name)

<span class="fn">print</span>(f<span class="st">"\nDone: {len(success)} OK | {len(failed)} skipped"</span>)
<span class="fn">print</span>(f<span class="st">"Skipped: {failed}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m4-flow">
<h3>continue vs break — The Key Difference</h3>
<div class="fb">
  <div class="fr"><div class="fn2 p">for device in [R1, R2, R3, R4, R5]:</div></div>
  <div style="height:8px"></div>
  <div class="g2">
    <div>
      <p style="color:var(--yel);font-size:12px;font-weight:600;margin-bottom:4px">continue on R2:</p>
      <div class="fn2 g">R1 ✓ → R2 skip → R3 ✓ → R4 ✓ → R5 ✓</div>
      <p style="font-size:11px;color:var(--mut);margin-top:4px">Skips R2, keeps going</p>
    </div>
    <div>
      <p style="color:var(--red);font-size:12px;font-weight:600;margin-bottom:4px">break on R2:</p>
      <div class="fn2 r">R1 ✓ → R2 STOP → R3,R4,R5 never run</div>
      <p style="font-size:11px;color:var(--mut);margin-top:4px">Stops entire loop at R2</p>
    </div>
  </div>
</div>
</script>

<script type="text/x-tmpl" id="m5-theory">
<h3>enumerate() and zip() — Loop Smarter</h3>
<h4>enumerate() — Loop with a Counter</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">enumerate_demo.py</span></div><pre><span class="cm"># Without enumerate — ugly manual counter</span>
devices = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"SW-01"</span>]
i = <span class="nm">0</span>
<span class="kw">for</span> d <span class="kw">in</span> devices:
    <span class="fn">print</span>(f<span class="st">"Device {i}: {d}"</span>)
    i += <span class="nm">1</span>

<span class="cm"># With enumerate — clean</span>
<span class="kw">for</span> i, d <span class="kw">in</span> <span class="fn">enumerate</span>(devices):
    <span class="fn">print</span>(f<span class="st">"Device {i}: {d}"</span>)     <span class="cm"># i = 0,1,2</span>

<span class="cm"># Start counting from 1 instead of 0</span>
<span class="kw">for</span> i, d <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
    <span class="fn">print</span>(f<span class="st">"[{i}/{len(devices)}] {d}"</span>)</pre></div>
<h4>zip() — Pair Two Lists Together</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">zip_demo.py</span></div><pre>hostnames = [<span class="st">"R1"</span>,        <span class="st">"R2"</span>,        <span class="st">"SW-01"</span>]
mgmt_ips  = [<span class="st">"10.1.1.1"</span>,  <span class="st">"10.1.1.2"</span>,  <span class="st">"10.1.1.10"</span>]

<span class="kw">for</span> hostname, ip <span class="kw">in</span> <span class="fn">zip</span>(hostnames, mgmt_ips):
    <span class="fn">print</span>(f<span class="st">"{hostname:10} → {ip}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m5-industry">
<h3>enumerate and zip in Network Scripts</h3>
<p>enumerate gives you progress reporting for free — "Processing device 47 of 200..." is something your team will thank you for. zip lets you pair data from two different sources without index gymnastics.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">progress_report.py</span></div><pre>devices = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"SW-01"</span>, <span class="st">"SW-02"</span>, <span class="st">"FW-01"</span>]
total   = <span class="fn">len</span>(devices)

<span class="kw">for</span> num, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
    <span class="fn">print</span>(f<span class="st">"[{num}/{total}] Processing {device}..."</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m5-practical">
<h3>enumerate and zip — Full Examples</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">eve_reachability_check.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> subprocess

eve_devices = {
    <span class="st">"R1"</span>   : <span class="st">"192.168.100.1"</span>,
    <span class="st">"R2"</span>   : <span class="st">"192.168.100.2"</span>,
    <span class="st">"SW-01"</span>: <span class="st">"192.168.100.10"</span>,
    <span class="st">"SW-02"</span>: <span class="st">"192.168.100.11"</span>,
}

items = <span class="fn">list</span>(eve_devices.<span class="fn">items</span>())
total = <span class="fn">len</span>(items)
up, down = [], []

<span class="kw">for</span> num, (name, ip) <span class="kw">in</span> <span class="fn">enumerate</span>(items, start=<span class="nm">1</span>):
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],capture_output=<span class="kw">True</span>)
    ok = r.returncode == <span class="nm">0</span>
    label = <span class="st">"UP"</span> <span class="kw">if</span> ok <span class="kw">else</span> <span class="st">"DOWN"</span>
    (up <span class="kw">if</span> ok <span class="kw">else</span> down).<span class="fn">append</span>(name)
    <span class="fn">print</span>(f<span class="st">"[{num:02d}/{total}] {name:10} {ip:18} [{label}]"</span>)

<span class="fn">print</span>(f<span class="st">"\n  Up  : {up}"</span>)
<span class="fn">print</span>(f<span class="st">"  Down: {down}"</span>)</pre></div>

<script type="text/x-tmpl" id="m6-theory">
<h3>Nested Loops — A Loop Inside a Loop</h3>
<p>A nested loop runs the inner loop completely for every iteration of the outer loop. In networking: all VLANs on all switches, all interfaces on all routers, all BGP neighbours on all devices.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">nested_loops.py</span></div><pre>switches = [<span class="st">"SW-01"</span>, <span class="st">"SW-02"</span>, <span class="st">"SW-03"</span>]
vlans    = [<span class="nm">10</span>, <span class="nm">20</span>, <span class="nm">30</span>, <span class="nm">100</span>]

<span class="kw">for</span> switch <span class="kw">in</span> switches:       <span class="cm"># outer — 3 iterations</span>
    <span class="fn">print</span>(f<span class="st">"Configuring {switch}:"</span>)
    <span class="kw">for</span> vlan <span class="kw">in</span> vlans:        <span class="cm"># inner — 4 per switch</span>
        <span class="fn">print</span>(f<span class="st">"  Adding VLAN {vlan}"</span>)
    <span class="fn">print</span>(<span class="st">"  Done."</span>)
<span class="cm"># Total: 3 × 4 = 12 inner iterations</span></pre></div>
<div class="note y"><p><strong>Watch indentation:</strong> Code at the inner indent runs once per VLAN. Code back at the outer indent runs once per switch. One wrong indent = a hidden bug.</p></div>
</script>

<script type="text/x-tmpl" id="m6-industry">
<h3>Nested Loops for Real Network Tasks</h3>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG — Full Topology Interface Check</div><p>Outer loop = routers, inner loop = interfaces on that router. One nested loop gives you a complete interface status report for your entire EVE-NG topology.</p></div>
</script>

<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">topology_audit.py</span><span class="etag">EVE-NG</span></div><pre>topology = {
    <span class="st">"R1"</span>: [{<span class="st">"name"</span>:<span class="st">"Gi0/0"</span>,<span class="st">"status"</span>:<span class="st">"up"</span>},{<span class="st">"name"</span>:<span class="st">"Gi0/1"</span>,<span class="st">"status"</span>:<span class="st">"down"</span>}],
    <span class="st">"R2"</span>: [{<span class="st">"name"</span>:<span class="st">"Gi0/0"</span>,<span class="st">"status"</span>:<span class="st">"up"</span>},{<span class="st">"name"</span>:<span class="st">"Gi0/1"</span>,<span class="st">"status"</span>:<span class="st">"up"</span>}],
}
issues = []

<span class="kw">for</span> router, interfaces <span class="kw">in</span> topology.<span class="fn">items</span>():
    <span class="fn">print</span>(f<span class="st">"\n{router}:"</span>)
    <span class="kw">for</span> iface <span class="kw">in</span> interfaces:
        icon = <span class="st">"✓"</span> <span class="kw">if</span> iface[<span class="st">"status"</span>] == <span class="st">"up"</span> <span class="kw">else</span> <span class="st">"✗"</span>
        <span class="fn">print</span>(f<span class="st">"  {icon} {iface['name']:12} [{iface['status']}]"</span>)
        <span class="kw">if</span> iface[<span class="st">"status"</span>] == <span class="st">"down"</span>:
            issues.<span class="fn">append</span>(f<span class="st">"{router}/{iface['name']}"</span>)

<span class="fn">print</span>(f<span class="st">"\nIssues: {issues}"</span>)</pre></div>

<script type="text/x-tmpl" id="m7-theory">
<h3>List Comprehensions — One-Line Loops</h3>
<p>A list comprehension builds a new list from a loop in one line. Once you get used to them they're faster to write and easier to read.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">list_comprehension.py</span></div><pre><span class="cm"># Normal for loop — building a list</span>
devices = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"R3"</span>]
labels  = []
<span class="kw">for</span> d <span class="kw">in</span> devices:
    labels.<span class="fn">append</span>(<span class="st">"Device: "</span> + d)

<span class="cm"># Same thing — one line comprehension</span>
labels = [<span class="st">"Device: "</span> + d <span class="kw">for</span> d <span class="kw">in</span> devices]

<span class="cm"># Read it: [what  for each  in where]</span>

<span class="cm"># With filter — if clause at the end</span>
all_devs = [<span class="st">"R1"</span>, <span class="st">"R2"</span>, <span class="st">"SW-01"</span>, <span class="st">"R3"</span>, <span class="st">"SW-02"</span>]
routers  = [d <span class="kw">for</span> d <span class="kw">in</span> all_devs <span class="kw">if</span> d.<span class="fn">startswith</span>(<span class="st">"R"</span>)]   <span class="cm"># ['R1','R2','R3']</span>
switches = [d <span class="kw">for</span> d <span class="kw">in</span> all_devs <span class="kw">if</span> d.<span class="fn">startswith</span>(<span class="st">"SW"</span>)]  <span class="cm"># ['SW-01','SW-02']</span>

<span class="cm"># Dict comprehension — hostname to IP map</span>
devices_list = [{<span class="st">"hostname"</span>:<span class="st">"R1"</span>,<span class="st">"ip"</span>:<span class="st">"10.1.1.1"</span>},{<span class="st">"hostname"</span>:<span class="st">"R2"</span>,<span class="st">"ip"</span>:<span class="st">"10.1.1.2"</span>}]
ip_map = {d[<span class="st">"hostname"</span>]: d[<span class="st">"ip"</span>] <span class="kw">for</span> d <span class="kw">in</span> devices_list}
<span class="fn">print</span>(ip_map[<span class="st">"R1"</span>])   <span class="cm"># 10.1.1.1</span></pre></div>
</script>

<script type="text/x-tmpl" id="m7-practical">

<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">comprehension_patterns.py</span></div><pre><span class="cm"># Generate VLAN config lines from a list</span>

<span class="cm"># Uppercase all hostnames</span>
names  = [<span class="st">"sw-core-01"</span>, <span class="st">"r1"</span>, <span class="st">"fw-01"</span>]

<h3>Comprehension Anatomy</h3>
<div class="fb">
  <p style="font-size:12px;color:var(--mut);margin-bottom:8px">result = [ <span style="color:var(--grn)">expression</span> &nbsp; <span style="color:var(--blu)">for item in collection</span> &nbsp; <span style="color:var(--yel)">if condition</span> ]</p>

<!-- ═══ TOPIC 8 ═══ -->
<script type="text/x-tmpl" id="m8-theory">
<h3>Looping Over Files — YAML, JSON, CSV</h3>
<p>In real network automation your loop data rarely comes from a hardcoded list in the script. It comes from files — YAML inventory, JSON config, CSV exports from your IPAM or spreadsheet. You read the file, get a list, loop over it.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">loop_over_files.py</span></div><pre><span class="kw">import</span> json, yaml, csv

<span class="cm"># ─── Loop over YAML inventory ─────────────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"inventory.yaml"</span>) <span class="kw">as</span> f:
    inv = yaml.<span class="fn">safe_load</span>(f)

<span class="kw">for</span> device <span class="kw">in</span> inv[<span class="st">"devices"</span>]:
    <span class="fn">print</span>(f<span class="st">"{device['hostname']:15} {device['ip']}"</span>)

<span class="cm"># ─── Loop over JSON file ──────────────────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"devices.json"</span>) <span class="kw">as</span> f:
    data = json.<span class="fn">load</span>(f)

<span class="kw">for</span> device <span class="kw">in</span> data[<span class="st">"devices"</span>]:
    <span class="fn">print</span>(device[<span class="st">"hostname"</span>])

<span class="cm"># ─── Loop over CSV file ───────────────────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"devices.csv"</span>) <span class="kw">as</span> f:
    reader = csv.<span class="fn">DictReader</span>(f)
    <span class="kw">for</span> row <span class="kw">in</span> reader:
        <span class="cm"># each row is a dict: {"hostname":"R1","ip":"10.1.1.1"}</span>
        <span class="fn">print</span>(row[<span class="st">"hostname"</span>], row[<span class="st">"ip"</span>])

<span class="cm"># ─── Loop over plain text IP list ────────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"ip_list.txt"</span>) <span class="kw">as</span> f:
    <span class="kw">for</span> line <span class="kw">in</span> f:
        ip = line.<span class="fn">strip</span>()     <span class="cm"># remove newline</span>
        <span class="kw">if</span> ip:                <span class="cm"># skip blank lines</span>

<script type="text/x-tmpl" id="m8-industry">
<h3>File-Based Loops in Production</h3>
<p>The standard pattern in a real team: someone (often a non-Python network engineer) maintains a YAML or CSV file with device details. Your Python script reads that file and loops over it. When a new device is added to the file, the script automatically includes it next run. The data and the code stay separate.</p>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Inventory File</div><p>Create one YAML file for your entire EVE-NG lab. Your Python scripts read from it. When you add a new VM to your topology, add it to the YAML — all scripts pick it up automatically next run.</p></div>
<div class="cb"><div class="ch"><span class="lg ym">YAML</span><span class="fn">eve_inventory.yaml — your lab file</span></div><pre>lab_name: My Network Lab
devices:
  - hostname: R1
    ip: "192.168.100.1"
    type: router
    platform: cisco_ios
    credentials:
      username: admin
      password: admin123
    vlans: []

  - hostname: SW-01
    ip: "192.168.100.10"
    type: switch
    platform: cisco_ios
    credentials:
      username: admin
      password: admin123
    vlans: [10, 20, 30]</pre></div>
</script>

<script type="text/x-tmpl" id="m8-practical">
<h3>Read File → Loop → Save Report</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">eve_lab_runner.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> yaml, subprocess, json
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

<span class="cm"># ─── Load EVE-NG inventory ────────────────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    lab = yaml.<span class="fn">safe_load</span>(f)

devices = lab[<span class="st">"devices"</span>]
total   = <span class="fn">len</span>(devices)
report  = []

<span class="fn">print</span>(f<span class="st">"Lab: {lab['lab_name']} — {total} devices"</span>)
<span class="fn">print</span>(<span class="st">"="</span> * <span class="nm">50</span>)

<span class="cm"># ─── Loop over devices, ping each one ────────────────</span>
<span class="kw">for</span> num, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
    name = device[<span class="st">"hostname"</span>]
    ip   = device[<span class="st">"ip"</span>]

    r      = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"2"</span>,ip],capture_output=<span class="kw">True</span>)
    status = <span class="st">"UP"</span> <span class="kw">if</span> r.returncode == <span class="nm">0</span> <span class="kw">else</span> <span class="st">"DOWN"</span>
    icon   = <span class="st">"✓"</span> <span class="kw">if</span> r.returncode == <span class="nm">0</span> <span class="kw">else</span> <span class="st">"✗"</span>

    <span class="fn">print</span>(f<span class="st">"[{num:02d}/{total}] {icon} {name:12} {ip:18} [{status}]"</span>)
    report.<span class="fn">append</span>({
        <span class="st">"hostname"</span> : name,
        <span class="st">"ip"</span>       : ip,
        <span class="st">"status"</span>   : status,
        <span class="st">"time"</span>     : datetime.<span class="fn">now</span>().<span class="fn">strftime</span>(<span class="st">"%H:%M:%S"</span>)
    })

<span class="cm"># ─── Save JSON report ─────────────────────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"lab_report.json"</span>, <span class="st">"w"</span>) <span class="kw">as</span> f:
    json.<span class="fn">dump</span>(report, f, indent=<span class="nm">2</span>)

up = <span class="fn">sum</span>(<span class="nm">1</span> <span class="kw">for</span> d <span class="kw">in</span> report <span class="kw">if</span> d[<span class="st">"status"</span>] == <span class="st">"UP"</span>)
<span class="fn">print</span>(f<span class="st">"\nResult: {up}/{total} devices UP"</span>)
<span class="fn">print</span>(<span class="st">"Report saved: lab_report.json"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m9-theory">
<h3>Netmiko + Loops — SSH to Many Devices</h3>
<p>Netmiko is the Python library that simplifies SSH to network devices. Combine it with a loop and you can run commands on 100 devices as easily as one. This is where loops become actual superpowers for a network engineer.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">pip install netmiko</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="cm"># Connect to ONE device</span>
device = {
    <span class="st">"device_type"</span>: <span class="st">"cisco_ios"</span>,
    <span class="st">"host"</span>       : <span class="st">"192.168.100.1"</span>,
    <span class="st">"username"</span>   : <span class="st">"admin"</span>,
    <span class="st">"password"</span>   : <span class="st">"admin123"</span>,
}
<span class="kw">with</span> <span class="fn">ConnectHandler</span>(**device) <span class="kw">as</span> net:
    output = net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)
    <span class="fn">print</span>(output)</pre></div>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">netmiko_loop.py — SSH to MULTIPLE devices</span><span class="etag">EVE-NG</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler, NetmikoTimeoutException
<span class="kw">import</span> yaml

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    lab = yaml.<span class="fn">safe_load</span>(f)

results = {}

<span class="kw">for</span> num, d <span class="kw">in</span> <span class="fn">enumerate</span>(lab[<span class="st">"devices"</span>], start=<span class="nm">1</span>):
    name = d[<span class="st">"hostname"</span>]
    <span class="fn">print</span>(f<span class="st">"[{num}] Connecting to {name}..."</span>, end=<span class="st">" "</span>)
    <span class="kw">try</span>:
        conn = {
            <span class="st">"device_type"</span>: d[<span class="st">"platform"</span>],
            <span class="st">"host"</span>       : d[<span class="st">"ip"</span>],
            <span class="st">"username"</span>   : d[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
            <span class="st">"password"</span>   : d[<span class="st">"credentials"</span>][<span class="st">"password"</span>],
            <span class="st">"timeout"</span>    : <span class="nm">10</span>,
        }
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            out = net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)
            results[name] = out[:<span class="nm">80</span>]
            <span class="fn">print</span>(<span class="st">"OK"</span>)
    <span class="kw">except</span> NetmikoTimeoutException:
        <span class="fn">print</span>(<span class="st">"TIMEOUT"</span>)
        results[name] = <span class="st">"UNREACHABLE"</span>
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="fn">print</span>(f<span class="st">"ERROR: {e}"</span>)
        results[name] = <span class="st">"ERROR"</span>

<span class="fn">print</span>(<span class="st">"\nResults:"</span>)
<span class="kw">for</span> name, result <span class="kw">in</span> results.<span class="fn">items</span>():
    <span class="fn">print</span>(f<span class="st">"  {name}: {result[:50]}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m9-industry">
<h3>Netmiko Loop Patterns in Production</h3>
<h4>Config Push to Multiple Devices</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">config_push.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler
<span class="kw">import</span> yaml

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

config_commands = [
    <span class="st">"ntp server 8.8.8.8"</span>,

]

success, failed = [], []

<span class="kw">for</span> device <span class="kw">in</span> devices:

    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>], <span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],

<span class="fn">print</span>(f<span class="st">"\nDone — {len(success)} OK, {len(failed)} failed"</span>)</pre></div>

<script type="text/x-tmpl" id="m9-practical">
<h3>Multi-Command Collector</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">collect_show_commands.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler
<span class="kw">import</span> yaml, os
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    lab = yaml.<span class="fn">safe_load</span>(f)

show_commands = [
    <span class="st">"show version"</span>,
    <span class="st">"show ip interface brief"</span>,
    <span class="st">"show ip route"</span>,
]

ts = datetime.<span class="fn">now</span>().<span class="fn">strftime</span>(<span class="st">"%Y%m%d_%H%M"</span>)
os.<span class="fn">makedirs</span>(<span class="st">"outputs"</span>, exist_ok=<span class="kw">True</span>)

<span class="kw">for</span> device <span class="kw">in</span> lab[<span class="st">"devices"</span>]:
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>], <span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:device[<span class="st">"credentials"</span>][<span class="st">"password"</span>]}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            fname = f<span class="st">"outputs/{name}_{ts}.txt"</span>
            <span class="kw">with</span> <span class="fn">open</span>(fname, <span class="st">"w"</span>) <span class="kw">as</span> out:
                <span class="kw">for</span> cmd <span class="kw">in</span> show_commands:   <span class="cm"># inner loop</span>
                    out.<span class="fn">write</span>(f<span class="st">"\n{'='*40}\n{cmd}\n{'='*40}\n"</span>)
                    out.<span class="fn">write</span>(net.<span class="fn">send_command</span>(cmd) + <span class="st">"\n"</span>)
            <span class="fn">print</span>(f<span class="st">"✓ {name} → {fname}"</span>)
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="fn">print</span>(f<span class="st">"✗ {name} — {e}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m10-theory">
<h3>Error Handling Inside Loops</h3>
<p>One device going wrong should never kill your entire loop. When looping over 50 devices and device 12 throws an exception, the right behaviour is: log the error, skip that device, continue with 13–50.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">loop_error_handling.py</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler, NetmikoTimeoutException, NetmikoAuthenticationException

success, failed = [], []

<span class="kw">for</span> device <span class="kw">in</span> devices:
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">try</span>:
        conn = {
            <span class="st">"device_type"</span>: device[<span class="st">"platform"</span>],
            <span class="st">"host"</span>       : device[<span class="st">"ip"</span>],
            <span class="st">"username"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
            <span class="st">"password"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],
        }
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            out = net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)
            success.<span class="fn">append</span>(name)
            <span class="fn">print</span>(f<span class="st">"✓ {name}"</span>)

    <span class="kw">except</span> NetmikoTimeoutException:
        <span class="fn">print</span>(f<span class="st">"✗ {name} — timeout"</span>)
        failed.<span class="fn">append</span>({<span class="st">"name"</span>: name, <span class="st">"reason"</span>: <span class="st">"timeout"</span>})

    <span class="kw">except</span> NetmikoAuthenticationException:
        <span class="fn">print</span>(f<span class="st">"✗ {name} — auth failed"</span>)
        failed.<span class="fn">append</span>({<span class="st">"name"</span>: name, <span class="st">"reason"</span>: <span class="st">"auth"</span>})

    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="fn">print</span>(f<span class="st">"✗ {name} — {e}"</span>)
        failed.<span class="fn">append</span>({<span class="st">"name"</span>: name, <span class="st">"reason"</span>: <span class="fn">str</span>(e)})

<span class="fn">print</span>(f<span class="st">"\n{len(success)} OK | {len(failed)} failed"</span>)
<span class="kw">for</span> f <span class="kw">in</span> failed:
    <span class="fn">print</span>(f<span class="st">"  ✗ {f['name']}: {f['reason']}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m10-industry">
<h3>Production Error Handling Patterns</h3>
<div class="note g"><p><strong>Senior engineer rule:</strong> Always print a summary at the end of a bulk operation. "Done — 47 of 50 configured. Failed: SW-14, FW-02, R-EDGE-01." That summary goes into the change ticket.</p></div>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab</div><p>Some VMs in your lab may be off or crashed. Error handling in your loop means the script works on all running devices and clearly lists the ones that failed — you don't have to guess which ones it reached.</p></div>
</script>

<script type="text/x-tmpl" id="m10-practical">
<h3>Complete Robust Loop — EVE-NG</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">robust_loop.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> yaml, json
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler, NetmikoTimeoutException, NetmikoAuthenticationException
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

report = {<span class="st">"run_time"</span>: datetime.<span class="fn">now</span>().<span class="fn">isoformat</span>(), <span class="st">"results"</span>: []}

<span class="kw">for</span> num, d <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
    name   = d[<span class="st">"hostname"</span>]
    result = {<span class="st">"hostname"</span>:name, <span class="st">"ip"</span>:d[<span class="st">"ip"</span>], <span class="st">"status"</span>:<span class="st">"unknown"</span>, <span class="st">"error"</span>:<span class="kw">None</span>}
    <span class="fn">print</span>(f<span class="st">"[{num}/{len(devices)}] {name}..."</span>, end=<span class="st">" "</span>)

    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:d[<span class="st">"platform"</span>], <span class="st">"host"</span>:d[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:d[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:d[<span class="st">"credentials"</span>][<span class="st">"password"</span>], <span class="st">"timeout"</span>:<span class="nm">10</span>}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            net.<span class="fn">send_command</span>(<span class="st">"show ip interface brief"</span>)
            result[<span class="st">"status"</span>] = <span class="st">"success"</span>
            <span class="fn">print</span>(<span class="st">"OK"</span>)
    <span class="kw">except</span> NetmikoTimeoutException:
        result.update({<span class="st">"status"</span>:<span class="st">"timeout"</span>,  <span class="st">"error"</span>:<span class="st">"Connection timed out"</span>}); <span class="fn">print</span>(<span class="st">"TIMEOUT"</span>)
    <span class="kw">except</span> NetmikoAuthenticationException:
        result.update({<span class="st">"status"</span>:<span class="st">"auth_fail"</span>, <span class="st">"error"</span>:<span class="st">"Wrong credentials"</span>});  <span class="fn">print</span>(<span class="st">"AUTH FAIL"</span>)
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        result.update({<span class="st">"status"</span>:<span class="st">"error"</span>,    <span class="st">"error"</span>:<span class="fn">str</span>(e)});               <span class="fn">print</span>(f<span class="st">"ERROR: {e}"</span>)

    report[<span class="st">"results"</span>].<span class="fn">append</span>(result)

ok   = [r <span class="kw">for</span> r <span class="kw">in</span> report[<span class="st">"results"</span>] <span class="kw">if</span> r[<span class="st">"status"</span>] == <span class="st">"success"</span>]
errs = [r <span class="kw">for</span> r <span class="kw">in</span> report[<span class="st">"results"</span>] <span class="kw">if</span> r[<span class="st">"status"</span>] != <span class="st">"success"</span>]
<span class="fn">print</span>(f<span class="st">"\n{len(ok)} OK | {len(errs)} failed"</span>)
<span class="kw">for</span> e <span class="kw">in</span> errs: <span class="fn">print</span>(f<span class="st">"  ✗ {e['hostname']}: {e['error']}"</span>)
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"run_report.json"</span>, <span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(report, f, indent=<span class="nm">2</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m10-flow">

<div class="fb">

</div>

<script type="text/x-tmpl" id="m11-theory">
<h3>Concurrent Loops — Run All Devices at Once</h3>
<p>Sequential loops wait for each device before moving to the next. With 100 devices × 5 seconds each = 500 seconds (8 minutes). Concurrent loops run all devices simultaneously — same 100 devices finish in ~5-10 seconds.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">concurrent_loop.py</span></div><pre><span class="kw">from</span> concurrent.futures <span class="kw">import</span> ThreadPoolExecutor, as_completed
<span class="kw">import</span> subprocess

<span class="kw">def</span> <span class="fn">ping_device</span>(device):
    name = device[<span class="st">"hostname"</span>]
    ip   = device[<span class="st">"ip"</span>]
    r    = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip], capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> {<span class="st">"name"</span>: name, <span class="st">"up"</span>: r.returncode == <span class="nm">0</span>}

devices = [
    {<span class="st">"hostname"</span>:<span class="st">"R1"</span>,    <span class="st">"ip"</span>:<span class="st">"192.168.100.1"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"R2"</span>,    <span class="st">"ip"</span>:<span class="st">"192.168.100.2"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"SW-01"</span>, <span class="st">"ip"</span>:<span class="st">"192.168.100.10"</span>},
]

<span class="cm"># All pings run at the same time — max 10 threads</span>
<span class="kw">with</span> <span class="fn">ThreadPoolExecutor</span>(max_workers=<span class="nm">10</span>) <span class="kw">as</span> pool:
    futures = [pool.<span class="fn">submit</span>(ping_device, d) <span class="kw">for</span> d <span class="kw">in</span> devices]
    <span class="kw">for</span> future <span class="kw">in</span> <span class="fn">as_completed</span>(futures):
        r = future.<span class="fn">result</span>()
        icon = <span class="st">"✓"</span> <span class="kw">if</span> r[<span class="st">"up"</span>] <span class="kw">else</span> <span class="st">"✗"</span>
        <span class="fn">print</span>(f<span class="st">"{icon} {r['name']}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m11-industry">
<h3>When Concurrency Matters</h3>
<div class="note g"><p><strong>Use concurrent loops when:</strong> You have 20+ devices and each operation involves waiting (SSH response, API call, ping). Every device waits for the network — threading lets Python work on many at once while each waits.</p></div>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab</div><p>Pinging all EVE-NG devices concurrently after boot: 10 devices × 1 second timeout = 1 second total with threading vs 10 seconds sequentially. Big difference when you have more devices.</p></div>
</script>

<script type="text/x-tmpl" id="m11-practical">
<h3>Concurrent Netmiko Show Collection</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">fast_collector.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">from</span> concurrent.futures <span class="kw">import</span> ThreadPoolExecutor, as_completed
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler
<span class="kw">import</span> yaml, json

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

<span class="kw">def</span> <span class="fn">get_data</span>(device):
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>], <span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:device[<span class="st">"credentials"</span>][<span class="st">"password"</span>], <span class="st">"timeout"</span>:<span class="nm">10</span>}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            <span class="kw">return</span> {<span class="st">"name"</span>:name, <span class="st">"status"</span>:<span class="st">"ok"</span>, <span class="st">"data"</span>:net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)[:<span class="nm">200</span>]}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"name"</span>:name, <span class="st">"status"</span>:<span class="st">"error"</span>, <span class="st">"data"</span>:<span class="fn">str</span>(e)}

results = []
<span class="kw">with</span> <span class="fn">ThreadPoolExecutor</span>(max_workers=<span class="nm">10</span>) <span class="kw">as</span> pool:
    futures = [pool.<span class="fn">submit</span>(<span class="fn">get_data</span>, d) <span class="kw">for</span> d <span class="kw">in</span> devices]
    <span class="kw">for</span> future <span class="kw">in</span> <span class="fn">as_completed</span>(futures):
        r = future.<span class="fn">result</span>()
        results.<span class="fn">append</span>(r)
        icon = <span class="st">"✓"</span> <span class="kw">if</span> r[<span class="st">"status"</span>] == <span class="st">"ok"</span> <span class="kw">else</span> <span class="st">"✗"</span>
        <span class="fn">print</span>(f<span class="st">"  {icon} {r['name']}"</span>)

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"fast_report.json"</span>,<span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(results,f,indent=<span class="nm">2</span>)
<span class="fn">print</span>(<span class="st">"Done."</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m12-theory">
<h3>Capstone — Full EVE-NG Lab Automation Script</h3>

<script type="text/x-tmpl" id="m12-industry">
<h3>This is Real Network Automation</h3>
<p>The capstone script below is what network automation engineers actually write and run. The only difference between lab and production is the device IPs in the YAML file.</p>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Pre-flight Checklist</div><p>For the capstone script to work:<br>
1. EVE-NG topology started, all nodes powered on<br>
2. Each router: <code>interface Gi0/0</code> → IP configured → <code>no shutdown</code><br>
3. SSH enabled: <code>ip ssh version 2</code>, <code>crypto key generate rsa modulus 2048</code><br>
4. VTY: <code>line vty 0 4</code> → <code>login local</code> → <code>transport input ssh</code><br>
5. Local user: <code>username admin privilege 15 secret admin123</code><br>
6. <code>eve_inventory.yaml</code> updated with your actual IPs and credentials</p></div>
</script>

<script type="text/x-tmpl" id="m12-practical">
<h3>Full Capstone Script</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">eve_lab_automation.py — Full Capstone</span><span class="etag">EVE-NG</span></div><pre><span class="kw">from</span> concurrent.futures <span class="kw">import</span> ThreadPoolExecutor, as_completed
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler
<span class="kw">import</span> yaml, json, subprocess, time
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

<span class="cm"># ═══ Phase 1: Wait for lab to be ready ═══</span>
<span class="kw">def</span> <span class="fn">wait_for_lab</span>(devices, timeout=<span class="nm">120</span>):
    <span class="fn">print</span>(<span class="st">"Phase 1: Waiting for devices..."</span>)
    ready = <span class="fn">set</span>(); start = time.<span class="fn">time</span>()
    <span class="kw">while</span> <span class="fn">len</span>(ready) &lt; <span class="fn">len</span>(devices) <span class="kw">and</span> time.<span class="fn">time</span>()-start &lt; timeout:
        <span class="kw">for</span> d <span class="kw">in</span> devices:
            name = d[<span class="st">"hostname"</span>]
            <span class="kw">if</span> name <span class="kw">not in</span> ready:
                r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,d[<span class="st">"ip"</span>]],capture_output=<span class="kw">True</span>)
                <span class="kw">if</span> r.returncode == <span class="nm">0</span>:
                    ready.<span class="fn">add</span>(name)
                    <span class="fn">print</span>(f<span class="st">"  ✓ {name} UP ({len(ready)}/{len(devices)})"</span>)
        <span class="kw">if</span> <span class="fn">len</span>(ready) &lt; <span class="fn">len</span>(devices): time.<span class="fn">sleep</span>(<span class="nm">5</span>)
    <span class="kw">return</span> [d <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> d[<span class="st">"hostname"</span>] <span class="kw">in</span> ready]

<span class="cm"># ═══ Phase 2: Collect data ═══</span>
<span class="kw">def</span> <span class="fn">collect</span>(device):
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>], <span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:device[<span class="st">"credentials"</span>][<span class="st">"password"</span>], <span class="st">"timeout"</span>:<span class="nm">10</span>}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            <span class="kw">return</span> {<span class="st">"hostname"</span>:name, <span class="st">"status"</span>:<span class="st">"ok"</span>,
                    <span class="st">"version"</span> :net.<span class="fn">send_command</span>(<span class="st">"show version"</span>),
                    <span class="st">"int_brief"</span>:net.<span class="fn">send_command</span>(<span class="st">"show ip interface brief"</span>)}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"hostname"</span>:name, <span class="st">"status"</span>:<span class="st">"error"</span>, <span class="st">"error"</span>:<span class="fn">str</span>(e)}

<span class="cm"># ═══ Main ═══</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    lab = yaml.<span class="fn">safe_load</span>(f)
devices = lab[<span class="st">"devices"</span>]

<span class="fn">print</span>(f<span class="st">"=== EVE-NG Automation: {lab['lab_name']} ==="</span>)

ready_devs = <span class="fn">wait_for_lab</span>(devices)

<span class="fn">print</span>(f<span class="st">"\nPhase 2: Collecting from {len(ready_devs)} devices..."</span>)
collected = []
<span class="kw">with</span> <span class="fn">ThreadPoolExecutor</span>(max_workers=<span class="nm">10</span>) <span class="kw">as</span> pool:
    futures = [pool.<span class="fn">submit</span>(<span class="fn">collect</span>, d) <span class="kw">for</span> d <span class="kw">in</span> ready_devs]
    <span class="kw">for</span> num, f <span class="kw">in</span> <span class="fn">enumerate</span>(<span class="fn">as_completed</span>(futures), start=<span class="nm">1</span>):
        r = f.<span class="fn">result</span>(); collected.<span class="fn">append</span>(r)
        icon = <span class="st">"✓"</span> <span class="kw">if</span> r[<span class="st">"status"</span>]==<span class="st">"ok"</span> <span class="kw">else</span> <span class="st">"✗"</span>
        <span class="fn">print</span>(f<span class="st">"  [{num}/{len(ready_devs)}] {icon} {r['hostname']}"</span>)

ok  = [r <span class="kw">for</span> r <span class="kw">in</span> collected <span class="kw">if</span> r[<span class="st">"status"</span>]==<span class="st">"ok"</span>]
err = [r <span class="kw">for</span> r <span class="kw">in</span> collected <span class="kw">if</span> r[<span class="st">"status"</span>]!=<span class="st">"ok"</span>]

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"lab_report.json"</span>,<span class="st">"w"</span>) <span class="kw">as</span> f:
    json.<span class="fn">dump</span>({<span class="st">"lab"</span>:lab[<span class="st">"lab_name"</span>],<span class="st">"time"</span>:datetime.<span class="fn">now</span>().<span class="fn">isoformat</span>(),<span class="st">"results"</span>:collected},f,indent=<span class="nm">2</span>)

<span class="fn">print</span>(f<span class="st">"\n=== SUMMARY ==="</span>)
<span class="fn">print</span>(f<span class="st">"Total:     {len(devices)}"</span>)

<script>
var M=[
  {id:1,  title:"What is a Loop? Why It Matters",             level:"basic"},
  {id:2,  title:"for Loop — Every Variation",                 level:"basic"},
  {id:3,  title:"while Loop — Until It Changes",              level:"basic"},
  {id:4,  title:"break, continue, pass",                      level:"basic"},
  {id:5,  title:"enumerate() and zip()",                      level:"basic"},
  {id:6,  title:"Nested Loops — Devices × VLANs",             level:"intermediate"},
  {id:7,  title:"List Comprehensions",                        level:"intermediate"},
  {id:8,  title:"Looping Over Files — YAML / JSON / CSV",     level:"intermediate"},
  {id:9,  title:"Netmiko + Loops — SSH to Many Devices",      level:"intermediate"},
  {id:10, title:"Error Handling Inside Loops",                level:"intermediate"},
  {id:11, title:"Concurrent Loops — Run All at Once",         level:"advanced"},
  {id:12, title:"Capstone — Full EVE-NG Lab Script",          level:"advanced"}
];

var cur=0;
var TABS=["theory","industry","practical","flow","practice"];

function getSection(id,tab){
  var el=document.getElementById("m"+id+"-"+tab);
  return el?el.textContent:"<p style='color:var(--mut)'>Loading...</p>";
}

function renderSidebar(){
  var html="";
  for(var i=0;i<M.length;i++){
    html+="<div class='ti"+(i===cur?" active":"")+"' onclick='selectTopic("+i+")'>"
         +"<span class='tn'>"+String(M[i].id).padStart(2,"0")+"</span>"
         +"<span class='tt'>"+M[i].title+"</span>"
         +"<span class='lbg lb-"+M[i].level+"'>"+M[i].level+"</span>"
         +"</div>";
  }
  document.getElementById("tlist").innerHTML=html;
}

function renderContent(){
  var m=M[cur];
  document.getElementById("ttl").textContent=m.title;
  var lb=document.getElementById("tlvl");
  lb.textContent=m.level;lb.className="lbg lb-"+m.level;lb.style.display="inline-block";
  for(var i=0;i<TABS.length;i++)
    document.getElementById(TABS[i]).innerHTML=getSection(m.id,TABS[i]);
  document.getElementById("sft").textContent="Topic "+m.id+" of "+M.length+"  ·  "+m.level;
}

function selectTopic(i){
  cur=i;renderSidebar();renderContent();switchTab("theory");
  document.getElementById("ct").scrollTop=0;closeSidebar();
}

function switchTab(tab){
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("active");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.getElementById(tab).classList.add("active");
  var idx=TABS.indexOf(tab);
  if(idx>=0)document.querySelectorAll(".tab")[idx].classList.add("active");
  document.getElementById("ct").scrollTop=0;
}

document.querySelectorAll(".tab").forEach(function(el){
  el.addEventListener("click",function(){switchTab(el.getAttribute("data-tab"));});
});

function tP(header){
  var body=header.nextElementSibling;
  var chev=header.querySelector(".chv");
  var open=body.style.display==="block";
  body.style.display=open?"none":"block";
  if(chev)chev.classList.toggle("op",!open);
}

function tS(btn){
  var box=btn.nextElementSibling;
  var open=box.classList.contains("open");
  box.classList.toggle("open",!open);
  btn.textContent=open?"▶ Show Solution":"▼ Hide Solution";
}

function openSidebar(){document.getElementById("sb").classList.add("open");document.getElementById("ovl").classList.add("open");}
function closeSidebar(){document.getElementById("sb").classList.remove("open");document.getElementById("ovl").classList.remove("open");}
document.getElementById("hbg").addEventListener("click",function(){
  document.getElementById("sb").classList.contains("open")?closeSidebar():openSidebar();
});
document.getElementById("ovl").addEventListener("click",closeSidebar);

renderSidebar();
renderContent();
</script>
