<script type="text/x-tmpl" id="m1-theory">
<h3>What is a Function and Why Do You Need One?</h3>
<p>A function is a named block of code you can call whenever you need it. Instead of writing the same SSH connection code 20 times in your script, you write it once as a function and call it 20 times. That's the entire point.</p>
<p>Think of it like this — in your network job you have standard procedures. "To configure a switch port, do steps 1, 2, 3." You don't invent the steps every time. You follow the procedure. A function is the same thing in code.</p>
<h4>Before and After Functions</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">without_functions.py — messy, repetitive</span></div><pre><span class="cm"># Connecting to R1</span>
conn_R1 = {<span class="st">"device_type"</span>:<span class="st">"cisco_ios"</span>,<span class="st">"host"</span>:<span class="st">"10.1.1.1"</span>,<span class="st">"username"</span>:<span class="st">"admin"</span>,<span class="st">"password"</span>:<span class="st">"admin123"</span>}
<span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn_R1) <span class="kw">as</span> net: out1 = net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)

<span class="cm"># Connecting to R2 — same code, different IP</span>
conn_R2 = {<span class="st">"device_type"</span>:<span class="st">"cisco_ios"</span>,<span class="st">"host"</span>:<span class="st">"10.1.1.2"</span>,<span class="st">"username"</span>:<span class="st">"admin"</span>,<span class="st">"password"</span>:<span class="st">"admin123"</span>}
<span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn_R2) <span class="kw">as</span> net: out2 = net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)

<span class="cm"># You copy-pasted this for EVERY device. Bug in one = bug in all.</span></pre></div>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">with_functions.py — clean, reusable</span></div><pre><span class="kw">def</span> <span class="fn">get_version</span>(ip, username=<span class="st">"admin"</span>, password=<span class="st">"admin123"</span>):
    <span class="st">"""Get show version output from a Cisco IOS device."""</span>
    conn = {<span class="st">"device_type"</span>:<span class="st">"cisco_ios"</span>,<span class="st">"host"</span>:ip,
            <span class="st">"username"</span>:username,<span class="st">"password"</span>:password}
    <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
        <span class="kw">return</span> net.<span class="fn">send_command</span>(<span class="st">"show version"</span>)

<span class="cm"># Now reuse for every device — one line each</span>
out1 = <span class="fn">get_version</span>(<span class="st">"10.1.1.1"</span>)
out2 = <span class="fn">get_version</span>(<span class="st">"10.1.1.2"</span>)
out3 = <span class="fn">get_version</span>(<span class="st">"10.1.1.3"</span>)</pre></div>
<div class="note f"><p><strong>Senior engineer take:</strong> If you're copying and pasting code, that's a signal you need a function. Any time you write the same logic twice, extract it into a function.</p></div>
</script>

<script type="text/x-tmpl" id="m1-industry">
<h3>Functions Are the Backbone of Every Production Script</h3>
<p>Every serious network automation script is built from small, focused functions. The main script just calls them in order. This makes scripts easy to test, debug, update, and share with teammates.</p>
<h4>What Functions Give You</h4>
<table class="tbl"><thead><tr><th>Benefit</th><th>In Practice</th></tr></thead><tbody>
<tr><td><strong>Reusability</strong></td><td>Write <code>check_bgp()</code> once, call it for 200 routers</td></tr>
<tr><td><strong>Readability</strong></td><td><code>get_version(ip)</code> is self-documenting — you know what it does</td></tr>
<tr><td><strong>Maintainability</strong></td><td>Bug in connection logic? Fix in one place, all callers benefit</td></tr>
<tr><td><strong>Testability</strong></td><td>Test one function in isolation before putting it in a big script</td></tr>
<tr><td><strong>Collaboration</strong></td><td>Teammates can use your functions without understanding the internals</td></tr>
</tbody></table>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab</div><p>In your EVE-NG lab, you'll write functions like <code>connect_to_device()</code>, <code>run_command()</code>, <code>backup_config()</code>, <code>check_interface()</code>. These become your personal automation toolkit — reused in every lab scenario.</p></div>
</script>

<script type="text/x-tmpl" id="m1-practical">
<h3>Anatomy of a Python Function</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">function_anatomy.py</span></div><pre><span class="cm"># def keyword + name + parentheses + colon</span>
<span class="kw">def</span> <span class="fn">function_name</span>(parameter1, parameter2):
    <span class="st">"""Docstring — explains what the function does."""</span>
    <span class="cm"># function body — indented</span>
    result = parameter1 + parameter2
    <span class="kw">return</span> result    <span class="cm"># optional — sends value back to caller</span>

<span class="cm"># Calling the function</span>
answer = <span class="fn">function_name</span>(<span class="nm">10</span>, <span class="nm">20</span>)
<span class="fn">print</span>(answer)   <span class="cm"># 30</span>

<span class="cm"># ─── Real network examples ──────────────────</span>
<span class="kw">def</span> <span class="fn">ping_device</span>(ip):
    <span class="st">"""Returns True if device responds to ping."""</span>
    <span class="kw">import</span> subprocess
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">make_report_line</span>(hostname, ip, status):
    <span class="st">"""Build a formatted report line string."""</span>
    icon = <span class="st">"✓"</span> <span class="kw">if</span> status == <span class="st">"UP"</span> <span class="kw">else</span> <span class="st">"✗"</span>
    <span class="kw">return</span> f<span class="st">"{icon} {hostname:15} {ip:18} [{status}]"</span>

<span class="cm"># Using both functions</span>
devices = [(<span class="st">"R1"</span>,<span class="st">"10.1.1.1"</span>),(<span class="st">"R2"</span>,<span class="st">"10.1.1.2"</span>)]
<span class="kw">for</span> name, ip <span class="kw">in</span> devices:
    up     = <span class="fn">ping_device</span>(ip)
    status = <span class="st">"UP"</span> <span class="kw">if</span> up <span class="kw">else</span> <span class="st">"DOWN"</span>
    <span class="fn">print</span>(<span class="fn">make_report_line</span>(name, ip, status))</pre></div>
</script>

<script type="text/x-tmpl" id="m2-theory">
<h3>Parameters and Arguments — Passing Data In</h3>
<p>Parameters are the variables inside the function parentheses. Arguments are the actual values you pass when you call it. Understanding the different ways to pass data into a function makes your code much more flexible.</p>
<h4>Four Ways to Pass Arguments</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">parameters_and_arguments.py</span></div><pre><span class="cm"># 1. Positional — order matters</span>
<span class="kw">def</span> <span class="fn">connect</span>(host, username, password):
    <span class="fn">print</span>(f<span class="st">"Connecting to {host} as {username}"</span>)

<span class="fn">connect</span>(<span class="st">"10.1.1.1"</span>, <span class="st">"admin"</span>, <span class="st">"admin123"</span>)  <span class="cm"># positional</span>

<span class="cm"># 2. Keyword — order doesn't matter</span>
<span class="fn">connect</span>(username=<span class="st">"admin"</span>, host=<span class="st">"10.1.1.1"</span>, password=<span class="st">"admin123"</span>)

<span class="cm"># 3. Default values — parameter is optional</span>
<span class="kw">def</span> <span class="fn">connect</span>(host, username=<span class="st">"admin"</span>, password=<span class="st">"admin123"</span>, timeout=<span class="nm">10</span>):
    <span class="fn">print</span>(f<span class="st">"Connecting to {host} as {username}, timeout={timeout}"</span>)

<span class="fn">connect</span>(<span class="st">"10.1.1.1"</span>)                     <span class="cm"># uses all defaults</span>
<span class="fn">connect</span>(<span class="st">"10.1.1.2"</span>, timeout=<span class="nm">30</span>)         <span class="cm"># override just timeout</span>
<span class="fn">connect</span>(<span class="st">"10.1.1.3"</span>, password=<span class="st">"newpass"</span>) <span class="cm"># override just password</span>

<span class="cm"># 4. **kwargs — accept any keyword arguments</span>
<span class="kw">def</span> <span class="fn">build_conn</span>(host, **kwargs):
    conn = {<span class="st">"host"</span>: host}
    conn.<span class="fn">update</span>(kwargs)
    <span class="kw">return</span> conn

params = <span class="fn">build_conn</span>(<span class="st">"10.1.1.1"</span>, username=<span class="st">"admin"</span>, device_type=<span class="st">"cisco_ios"</span>)
<span class="fn">print</span>(params)   <span class="cm"># {"host":"10.1.1.1","username":"admin","device_type":"cisco_ios"}</span></pre></div>
</script>

<script type="text/x-tmpl" id="m2-industry">
<h3>Default Parameters in Network Functions</h3>
<p>Default parameters are extremely useful in network automation — most of your devices share the same credentials, platform type, and timeout. You set sensible defaults and only override when needed.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">Realistic default parameter usage</span></div><pre><span class="kw">def</span> <span class="fn">ssh_connect</span>(host,
               device_type=<span class="st">"cisco_ios"</span>,
               username=<span class="st">"admin"</span>,
               password=<span class="st">"admin123"</span>,
               timeout=<span class="nm">10</span>,
               port=<span class="nm">22</span>):
    <span class="st">"""Build netmiko connection dict with sensible defaults."""</span>
    <span class="kw">return</span> {
        <span class="st">"device_type"</span>: device_type,
        <span class="st">"host"</span>       : host,
        <span class="st">"username"</span>   : username,
        <span class="st">"password"</span>   : password,
        <span class="st">"timeout"</span>    : timeout,
        <span class="st">"port"</span>       : port,
    }

<span class="cm"># Most devices — just pass the IP</span>
conn1 = <span class="fn">ssh_connect</span>(<span class="st">"10.1.1.1"</span>)

<span class="cm"># Juniper device — override platform</span>
conn2 = <span class="fn">ssh_connect</span>(<span class="st">"10.1.1.5"</span>, device_type=<span class="st">"juniper_junos"</span>)

<span class="cm"># Non-standard SSH port</span>
conn3 = <span class="fn">ssh_connect</span>(<span class="st">"10.1.1.6"</span>, port=<span class="nm">2222</span>)</pre></div>
<div class="note g"><p><strong>Clean rule:</strong> Put required parameters first (the ones that always change, like <code>host</code>). Put optional/default parameters after. This way callers only need to specify what's different from the standard.</p></div>
</script>

<script type="text/x-tmpl" id="m2-practical">
<h3>Parameters in Real Network Functions</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">network_functions_params.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> subprocess

<span class="kw">def</span> <span class="fn">ping_device</span>(ip, count=<span class="nm">1</span>, timeout=<span class="nm">2</span>):
    <span class="st">"""Ping a device. Returns True if reachable."""</span>
    r = subprocess.<span class="fn">run</span>(
        [<span class="st">"ping"</span>, <span class="st">"-c"</span>, <span class="fn">str</span>(count), <span class="st">"-W"</span>, <span class="fn">str</span>(timeout), ip],
        capture_output=<span class="kw">True</span>
    )
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">check_device</span>(hostname, ip, expected_type=<span class="st">"router"</span>):
    <span class="st">"""Check if a device is reachable and print a report line."""</span>
    reachable = <span class="fn">ping_device</span>(ip)
    status    = <span class="st">"UP"</span> <span class="kw">if</span> reachable <span class="kw">else</span> <span class="st">"DOWN"</span>
    icon      = <span class="st">"✓"</span> <span class="kw">if</span> reachable <span class="kw">else</span> <span class="st">"✗"</span>
    <span class="fn">print</span>(f<span class="st">"{icon} {hostname:12} {ip:18} [{expected_type:8}] [{status}]"</span>)
    <span class="kw">return</span> reachable

<span class="cm"># EVE-NG lab device checks</span>
lab_devices = [
    (<span class="st">"R1"</span>,    <span class="st">"192.168.100.1"</span>,  <span class="st">"router"</span>),
    (<span class="st">"R2"</span>,    <span class="st">"192.168.100.2"</span>,  <span class="st">"router"</span>),
    (<span class="st">"SW-01"</span>, <span class="st">"192.168.100.10"</span>, <span class="st">"switch"</span>),
]

<span class="fn">print</span>(f<span class="st">"{'Device':12} {'IP':18} {'Type':10} {'Status'}"</span>)
<span class="fn">print</span>(<span class="st">"-"</span> * <span class="nm">55</span>)

up_count = <span class="nm">0</span>
<span class="kw">for</span> name, ip, dtype <span class="kw">in</span> lab_devices:
    <span class="kw">if</span> <span class="fn">check_device</span>(name, ip, dtype):
        up_count += <span class="nm">1</span>

<span class="fn">print</span>(f<span class="st">"\n{up_count}/{len(lab_devices)} devices reachable"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m3-theory">
<h3>Return Values — Getting Data Out of a Function</h3>
<p>A function does work and usually gives something back — a result, a status, some data. The <code>return</code> keyword sends a value back to whoever called the function. Without a <code>return</code>, a function returns <code>None</code>.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">return_values.py</span></div><pre><span class="cm"># Return a single value</span>
<span class="kw">def</span> <span class="fn">is_reachable</span>(ip):
    <span class="kw">import</span> subprocess
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>    <span class="cm"># returns True or False</span>

<span class="cm"># Return a dict (most common in network automation)</span>
<span class="kw">def</span> <span class="fn">check_device</span>(hostname, ip):
    up = <span class="fn">is_reachable</span>(ip)
    <span class="kw">return</span> {
        <span class="st">"hostname"</span>: hostname,
        <span class="st">"ip"</span>      : ip,
        <span class="st">"status"</span>  : <span class="st">"UP"</span> <span class="kw">if</span> up <span class="kw">else</span> <span class="st">"DOWN"</span>,
        <span class="st">"reachable"</span>: up
    }

<span class="cm"># Return multiple values (Python packs them as a tuple)</span>
<span class="kw">def</span> <span class="fn">get_counts</span>(devices):
    up   = <span class="fn">sum</span>(<span class="nm">1</span> <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> d[<span class="st">"status"</span>] == <span class="st">"UP"</span>)
    down = <span class="fn">len</span>(devices) - up
    <span class="kw">return</span> up, down   <span class="cm"># returns a tuple</span>

<span class="cm"># Unpack multiple return values</span>
result  = <span class="fn">check_device</span>(<span class="st">"R1"</span>, <span class="st">"10.1.1.1"</span>)
<span class="fn">print</span>(result[<span class="st">"status"</span>])

up_cnt, down_cnt = <span class="fn">get_counts</span>(all_devices)   <span class="cm"># unpacking</span>
<span class="fn">print</span>(f<span class="st">"Up: {up_cnt} | Down: {down_cnt}"</span>)</pre></div>
<div class="note f"><p><strong>Best practice:</strong> Return a dict when you have multiple related values to return. Dicts are self-documenting — <code>result["status"]</code> is clearer than <code>result[0]</code>.</p></div>
</script>

<script type="text/x-tmpl" id="m3-industry">
<h3>Return Values in Real Automation Scripts</h3>
<p>Every function that checks, collects, or processes data should return something useful. Your main loop calls the function, gets back the result, and decides what to do with it.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">Return patterns in production</span></div><pre><span class="cm"># Pattern 1: Return status dict — most flexible</span>
<span class="kw">def</span> <span class="fn">run_command</span>(net_connection, command):
    <span class="kw">try</span>:
        output = net_connection.<span class="fn">send_command</span>(command)
        <span class="kw">return</span> {<span class="st">"ok"</span>: <span class="kw">True</span>, <span class="st">"output"</span>: output, <span class="st">"error"</span>: <span class="kw">None</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>: <span class="kw">False</span>, <span class="st">"output"</span>: <span class="kw">None</span>, <span class="st">"error"</span>: <span class="fn">str</span>(e)}

<span class="cm"># Caller checks the result</span>
result = <span class="fn">run_command</span>(net, <span class="st">"show version"</span>)
<span class="kw">if</span> result[<span class="st">"ok"</span>]:
    <span class="fn">print</span>(result[<span class="st">"output"</span>])
<span class="kw">else</span>:
    <span class="fn">print</span>(<span class="st">"Error:"</span>, result[<span class="st">"error"</span>])

<span class="cm"># Pattern 2: Early return on failure</span>
<span class="kw">def</span> <span class="fn">get_interfaces</span>(ip, auth):
    <span class="kw">if not</span> <span class="fn">is_reachable</span>(ip):
        <span class="kw">return</span> <span class="kw">None</span>             <span class="cm"># early return — device down</span>
    <span class="cm"># Only gets here if device is up</span>
    <span class="kw">return</span> <span class="fn">fetch_interfaces_via_api</span>(ip, auth)</pre></div>
</script>

<script type="text/x-tmpl" id="m3-practical">
<h3>Return Values — Full Examples</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">return_examples.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> subprocess, json

<span class="kw">def</span> <span class="fn">ping_check</span>(hostname, ip):
    <span class="st">"""Returns a result dict with device info and ping outcome."""</span>
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"2"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],capture_output=<span class="kw">True</span>)
    up = r.returncode == <span class="nm">0</span>
    <span class="kw">return</span> {
        <span class="st">"hostname"</span>  : hostname,
        <span class="st">"ip"</span>        : ip,
        <span class="st">"reachable"</span> : up,
        <span class="st">"status"</span>    : <span class="st">"UP"</span> <span class="kw">if</span> up <span class="kw">else</span> <span class="st">"DOWN"</span>
    }

<span class="kw">def</span> <span class="fn">scan_lab</span>(devices):
    <span class="st">"""Scan all devices and return summary report."""</span>
    results = [<span class="fn">ping_check</span>(d[<span class="st">"hostname"</span>], d[<span class="st">"ip"</span>]) <span class="kw">for</span> d <span class="kw">in</span> devices]
    up      = [r <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if</span> r[<span class="st">"reachable"</span>]]
    down    = [r <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if not</span> r[<span class="st">"reachable"</span>]]
    <span class="kw">return</span> {<span class="st">"total"</span>:len(results), <span class="st">"up"</span>:len(up), <span class="st">"down"</span>:len(down), <span class="st">"results"</span>:results}

<span class="cm"># EVE-NG lab</span>
lab_devices = [
    {<span class="st">"hostname"</span>:<span class="st">"R1"</span>,   <span class="st">"ip"</span>:<span class="st">"192.168.100.1"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"R2"</span>,   <span class="st">"ip"</span>:<span class="st">"192.168.100.2"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"SW-01"</span>,<span class="st">"ip"</span>:<span class="st">"192.168.100.10"</span>},
]

report = <span class="fn">scan_lab</span>(lab_devices)
<span class="fn">print</span>(f<span class="st">"Lab Scan: {report['up']}/{report['total']} UP"</span>)
<span class="kw">for</span> r <span class="kw">in</span> report[<span class="st">"results"</span>]:
    icon = <span class="st">"✓"</span> <span class="kw">if</span> r[<span class="st">"reachable"</span>] <span class="kw">else</span> <span class="st">"✗"</span>
    <span class="fn">print</span>(f<span class="st">"  {icon} {r['hostname']:10} {r['ip']:18} {r['status']}"</span>)

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"scan_report.json"</span>, <span class="st">"w"</span>) <span class="kw">as</span> f:
    json.<span class="fn">dump</span>(report, f, indent=<span class="nm">2</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m3-flow">
<h3>Return Value Patterns</h3>
<div class="fb">
  <div class="g2">
    <div>
      <p style="color:var(--grn);font-size:12px;font-weight:600;margin-bottom:4px">Return True/False</p>
      <div class="fn2 g">Best for: yes/no checks<br><code>is_reachable(ip)</code><br><code>vlan_exists(sw, vid)</code></div>
    </div>
    <div>
      <p style="color:var(--blu);font-size:12px;font-weight:600;margin-bottom:4px">Return a dict</p>
      <div class="fn2 b">Best for: multiple related values<br><code>{"ok":True,"data":...}</code><br><code>{"status":"UP","ip":...}</code></div>
    </div>
    <div>
      <p style="color:var(--yel);font-size:12px;font-weight:600;margin-bottom:4px">Return a list</p>
      <div class="fn2 y">Best for: collections<br><code>[dev1, dev2, dev3]</code><br><code>["GigE0/0","GigE0/1"]</code></div>
    </div>
    <div>
      <p style="color:var(--mut);font-size:12px;font-weight:600;margin-bottom:4px">Return None</p>
      <div class="fn2">Best for: failure / not found<br><code>return None</code> early<br>Caller checks: <code>if result:</code></div>
    </div>
  </div>
</div>
</script>

<!-- ═══ TOPIC 4 ═══ -->
<script type="text/x-tmpl" id="m4-theory">
<h3>Scope — Where Variables Live</h3>
<p>Scope defines where a variable can be seen. Variables inside a function stay inside that function. Variables at the top of a script are global. Getting this wrong causes confusing bugs where you think a variable should be available but Python can't find it.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">scope_explained.py</span></div><pre><span class="cm"># Global scope — available everywhere in the file</span>
DEFAULT_USERNAME = <span class="st">"admin"</span>
DEFAULT_PASSWORD = <span class="st">"admin123"</span>

<span class="kw">def</span> <span class="fn">connect_device</span>(host):
    <span class="cm"># Local scope — only exists inside this function</span>
    conn_params = {
        <span class="st">"host"</span>    : host,
        <span class="st">"username"</span>: DEFAULT_USERNAME,   <span class="cm"># reading global is fine</span>
        <span class="st">"password"</span>: DEFAULT_PASSWORD,
    }
    <span class="kw">return</span> conn_params

<span class="cm"># conn_params does NOT exist here — it's local to the function</span>
<span class="cm"># print(conn_params)  # NameError: name 'conn_params' is not defined</span>

result = <span class="fn">connect_device</span>(<span class="st">"10.1.1.1"</span>)   <span class="cm"># result exists here — it's the return value</span>
<span class="fn">print</span>(result)                           <span class="cm"># works fine</span></pre></div>
<div class="note y"><p><strong>The rule:</strong> Don't use global variables for data inside functions. Pass data as parameters and receive it back via return. Functions should be self-contained — they work on their inputs, return their outputs.</p></div>
</script>

<script type="text/x-tmpl" id="m4-industry">
<h3>Scope in Production — Best Practices</h3>
<h4>Constants Are OK as Globals</h4>
<p>It's fine to have global constants at the top of your script — things that don't change: <code>DEFAULT_TIMEOUT = 10</code>, <code>LOG_FILE = "network_audit.log"</code>. The key word is <em>constant</em>. Don't modify them inside functions.</p>
<h4>Don't Mutate Globals Inside Functions</h4>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">scope_good_vs_bad.py</span></div><pre><span class="cm"># BAD — function secretly modifies global list</span>
all_results = []
<span class="kw">def</span> <span class="fn">bad_check</span>(ip):
    all_results.<span class="fn">append</span>(ip)   <span class="cm"># modifying global — confusing!</span>

<span class="cm"># GOOD — function returns result, caller decides what to do</span>
<span class="kw">def</span> <span class="fn">good_check</span>(ip):
    <span class="kw">return</span> {<span class="st">"ip"</span>: ip, <span class="st">"reachable"</span>: <span class="kw">True</span>}

all_results = []
<span class="kw">for</span> ip <span class="kw">in</span> device_ips:
    result = <span class="fn">good_check</span>(ip)    <span class="cm"># caller controls the list</span>
    all_results.<span class="fn">append</span>(result)</pre></div>
</script>

<script type="text/x-tmpl" id="m4-practical">
<h3>Scope in Practice</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">scope_network_script.py</span></div><pre><span class="cm"># Module-level constants — global and that's fine</span>
DEFAULT_TIMEOUT  = <span class="nm">10</span>
DEFAULT_PLATFORM = <span class="st">"cisco_ios"</span>
LOG_FILE         = <span class="st">"audit.log"</span>

<span class="kw">def</span> <span class="fn">build_conn</span>(host, username, password, timeout=<span class="kw">None</span>):
    <span class="st">"""Build a connection dict. Uses DEFAULT_TIMEOUT if not specified."""</span>
    <span class="kw">return</span> {
        <span class="st">"device_type"</span>: DEFAULT_PLATFORM,     <span class="cm"># reading constant is fine</span>
        <span class="st">"host"</span>       : host,
        <span class="st">"username"</span>   : username,
        <span class="st">"password"</span>   : password,
        <span class="st">"timeout"</span>    : timeout <span class="kw">or</span> DEFAULT_TIMEOUT
    }

<span class="kw">def</span> <span class="fn">log_result</span>(hostname, status, message=<span class="st">""</span>):
    <span class="st">"""Append a result line to the log file."""</span>
    <span class="kw">with</span> <span class="fn">open</span>(LOG_FILE, <span class="st">"a"</span>) <span class="kw">as</span> f:              <span class="cm"># reading global constant</span>
        f.<span class="fn">write</span>(f<span class="st">"{hostname},{status},{message}\n"</span>)

<span class="cm"># Main script</span>
devices = [(<span class="st">"R1"</span>,<span class="st">"10.1.1.1"</span>),(<span class="st">"R2"</span>,<span class="st">"10.1.1.2"</span>)]
<span class="kw">for</span> name, ip <span class="kw">in</span> devices:
    conn = <span class="fn">build_conn</span>(ip, <span class="st">"admin"</span>, <span class="st">"admin123"</span>)
    <span class="fn">log_result</span>(name, <span class="st">"OK"</span>)
    <span class="fn">print</span>(f<span class="st">"Built conn for {name}: {conn}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m4-practice">

  <div class="pb" style="display:none"><p>What is wrong with this code? Fix it:<br><code>def get_report(): lines = []; lines.append("Header")</code><br><code>get_report()</code><br><code>print(lines)  # NameError</code></p>

<script type="text/x-tmpl" id="m5-theory">
<h3>Docstrings and Type Hints — Writing Functions Others Can Use</h3>
<p>A function you wrote 6 months ago that has no documentation is basically a function someone else wrote. Docstrings and type hints make your functions self-explanatory — your team can use them without asking you what parameters to pass.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">documented_functions.py</span></div><pre><span class="cm"># Type hints — what type each parameter expects</span>
<span class="cm"># and what the function returns</span>
<span class="kw">def</span> <span class="fn">ping_device</span>(ip: str, count: int = <span class="nm">1</span>, timeout: int = <span class="nm">2</span>) -> bool:
    <span class="st">"""Check if a device responds to ping.

    Args:
        ip      : Management IP address of the device.
        count   : Number of ping packets to send.
        timeout : Seconds to wait for each reply.

    Returns:
        True if device is reachable, False otherwise.

    Example:
        >>> ping_device("10.1.1.1")
        True
    """</span>
    <span class="kw">import</span> subprocess
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="fn">str</span>(count),<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],
                        capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="cm"># Reading the docstring</span>
<span class="fn">print</span>(<span class="fn">ping_device</span>.__doc__)</pre></div>
</script>

<script type="text/x-tmpl" id="m5-industry">
<h3>Why Documentation Matters on a Team</h3>
<p>When you build a library of network automation functions, other engineers on your team will use them. If your functions have proper docstrings and type hints, they can use them without reading the implementation.</p>
<div class="note e"><p><strong>Industry standard:</strong> Most enterprise network automation teams follow the Google or NumPy docstring style. IDEs like VS Code and PyCharm show the docstring as a tooltip when you hover over a function call — extremely useful.</p></div>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">Well-documented network functions</span></div><pre><span class="kw">from</span> typing <span class="kw">import</span> Optional, List, Dict

<span class="kw">def</span> <span class="fn">build_connection</span>(
    host     : str,
    platform : str = <span class="st">"cisco_ios"</span>,
    username : str = <span class="st">"admin"</span>,
    password : str = <span class="st">"admin123"</span>,
    timeout  : int = <span class="nm">10</span>
) -> Dict:
    <span class="st">"""Build a Netmiko connection parameter dict.

    Args:
        host     : Device IP or hostname.
        platform : Netmiko device_type string.
        username : SSH username.
        password : SSH password.
        timeout  : Connection timeout in seconds.

    Returns:
        Dict ready to pass to ConnectHandler(**conn).
    """</span>
    <span class="kw">return</span> {<span class="st">"device_type"</span>:platform,<span class="st">"host"</span>:host,
            <span class="st">"username"</span>:username,<span class="st">"password"</span>:password,<span class="st">"timeout"</span>:timeout}

<span class="kw">def</span> <span class="fn">get_unreachable</span>(devices: List[Dict]) -> List[str]:
    <span class="st">"""Return hostnames of devices that failed ping check."""</span>
    <span class="kw">return</span> [d[<span class="st">"hostname"</span>] <span class="kw">for</span> d <span class="kw">in</span> devices
            <span class="kw">if not</span> <span class="fn">ping_device</span>(d[<span class="st">"ip"</span>])]</pre></div>
</script>

<script type="text/x-tmpl" id="m5-practical">
<h3>Documenting Your EVE-NG Automation Functions</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">eve_toolkit.py — documented function library</span><span class="etag">EVE-NG</span></div><pre><span class="st">"""
eve_toolkit.py
==============
Reusable functions for EVE-NG lab automation.
Import this in your scripts: from eve_toolkit import *
"""</span>
<span class="kw">import</span> subprocess, yaml, json
<span class="kw">from</span> typing <span class="kw">import</span> Dict, List, Optional

<span class="kw">def</span> <span class="fn">load_inventory</span>(path: str = <span class="st">"eve_inventory.yaml"</span>) -> Dict:
    <span class="st">"""Load EVE-NG device inventory from YAML file.

    Args:
        path: Path to YAML inventory file.

    Returns:
        Dict with lab_name and devices list, or empty dict on error.
    """</span>
    <span class="kw">try</span>:
        <span class="kw">with</span> <span class="fn">open</span>(path) <span class="kw">as</span> f:
            <span class="kw">return</span> yaml.<span class="fn">safe_load</span>(f)
    <span class="kw">except</span> FileNotFoundError:
        <span class="fn">print</span>(f<span class="st">"Inventory file not found: {path}"</span>)
        <span class="kw">return</span> {}

<span class="kw">def</span> <span class="fn">is_reachable</span>(ip: str, timeout: int = <span class="nm">1</span>) -> bool:
    <span class="st">"""Ping a device once and return True if it responds.

    Args:
        ip      : IP address to ping.
        timeout : Wait seconds per ping packet.

    Returns:
        True if reachable, False if not.
    """</span>
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],
                        capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">save_report</span>(data, filename: str = <span class="st">"report.json"</span>) -> None:
    <span class="st">"""Save data to a JSON file.

    Args:
        data     : Dict or list to serialise.
        filename : Output file path.
    """</span>
    <span class="kw">with</span> <span class="fn">open</span>(filename, <span class="st">"w"</span>) <span class="kw">as</span> f:
        json.<span class="fn">dump</span>(data, f, indent=<span class="nm">2</span>)
    <span class="fn">print</span>(f<span class="st">"Saved: {filename}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m5-flow">
<h3>Docstring Structure</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">docstring_template.py</span></div><pre><span class="kw">def</span> <span class="fn">function_name</span>(param1: str, param2: int = <span class="nm">0</span>) -> bool:

<script type="text/x-tmpl" id="m6-theory">
<h3>Lambda Functions — Quick One-Liners</h3>
<p>A lambda is a small anonymous function you can write in one line. You don't give it a name with <code>def</code>. It's useful when you need a simple function just once — most commonly when sorting or filtering data.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">lambda_demo.py</span></div><pre><span class="cm"># Normal function</span>
<span class="kw">def</span> <span class="fn">get_hostname</span>(device):
    <span class="kw">return</span> device[<span class="st">"hostname"</span>]

<span class="cm"># Same thing as lambda</span>
get_hostname = <span class="kw">lambda</span> device: device[<span class="st">"hostname"</span>]

<span class="cm"># Most useful: sorting a list of dicts</span>
devices = [
    {<span class="st">"hostname"</span>:<span class="st">"SW-02"</span>, <span class="st">"ip"</span>:<span class="st">"10.1.1.12"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"R1"</span>,    <span class="st">"ip"</span>:<span class="st">"10.1.1.1"</span>},
    {<span class="st">"hostname"</span>:<span class="st">"SW-01"</span>, <span class="st">"ip"</span>:<span class="st">"10.1.1.11"</span>},
]

<span class="cm"># Sort by hostname alphabetically</span>
sorted_by_name = <span class="fn">sorted</span>(devices, key=<span class="kw">lambda</span> d: d[<span class="st">"hostname"</span>])

<span class="cm"># Sort by IP address</span>
sorted_by_ip   = <span class="fn">sorted</span>(devices, key=<span class="kw">lambda</span> d: d[<span class="st">"ip"</span>])

<span class="cm"># Filter — keep only devices with IP starting with 10.1.1.1x</span>
switches = <span class="fn">list</span>(<span class="fn">filter</span>(<span class="kw">lambda</span> d: d[<span class="st">"hostname"</span>].<span class="fn">startswith</span>(<span class="st">"SW"</span>), devices))</pre></div>
<div class="note"><p><strong>When to use lambda vs def:</strong> Use lambda for simple one-expression functions used as arguments (key=, filter=). Use def when the logic is more than one expression or you'll reuse the function.</p></div>
</script>

<script type="text/x-tmpl" id="m6-industry">
<h3>Lambda in Network Automation — Real Use Cases</h3>

]

<span class="cm"># ['VLAN10','VLAN20','VLAN100','VLAN200'] — numeric sort</span></pre></div>

    {<span class="st">"hostname"</span>:<span class="st">"SW-CORE-01"</span>,<span class="st">"ip"</span>:<span class="st">"10.1.1.11"</span>,<span class="st">"type"</span>:<span class="st">"switch"</span>,  <span class="st">"reachable"</span>:<span class="kw">False</span>},
    {<span class="st">"hostname"</span>:<span class="st">"R2"</span>,        <span class="st">"ip"</span>:<span class="st">"10.1.1.2"</span>, <span class="st">"type"</span>:<span class="st">"router"</span>,  <span class="st">"reachable"</span>:<span class="kw">True</span>},

]

<span class="cm"># 1. Alphabetical by hostname</span>
by_name = <span class="fn">sorted</span>(devices, key=<span class="kw">lambda</span> d: d[<span class="st">"hostname"</span>])

<span class="cm"># 2. Reachable devices only</span>
reachable = [d <span class="kw">for</span> d <span class="kw">in</span> devices <span class="kw">if</span> d[<span class="st">"reachable"</span>]]

<span class="cm"># 3. Group by type — sort by type first</span>
by_type = <span class="fn">sorted</span>(devices, key=<span class="kw">lambda</span> d: (d[<span class="st">"type"</span>], d[<span class="st">"hostname"</span>]))

<span class="fn">print</span>(<span class="st">"By hostname:"</span>)
<span class="kw">for</span> d <span class="kw">in</span> by_name:
    icon = <span class="st">"✓"</span> <span class="kw">if</span> d[<span class="st">"reachable"</span>] <span class="kw">else</span> <span class="st">"✗"</span>

<script type="text/x-tmpl" id="m7-theory">
<h3>Error Handling in Functions — try/except Inside Functions</h3>
<p>Functions in network automation almost always deal with network operations — SSH connections, API calls, file I/O — things that can fail. A function that crashes your whole script when one device is unreachable is a bad function. Error handling inside functions makes them robust.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">error_handling_in_functions.py</span></div><pre><span class="cm"># BAD — one failure crashes everything</span>
<span class="kw">def</span> <span class="fn">bad_get_version</span>(ip):
    r = requests.<span class="fn">get</span>(f<span class="st">"https://{ip}/restconf/..."</span>)   <span class="cm"># crashes if offline</span>
    <span class="kw">return</span> r.<span class="fn">json</span>()

<span class="cm"># GOOD — handles errors, always returns something</span>
<span class="kw">def</span> <span class="fn">get_version</span>(ip: str, auth: tuple) -> dict:
    <span class="st">"""Get device version via RESTCONF. Returns status dict."""</span>
    <span class="kw">import</span> requests
    requests.packages.urllib3.<span class="fn">disable_warnings</span>()
    <span class="kw">try</span>:
        r = requests.<span class="fn">get</span>(
            f<span class="st">"https://{ip}/restconf/data/Cisco-IOS-XE-native:native/version"</span>,
            auth=auth,
            headers={<span class="st">"Accept"</span>:<span class="st">"application/yang-data+json"</span>},
            verify=<span class="kw">False</span>,
            timeout=<span class="nm">10</span>
        )
        r.<span class="fn">raise_for_status</span>()
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>, <span class="st">"data"</span>:r.<span class="fn">json</span>(), <span class="st">"error"</span>:<span class="kw">None</span>}

    <span class="kw">except</span> requests.exceptions.ConnectTimeout:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"data"</span>:<span class="kw">None</span>, <span class="st">"error"</span>:<span class="st">"timeout"</span>}
    <span class="kw">except</span> requests.exceptions.HTTPError <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"data"</span>:<span class="kw">None</span>, <span class="st">"error"</span>:f<span class="st">"HTTP {e.response.status_code}"</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"data"</span>:<span class="kw">None</span>, <span class="st">"error"</span>:<span class="fn">str</span>(e)}</pre></div>
</script>

<script type="text/x-tmpl" id="m7-industry">
<h3>Graceful Functions in Production</h3>
<p>The "ok / error" return dict pattern is used everywhere in professional network automation code. Every function that touches the network should return this structure — the caller can always check <code>if result["ok"]:</code> without worrying about exceptions.</p>
<div class="note g"><p><strong>Golden pattern:</strong> Network functions should <em>never raise exceptions</em> to the caller. Catch the exception inside, put the error message in the return dict. The caller does a simple <code>if result["ok"]:</code> check. Clean, predictable, testable.</p></div>
</script>

<script type="text/x-tmpl" id="m7-practical">
<h3>Robust Function Library for EVE-NG</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">robust_eve_functions.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler, NetmikoTimeoutException, NetmikoAuthenticationException
<span class="kw">import</span> yaml, json
<span class="kw">from</span> typing <span class="kw">import</span> Dict, Optional

<span class="kw">def</span> <span class="fn">ssh_run_command</span>(device: Dict, command: str) -> Dict:
    <span class="st">"""SSH to a device, run one command, return result.

    Args:
        device  : Dict with host, platform, username, password.
        command : CLI command to run.

    Returns:
        Dict with ok (bool), output (str or None), error (str or None).
    """</span>
    name = device.<span class="fn">get</span>(<span class="st">"hostname"</span>, device.<span class="fn">get</span>(<span class="st">"host"</span>, <span class="st">"unknown"</span>))
    <span class="kw">try</span>:
        conn = {
            <span class="st">"device_type"</span>: device[<span class="st">"platform"</span>],
            <span class="st">"host"</span>       : device[<span class="st">"ip"</span>],
            <span class="st">"username"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
            <span class="st">"password"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],
            <span class="st">"timeout"</span>    : <span class="nm">10</span>,
        }
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            output = net.<span class="fn">send_command</span>(command)
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>, <span class="st">"device"</span>:name, <span class="st">"output"</span>:output, <span class="st">"error"</span>:<span class="kw">None</span>}

    <span class="kw">except</span> NetmikoTimeoutException:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"device"</span>:name, <span class="st">"output"</span>:<span class="kw">None</span>, <span class="st">"error"</span>:<span class="st">"SSH timeout"</span>}
    <span class="kw">except</span> NetmikoAuthenticationException:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"device"</span>:name, <span class="st">"output"</span>:<span class="kw">None</span>, <span class="st">"error"</span>:<span class="st">"Auth failed"</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"device"</span>:name, <span class="st">"output"</span>:<span class="kw">None</span>, <span class="st">"error"</span>:<span class="fn">str</span>(e)}

<span class="cm"># Using the function in a loop — caller is clean</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

<span class="kw">for</span> device <span class="kw">in</span> devices:
    result = <span class="fn">ssh_run_command</span>(device, <span class="st">"show version"</span>)
    <span class="kw">if</span> result[<span class="st">"ok"</span>]:
        <span class="fn">print</span>(f<span class="st">"✓ {result['device']}: got output"</span>)
    <span class="kw">else</span>:
        <span class="fn">print</span>(f<span class="st">"✗ {result['device']}: {result['error']}"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m7-flow">
<h3>Error Handling Flow Inside a Function</h3>
<div class="fb">
  <div class="fr"><div class="fn2 f">def ssh_run_command(device, command):</div></div>
  <div style="height:5px"></div>
  <div class="fr" style="padding-left:14px"><div class="fn2 y">try: SSH connect → run command</div></div>
  <div class="fr" style="padding-left:14px"><div class="fn2 g">success → return {"ok":True, "output":...}</div></div>
  <div class="fr" style="padding-left:14px"><div class="fn2 r">except Timeout → return {"ok":False, "error":"timeout"}</div></div>
  <div class="fr" style="padding-left:14px"><div class="fn2 r">except Auth → return {"ok":False, "error":"auth failed"}</div></div>
  <div class="fr" style="padding-left:14px"><div class="fn2 r">except Exception → return {"ok":False, "error":str(e)}</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2">Caller always gets a dict — never an exception</div></div>
  <div class="fr"><div class="fn2 b">if result["ok"]: → process data</div></div>
  <div class="fr"><div class="fn2 r">else: → log error, continue</div></div>
</div>
</script>

<!-- ═══ TOPIC 8 ═══ -->
<script type="text/x-tmpl" id="m8-theory">
<h3>Functions Calling Functions — Building a Toolkit</h3>
<p>The real power of functions comes when you compose them — small, focused functions that call each other to build up more complex behaviour. Each function does one thing. The main script just orchestrates them.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">function_composition.py</span></div><pre><span class="cm"># Small focused functions</span>
<span class="kw">def</span> <span class="fn">is_reachable</span>(ip): ...      <span class="cm"># returns True/False</span>
<span class="kw">def</span> <span class="fn">build_conn</span>(device): ...    <span class="cm"># returns conn dict</span>
<span class="kw">def</span> <span class="fn">run_show</span>(conn, cmd): ...   <span class="cm"># returns output string</span>
<span class="kw">def</span> <span class="fn">parse_version</span>(output): ... <span class="cm"># returns version string</span>
<span class="kw">def</span> <span class="fn">save_result</span>(data, f): ...  <span class="cm"># returns None</span>

<span class="cm"># Composed function — calls all the small ones</span>
<span class="kw">def</span> <span class="fn">audit_device</span>(device):
    <span class="st">"""Full audit of one device — calls 5 smaller functions."""</span>
    <span class="kw">if not</span> <span class="fn">is_reachable</span>(device[<span class="st">"ip"</span>]):
        <span class="kw">return</span> {<span class="st">"ok"</span>: <span class="kw">False</span>, <span class="st">"error"</span>: <span class="st">"unreachable"</span>}

    conn    = <span class="fn">build_conn</span>(device)
    output  = <span class="fn">run_show</span>(conn, <span class="st">"show version"</span>)
    version = <span class="fn">parse_version</span>(output)

    result = {<span class="st">"hostname"</span>: device[<span class="st">"hostname"</span>], <span class="st">"version"</span>: version, <span class="st">"ok"</span>: <span class="kw">True</span>}
    <span class="kw">return</span> result

<span class="cm"># Main script is incredibly clean — just a loop</span>
results = [<span class="fn">audit_device</span>(d) <span class="kw">for</span> d <span class="kw">in</span> devices]</pre></div>
<div class="note f"><p><strong>This is how all real automation scripts are built.</strong> The main block is short and readable. All the complexity is hidden in well-named functions. A new teammate can read the main block and understand the script in 30 seconds.</p></div>
</script>

<script type="text/x-tmpl" id="m8-industry">
<h3>Function Composition in Production Automation</h3>
<p>Every well-written automation script has three layers: low-level functions (connect, run command), mid-level functions (audit_device, backup_config), and a main orchestrator (the loop). Each layer only calls the layer below it.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">three_layer_architecture.py</span></div><pre><span class="cm"># ─── Layer 1: Primitives ────────────────────────</span>
<span class="kw">def</span> <span class="fn">ping</span>(ip): ...
<span class="kw">def</span> <span class="fn">ssh_connect</span>(device): ...
<span class="kw">def</span> <span class="fn">run_command</span>(conn, cmd): ...

<span class="cm"># ─── Layer 2: Device operations ─────────────────</span>
<span class="kw">def</span> <span class="fn">get_interfaces</span>(device):     <span class="cm"># calls ssh_connect + run_command</span>
    ...
<span class="kw">def</span> <span class="fn">backup_config</span>(device):      <span class="cm"># calls ssh_connect + run_command + save</span>
    ...
<span class="kw">def</span> <span class="fn">check_compliance</span>(device):   <span class="cm"># calls get_interfaces + validate</span>
    ...

<span class="cm"># ─── Layer 3: Main orchestration ────────────────</span>
<span class="kw">for</span> device <span class="kw">in</span> devices:
    <span class="kw">if</span> <span class="fn">ping</span>(device[<span class="st">"ip"</span>]):
        <span class="fn">backup_config</span>(device)
        <span class="fn">check_compliance</span>(device)</pre></div>
</script>

<script type="text/x-tmpl" id="m8-practical">
<h3>Building Your EVE-NG Automation Toolkit</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">eve_automation_toolkit.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> subprocess, yaml, json, os
<span class="kw">from</span> datetime <span class="kw">import</span> datetime
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="cm"># ─── Layer 1: Primitives ────────────────────────</span>
<span class="kw">def</span> <span class="fn">ping</span>(ip: str) -> bool:
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="st">"1"</span>,ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">ssh_run</span>(device: dict, command: str) -> dict:
    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>],<span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],<span class="st">"timeout"</span>:<span class="nm">10</span>}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>,<span class="st">"output"</span>:net.<span class="fn">send_command</span>(command),<span class="st">"error"</span>:<span class="kw">None</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>,<span class="st">"output"</span>:<span class="kw">None</span>,<span class="st">"error"</span>:<span class="fn">str</span>(e)}

<span class="cm"># ─── Layer 2: Device operations ─────────────────</span>
<span class="kw">def</span> <span class="fn">collect_device_info</span>(device: dict) -> dict:
    <span class="st">"""Collect show version and interface brief from one device."""</span>
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">if not</span> <span class="fn">ping</span>(device[<span class="st">"ip"</span>]):
        <span class="kw">return</span> {<span class="st">"hostname"</span>:name,<span class="st">"ok"</span>:<span class="kw">False</span>,<span class="st">"error"</span>:<span class="st">"unreachable"</span>}

    ver  = <span class="fn">ssh_run</span>(device, <span class="st">"show version"</span>)
    intf = <span class="fn">ssh_run</span>(device, <span class="st">"show ip interface brief"</span>)
    <span class="kw">return</span> {
        <span class="st">"hostname"</span>   : name,
        <span class="st">"ip"</span>         : device[<span class="st">"ip"</span>],
        <span class="st">"ok"</span>         : ver[<span class="st">"ok"</span>] <span class="kw">and</span> intf[<span class="st">"ok"</span>],
        <span class="st">"version"</span>    : ver[<span class="st">"output"</span>],
        <span class="st">"interfaces"</span> : intf[<span class="st">"output"</span>],
        <span class="st">"error"</span>      : ver[<span class="st">"error"</span>] <span class="kw">or</span> intf[<span class="st">"error"</span>]
    }

<span class="cm"># ─── Layer 3: Main orchestration ────────────────</span>
<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

results = [<span class="fn">collect_device_info</span>(d) <span class="kw">for</span> d <span class="kw">in</span> devices]

ok   = [r <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if</span> r[<span class="st">"ok"</span>]]
fail = [r <span class="kw">for</span> r <span class="kw">in</span> results <span class="kw">if not</span> r[<span class="st">"ok"</span>]]
<span class="fn">print</span>(f<span class="st">"Done: {len(ok)} OK | {len(fail)} failed"</span>)

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"audit.json"</span>,<span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(results,f,indent=<span class="nm">2</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m8-flow">
<h3>Three-Layer Function Architecture</h3>
<div class="fb">
  <div class="fr"><div class="fn2 f" style="width:100%;text-align:center">Layer 3 — Main script (orchestration)</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 y" style="width:100%;text-align:center">Layer 2 — Device operations (collect_device_info, backup_config)</div></div>
  <div style="height:5px"></div>
  <div class="fr"><div class="fn2 b" style="width:100%;text-align:center">Layer 1 — Primitives (ping, ssh_run, load_file, save_json)</div></div>
  <div style="height:8px"></div>
  <p style="color:var(--mut);font-size:12px">Each layer only calls the layer directly below it. The main script never does SSH directly — it calls collect_device_info. collect_device_info calls ssh_run. ssh_run handles the raw connection.</p>
</div>
</script>

<script type="text/x-tmpl" id="m8-practice">
<h3>Practice &amp; Solutions</h3>

<script type="text/x-tmpl" id="m9-theory">
<h3>Reusable Function Libraries — Your Personal Toolkit</h3>
<p>Once you have several useful network functions, you should move them into a separate Python file — a module — that you import into any script that needs them. This is how you build a personal automation toolkit that grows with every script you write.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">net_toolkit.py — your reusable library</span></div><pre><span class="st">"""
net_toolkit.py — Network Automation Toolkit
================================================
Personal library of reusable network functions.
Usage: from net_toolkit import ping, ssh_run, load_inventory
"""</span>
<span class="kw">import</span> subprocess, yaml, json
<span class="kw">from</span> datetime <span class="kw">import</span> datetime

<span class="kw">def</span> <span class="fn">ping</span>(ip: str, timeout: int = <span class="nm">1</span>) -> bool:
    <span class="st">"""True if device responds to ping."""</span>
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">load_inventory</span>(path: str = <span class="st">"eve_inventory.yaml"</span>) -> dict:
    <span class="st">"""Load device inventory from YAML. Returns empty dict on error."""</span>
    <span class="kw">try</span>:
        <span class="kw">with</span> <span class="fn">open</span>(path) <span class="kw">as</span> f: <span class="kw">return</span> yaml.<span class="fn">safe_load</span>(f)
    <span class="kw">except</span> Exception: <span class="kw">return</span> {}

<span class="kw">def</span> <span class="fn">save_json</span>(data, path: str) -> None:
    <span class="st">"""Save data as formatted JSON file."""</span>
    <span class="kw">with</span> <span class="fn">open</span>(path, <span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(data, f, indent=<span class="nm">2</span>)
    <span class="fn">print</span>(f<span class="st">"Saved: {path}"</span>)

<span class="kw">def</span> <span class="fn">timestamp</span>() -> str:
    <span class="st">"""Return current timestamp string for filenames."""</span>
    <span class="kw">return</span> datetime.<span class="fn">now</span>().<span class="fn">strftime</span>(<span class="st">"%Y%m%d_%H%M%S"</span>)</pre></div>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">my_script.py — importing and using the toolkit</span></div><pre><span class="kw">from</span> net_toolkit <span class="kw">import</span> ping, load_inventory, save_json, timestamp

inventory = <span class="fn">load_inventory</span>()
results   = []

<span class="kw">for</span> d <span class="kw">in</span> inventory[<span class="st">"devices"</span>]:
    up = <span class="fn">ping</span>(d[<span class="st">"ip"</span>])
    results.<span class="fn">append</span>({<span class="st">"hostname"</span>:d[<span class="st">"hostname"</span>],<span class="st">"up"</span>:up})

<span class="fn">save_json</span>(results, f<span class="st">"report_{timestamp()}.json"</span>)</pre></div>
</script>

<script type="text/x-tmpl" id="m9-industry">
<h3>Team Function Libraries in Production</h3>
<p>Enterprise network automation teams maintain shared internal Python packages — a common toolkit imported by all automation scripts. When someone writes a better <code>connect_device()</code> function, everyone benefits from the update immediately.</p>
<div class="note g"><p><strong>Naming convention:</strong> Name your library file something descriptive: <code>net_toolkit.py</code>, <code>cisco_helpers.py</code>, <code>eve_utils.py</code>. Keep it in the same folder as your scripts or add it to your Python path.</p></div>
</script>

<script type="text/x-tmpl" id="m9-practical">
<h3>Building Your EVE-NG Toolkit File</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">eve_utils.py — your personal toolkit</span><span class="etag">EVE-NG</span></div><pre><span class="st">"""eve_utils.py — EVE-NG Lab Automation Utilities"""</span>
<span class="kw">import</span> subprocess, yaml, json, os
<span class="kw">from</span> datetime <span class="kw">import</span> datetime
<span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="kw">def</span> <span class="fn">ping</span>(ip, timeout=<span class="nm">1</span>):
    r = subprocess.<span class="fn">run</span>([<span class="st">"ping"</span>,<span class="st">"-c"</span>,<span class="st">"1"</span>,<span class="st">"-W"</span>,<span class="fn">str</span>(timeout),ip],capture_output=<span class="kw">True</span>)
    <span class="kw">return</span> r.returncode == <span class="nm">0</span>

<span class="kw">def</span> <span class="fn">load_lab</span>(path=<span class="st">"eve_inventory.yaml"</span>):
    <span class="kw">with</span> <span class="fn">open</span>(path) <span class="kw">as</span> f: <span class="kw">return</span> yaml.<span class="fn">safe_load</span>(f)

<span class="kw">def</span> <span class="fn">ssh_cmd</span>(device, command):
    <span class="kw">try</span>:
        conn = {<span class="st">"device_type"</span>:device[<span class="st">"platform"</span>],<span class="st">"host"</span>:device[<span class="st">"ip"</span>],
                <span class="st">"username"</span>:device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
                <span class="st">"password"</span>:device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],<span class="st">"timeout"</span>:<span class="nm">10</span>}
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            <span class="kw">return</span> net.<span class="fn">send_command</span>(command)
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="fn">print</span>(f<span class="st">"  [ERR] {device['hostname']}: {e}"</span>)
        <span class="kw">return</span> <span class="kw">None</span>

<span class="kw">def</span> <span class="fn">save_report</span>(data, name=<span class="st">"report"</span>):
    ts   = datetime.<span class="fn">now</span>().<span class="fn">strftime</span>(<span class="st">"%Y%m%d_%H%M"</span>)
    path = f<span class="st">"{name}_{ts}.json"</span>
    <span class="kw">with</span> <span class="fn">open</span>(path,<span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(data,f,indent=<span class="nm">2</span>)
    <span class="fn">print</span>(f<span class="st">"Saved: {path}"</span>)
    <span class="kw">return</span> path

<span class="kw">def</span> <span class="fn">ready_devices</span>(lab):
    <span class="st">"""Return only devices that respond to ping."""</span>
    <span class="kw">return</span> [d <span class="kw">for</span> d <span class="kw">in</span> lab[<span class="st">"devices"</span>] <span class="kw">if</span> <span class="fn">ping</span>(d[<span class="st">"ip"</span>])]</pre></div>
</script>

<script type="text/x-tmpl" id="m10-theory">
<h3>Functions with Netmiko — Building SSH Wrappers</h3>
<p>Writing a wrapper function around Netmiko connection logic is one of the most practical things you can do. You write the connection boilerplate once, wrap it in a clean function, and never think about it again.</p>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">netmiko_wrappers.py</span></div><pre><span class="kw">from</span> netmiko <span class="kw">import</span> ConnectHandler

<span class="kw">def</span> <span class="fn">run_commands</span>(device: dict, commands: list) -> dict:
    <span class="st">"""Run multiple show commands on a device via SSH.

    Args:
        device  : Device dict from inventory (hostname, ip, platform, credentials).
        commands: List of CLI commands to run.

    Returns:
        Dict mapping command → output, plus 'ok' and 'error' keys.
    """</span>
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">try</span>:
        conn = {
            <span class="st">"device_type"</span>: device[<span class="st">"platform"</span>],
            <span class="st">"host"</span>       : device[<span class="st">"ip"</span>],
            <span class="st">"username"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
            <span class="st">"password"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],
            <span class="st">"timeout"</span>    : <span class="nm">15</span>,
        }
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            outputs = {cmd: net.<span class="fn">send_command</span>(cmd) <span class="kw">for</span> cmd <span class="kw">in</span> commands}
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>, <span class="st">"device"</span>:name, <span class="st">"outputs"</span>:outputs, <span class="st">"error"</span>:<span class="kw">None</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"device"</span>:name, <span class="st">"outputs"</span>:{}, <span class="st">"error"</span>:<span class="fn">str</span>(e)}

<span class="kw">def</span> <span class="fn">push_config</span>(device: dict, config_lines: list) -> dict:
    <span class="st">"""Push a list of config commands to a device and save."""</span>
    name = device[<span class="st">"hostname"</span>]
    <span class="kw">try</span>:
        conn = {
            <span class="st">"device_type"</span>: device[<span class="st">"platform"</span>],
            <span class="st">"host"</span>       : device[<span class="st">"ip"</span>],
            <span class="st">"username"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"username"</span>],
            <span class="st">"password"</span>   : device[<span class="st">"credentials"</span>][<span class="st">"password"</span>],
        }
        <span class="kw">with</span> <span class="fn">ConnectHandler</span>(**conn) <span class="kw">as</span> net:
            net.<span class="fn">send_config_set</span>(config_lines)
            net.<span class="fn">save_config</span>()
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">True</span>, <span class="st">"device"</span>:name, <span class="st">"lines_pushed"</span>:<span class="fn">len</span>(config_lines), <span class="st">"error"</span>:<span class="kw">None</span>}
    <span class="kw">except</span> Exception <span class="kw">as</span> e:
        <span class="kw">return</span> {<span class="st">"ok"</span>:<span class="kw">False</span>, <span class="st">"device"</span>:name, <span class="st">"lines_pushed"</span>:<span class="nm">0</span>, <span class="st">"error"</span>:<span class="fn">str</span>(e)}</pre></div>
</script>

<script type="text/x-tmpl" id="m10-industry">
<h3>SSH Wrapper Functions in Production</h3>
<p>These wrapper functions are the core of any Netmiko-based automation toolkit. Once written and tested, you never touch the SSH connection logic again — you just call <code>run_commands(device, ["show version"])</code> from anywhere.</p>
<div class="eve-box"><div class="eve-hdr">🖥️ EVE-NG Lab — Using Your Wrappers</div><p>With these wrapper functions, your EVE-NG lab scripts become 5-line scripts that just call the functions. All the SSH complexity is hidden. You focus on what commands to run, not how to connect.</p></div>
</script>

<script type="text/x-tmpl" id="m10-practical">
<h3>Using SSH Wrapper Functions on EVE-NG</h3>
<div class="cb"><div class="ch"><span class="lg py">Python</span><span class="fn">collect_lab_data.py</span><span class="etag">EVE-NG</span></div><pre><span class="kw">import</span> yaml, json
<span class="kw">from</span> netmiko_wrappers <span class="kw">import</span> run_commands, push_config

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"eve_inventory.yaml"</span>) <span class="kw">as</span> f:
    devices = yaml.<span class="fn">safe_load</span>(f)[<span class="st">"devices"</span>]

SHOW_CMDS = [<span class="st">"show version"</span>, <span class="st">"show ip interface brief"</span>, <span class="st">"show ip route"</span>]

results   = []
success   = []
failed    = []

<span class="kw">for</span> num, device <span class="kw">in</span> <span class="fn">enumerate</span>(devices, start=<span class="nm">1</span>):
    name = device[<span class="st">"hostname"</span>]
    <span class="fn">print</span>(f<span class="st">"[{num}/{len(devices)}] {name}..."</span>, end=<span class="st">" "</span>)

    result = <span class="fn">run_commands</span>(device, SHOW_CMDS)

    <span class="kw">if</span> result[<span class="st">"ok"</span>]:
        <span class="fn">print</span>(<span class="st">"OK"</span>)
        success.<span class="fn">append</span>(name)
        results.<span class="fn">append</span>({<span class="st">"hostname"</span>:name, <span class="st">"outputs"</span>:result[<span class="st">"outputs"</span>]})
    <span class="kw">else</span>:
        <span class="fn">print</span>(f<span class="st">"FAILED: {result['error']}"</span>)
        failed.<span class="fn">append</span>(name)

<span class="fn">print</span>(f<span class="st">"\n{len(success)} OK | {len(failed)} failed"</span>)
<span class="kw">if</span> failed: <span class="fn">print</span>(<span class="st">"Failed:"</span>, failed)

<span class="kw">with</span> <span class="fn">open</span>(<span class="st">"lab_data.json"</span>,<span class="st">"w"</span>) <span class="kw">as</span> f: json.<span class="fn">dump</span>(results,f,indent=<span class="nm">2</span>)</pre></div>
</script>
