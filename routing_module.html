<script type="text/x-tmpl" id="m4-theory">
<h3>OSPF Single Area — Complete Deep Dive</h3>
<p>OSPF (Open Shortest Path First) is a link-state routing protocol. Every router builds a complete map of the topology (LSDB) and runs Dijkstra's SPF algorithm to find the shortest path to every destination. No routing loops by design — every router has the same map.</p>
<h4>OSPF vs RIP — Why OSPF Wins</h4>
<table class="tbl"><thead><tr><th>Feature</th><th>RIP</th><th>OSPF</th></tr></thead><tbody>
<tr><td>Type</td><td>Distance-vector</td><td>Link-state</td></tr>
<tr><td>Algorithm</td><td>Bellman-Ford</td><td>Dijkstra SPF</td></tr>
<tr><td>Metric</td><td>Hop count (max 15)</td><td>Cost (based on bandwidth)</td></tr>
<tr><td>Convergence</td><td>Slow (30s updates)</td><td>Fast (event-driven)</td></tr>
<tr><td>Scalability</td><td>Very limited</td><td>Scales to large networks (with areas)</td></tr>
<tr><td>VLSM/CIDR</td><td>RIPv2 only</td><td>Always supported</td></tr>
<tr><td>Authentication</td><td>RIPv2 only</td><td>Built-in</td></tr>
</tbody></table>
<h4>OSPF Hello Packet and Neighbour Discovery</h4>
<p>OSPF routers send Hello packets at regular intervals to discover and maintain neighbours. Hellos are sent to <strong>224.0.0.5</strong> (all OSPF routers multicast). A neighbour relationship only forms when the Hello parameters match on both sides.</p>
<div class="chips">
  <span class="chip b">Router ID</span>
  <span class="chip g">Hello Interval</span>
  <span class="chip g">Dead Interval</span>
  <span class="chip y">Area ID — must match</span>
  <span class="chip y">Subnet — must be same</span>
  <span class="chip r">Authentication</span>
  <span class="chip r">Stub flag</span>
  <span class="chip p">MTU — for full adjacency</span>
</div>
<p>Items in <span style="color:var(--yel)">yellow</span> MUST match. Items in <span style="color:var(--red)">red</span> must match if configured. MTU mismatch causes stuck at Exchange/Loading state.</p>
<h4>OSPF Neighbour States — The 8 Steps</h4>
<div class="cb"><div class="ch"><span class="lg out">States</span><span class="fn">OSPF adjacency formation — every step explained</span></div><pre><span class="kw">1. Down</span>      No Hello received. Waiting.

<span class="kw">2. Attempt</span>   (NBMA only) Unicast Hello sent to manually configured neighbour.
             No reply yet.

<span class="kw">3. Init</span>      Received a Hello from neighbour — but MY Router ID
             is not in their Hello. One-way communication.

<span class="kw">4. 2-Way</span>     Both routers see each other in Hellos.
             Bidirectional confirmed. <span class="hl">DR/BDR election happens here.</span>
             DROthers STOP HERE with each other — 2-Way is normal!

<span class="kw">5. ExStart</span>   Beginning LSDB exchange. Master/Slave negotiation.
             Higher Router ID becomes Master. DBD sequence numbers set.

<span class="kw">6. Exchange</span>  Exchanging DBD packets (Database Description).
             Contains LSA headers — just the index, not full LSAs.

<span class="kw">7. Loading</span>   Requesting full LSAs missing from local LSDB.
             Sends LSR (Link State Request).
             Receives LSU (Link State Update) containing LSAs.

<span class="st">8. Full</span>      LSDB fully synchronised. Adjacency complete. <span class="hl">← GOAL STATE</span>
             Only DR and BDR form Full with all other routers.
             DROthers form Full only with DR and BDR.</pre></div>
<h4>DR/BDR Election — Why It Exists and How It Works</h4>
<p>On a broadcast segment (Ethernet with multiple routers), without DR/BDR, N routers would form N×(N-1)/2 adjacencies and flood LSAs to each other — O(n²) traffic. The DR solves this by becoming a central redistribution point for LSAs.</p>
<div class="g2">
  <div class="card"><h5>DR (Designated Router)</h5><p>Elected on each broadcast segment. All routers form Full adjacency with DR. Receives LSAs from all routers, then floods to all. Multicast: <strong>224.0.0.6</strong> (AllDRouters — only DR and BDR listen).</p></div>
  <div class="card y"><h5>BDR (Backup DR)</h5><p>Hot standby for DR. Monitors DR. If DR fails, BDR immediately takes over without re-election. Also receives all LSAs. DROthers ignore each other's LSAs until DR/BDR fail.</p></div>
</div>
<div class="cb"><div class="ch"><span class="lg out">Election</span><span class="fn">DR/BDR election rules — step by step</span></div><pre><span class="hl">Step 1: Wait 40 seconds</span> (Dead interval) for all routers to send Hellos

<span class="hl">Step 2: Highest OSPF Priority wins DR</span>
         Default priority = 1 on all Cisco routers
         Priority 0 = never become DR or BDR (ineligible)
         Range: 0-255

<span class="hl">Step 3: Tie? → Highest Router ID wins</span>
         RID = manually configured → highest Loopback IP → highest active interface IP

<span class="hl">Key rule: Election is NON-PREEMPTIVE</span>
         Once elected, DR keeps the role even if a higher-priority router joins later.
         To force re-election: <span class="cmd">clear ip ospf process</span> on ALL routers in segment.

<span class="hl">Multicast addresses:</span>
         224.0.0.5 = AllSPFRouters — all OSPF routers (Hellos, DBD, LSR, LSU)
         224.0.0.6 = AllDRouters  — only DR and BDR listen</pre></div>
<h4>OSPF Network Types</h4>
<table class="tbl"><thead><tr><th>Network Type</th><th>DR/BDR?</th><th>Hello/Dead Timers</th><th>Default On</th></tr></thead><tbody>
<tr><td><strong>Broadcast</strong></td><td>Yes</td><td>10s / 40s</td><td>Ethernet, Token Ring</td></tr>
<tr><td><strong>Point-to-Point</strong></td><td>No</td><td>10s / 40s</td><td>Serial (HDLC, PPP)</td></tr>
<tr><td><strong>NBMA</strong></td><td>Yes</td><td>30s / 120s</td><td>Frame Relay (multipoint)</td></tr>
<tr><td><strong>Point-to-Multipoint</strong></td><td>No</td><td>30s / 120s</td><td>None (manually set)</td></tr>
<tr><td><strong>Point-to-Multipoint NB</strong></td><td>No</td><td>30s / 120s</td><td>None (manually set)</td></tr>
<tr><td><strong>Loopback</strong></td><td>No</td><td>N/A</td><td>Loopback interfaces</td></tr>
</tbody></table>
<h4>OSPF Cost Calculation</h4>
<p>Cost = Reference bandwidth / Interface bandwidth. Default reference = 100 Mbps.</p>
<div class="g3">
  <div class="card"><h5>Default Cost Values</h5><p>10 Mbps = <strong>10</strong><br>100 Mbps (FastE) = <strong>1</strong><br>1000 Mbps (GigE) = <strong>1</strong><br>10 Gbps = <strong>1</strong> (bug!)</p></div>
  <div class="card y"><h5>Fix: Reference BW</h5><p>Set <code>auto-cost reference-bandwidth 10000</code> (10G) on ALL routers. Now: 1G=10, 100M=100, 10G=1. Consistent differences.</p></div>
  <div class="card g"><h5>Override Per Interface</h5><p><code>ip ospf cost [1-65535]</code> on interface. Overrides auto-cost. Direct control. Use to influence path selection.</p></div>
</div>
<h4>OSPF Authentication</h4>
<p>OSPF supports three authentication types per area or per interface:</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">OSPF MD5 authentication — per interface (recommended)</span></div><pre><span class="cm">! Per-interface MD5 authentication (most common method)</span>
R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">ip ospf authentication message-digest</span>
R1(config-if)# <span class="cmd">ip ospf message-digest-key 1 md5 OSPF-Secret123</span>
<span class="cm">! Key number (1) and key string must match on both sides</span>

<span class="cm">! Area-wide authentication (alternative)</span>
R1(config)# <span class="cmd">router ospf 1</span>
R1(config-router)# <span class="cmd">area 0 authentication message-digest</span>
<span class="cm">! Then still need the key on each interface</span>
<span class="cm">! Mismatch = routers stay in Init state, no adjacency</span></pre></div>
</script>

<script type="text/x-tmpl" id="m4-lab">
<h3>Lab 4 — OSPF Single Area with DR/BDR Observation</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">OSPF Single Area — Area 0</span><span class="tbadge ccna">CCNA</span></div><div class="topo-body">                     <span class="lb">Area 0 — LAN Segment (Ethernet)</span>
  <span class="r">[ R1 ]</span>-----------<span class="ip">10.0.0.0/24 (shared Ethernet)</span>-----------<span class="r">[ R3 ]</span>
    <span class="ln">|</span>  <span class="ip">10.0.0.1</span>              <span class="r">[ R2 ]</span>              <span class="ip">10.0.0.3</span>    <span class="ln">|</span>
 <span class="ip">Lo0:1.1.1.1</span>            <span class="ip">10.0.0.2 Lo0:2.2.2.2</span>              <span class="ip">Lo0:3.3.3.3</span>
 <span class="ip">LAN:192.168.1.0/24</span>                                  <span class="ip">LAN:192.168.3.0/24</span>
    <span class="pc">[PC-A]</span>                                                <span class="pc">[PC-C]</span>

<span class="lb">Priorities: R1=50, R2=100 (will become DR), R3=default=1</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Configure OSPF with Manual Router ID and Priority</span><span class="step-sub">R1, R2, R3</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R1, R2, R3 OSPF configuration</span></div><pre><span class="cm">! R1 — priority 50 (will become BDR)</span>
R1(config)# <span class="cmd">interface loopback 0</span>
R1(config-if)# <span class="cmd">ip address 1.1.1.1 255.255.255.255</span>
R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">ip address 10.0.0.1 255.255.255.0</span>
R1(config-if)# <span class="cmd">ip ospf priority 50</span>        <span class="cm">! Set priority for DR election</span>
R1(config-if)# <span class="cmd">no shutdown</span>
R1(config)# <span class="cmd">router ospf 1</span>
R1(config-router)# <span class="cmd">router-id 1.1.1.1</span>      <span class="cm">! Always set manually — best practice</span>
R1(config-router)# <span class="cmd">network 10.0.0.0 0.0.0.255 area 0</span>
R1(config-router)# <span class="cmd">network 1.1.1.1 0.0.0.0 area 0</span>
R1(config-router)# <span class="cmd">auto-cost reference-bandwidth 10000</span>  <span class="cm">! Set on ALL routers</span>

<span class="cm">! R2 — priority 100 (will become DR)</span>
R2(config-if)# <span class="cmd">ip ospf priority 100</span>
R2(config)# <span class="cmd">router ospf 1</span>
R2(config-router)# <span class="cmd">router-id 2.2.2.2</span>
R2(config-router)# <span class="cmd">network 10.0.0.0 0.0.0.255 area 0</span>
R2(config-router)# <span class="cmd">auto-cost reference-bandwidth 10000</span>

<span class="cm">! R3 — default priority 1 (DROther)</span>
R3(config)# <span class="cmd">router ospf 1</span>
R3(config-router)# <span class="cmd">router-id 3.3.3.3</span>
R3(config-router)# <span class="cmd">network 10.0.0.0 0.0.0.255 area 0</span>
R3(config-router)# <span class="cmd">auto-cost reference-bandwidth 10000</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Verify DR/BDR Election and Neighbour States</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Verify DR/BDR and neighbour adjacency states</span></div><pre>R1# <span class="cmd">show ip ospf neighbor</span>
<span class="cm">! Output format: Neighbor ID / Pri / State / Dead Time / Address / Interface</span>
<span class="cm">! R2 (2.2.2.2) should show: FULL/DR   — R2 is DR, R1 is Full with it</span>
<span class="cm">! R3 (3.3.3.3) should show: FULL/BDR  — R3 is... wait, R1 priority is 50</span>
<span class="cm">! Actually: R2=DR (priority 100), R1=BDR (priority 50), R3=DROther (priority 1)</span>
<span class="cm">! R3 shows: 2-WAY/DROTHER toward R1 and R3 (DROther-to-DROther = 2-Way)</span>

R2# <span class="cmd">show ip ospf neighbor</span>
<span class="cm">! R2 (DR) shows FULL with BOTH R1 and R3 — DR forms Full with everyone</span>

R1# <span class="cmd">show ip ospf interface gi0/0</span>
<span class="cm">! Key output to check:</span>
<span class="cm">! Network Type: BROADCAST</span>
<span class="cm">! Cost: X (based on auto-cost)</span>
<span class="cm">! State: BDR    ← This router is BDR</span>
<span class="cm">! Designated Router: 10.0.0.2 (ID 2.2.2.2)   ← R2 is DR</span>
<span class="cm">! Backup Designated Router: 10.0.0.1 (ID 1.1.1.1) ← R1 is BDR</span>
<span class="cm">! Hello timer: 10 sec  Dead timer: 40 sec</span>
<span class="cm">! Adjacent neighbor count: 2</span>

R1# <span class="cmd">show ip ospf database</span>
<span class="cm">! Shows the LSDB — all routers in area should have IDENTICAL copy</span>
<span class="cm">! Router LSA (Type 1) — one per router</span>
<span class="cm">! Network LSA (Type 2) — one per broadcast segment from DR</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Observe DR Failure and BDR Promotion</span><span class="step-sub">R2, R1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Fail the DR — watch BDR take over immediately</span></div><pre><span class="cm">! Shut down R2 (the DR) interface</span>
R2(config)# <span class="cmd">interface gi0/0</span>
R2(config-if)# <span class="cmd">shutdown</span>

<span class="cm">! R1 (BDR) detects DR failure within Dead timer (40s)</span>
<span class="cm">! BDR immediately becomes DR — no new election needed</span>
<span class="cm">! R3 becomes the new BDR (next highest priority/RID)</span>

R1# <span class="cmd">show ip ospf interface gi0/0</span>
<span class="cm">! State should now show: DR   (R1 promoted from BDR to DR)</span>

R1# <span class="cmd">show ip ospf neighbor</span>
<span class="cm">! R3 now shows FULL/BDR</span>

<span class="cm">! Bring R2 back — it will NOT regain DR (non-preemptive)</span>
R2(config-if)# <span class="cmd">no shutdown</span>
R2# <span class="cmd">show ip ospf interface gi0/0</span>
<span class="cm">! R2 comes back as DROTHER despite having priority 100!</span>
<span class="cm">! To force R2 back as DR: clear ip ospf process on ALL routers</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">4</span><span class="step-title">Configure and Verify OSPF Authentication</span><span class="step-sub">R1, R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">MD5 authentication on the shared segment</span></div><pre><span class="cm">! Configure on R1</span>
R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">ip ospf authentication message-digest</span>
R1(config-if)# <span class="cmd">ip ospf message-digest-key 1 md5 OSPF$ecret</span>

<span class="cm">! Configure identical on R2</span>
R2(config)# <span class="cmd">interface gi0/0</span>
R2(config-if)# <span class="cmd">ip ospf authentication message-digest</span>
R2(config-if)# <span class="cmd">ip ospf message-digest-key 1 md5 OSPF$ecret</span>

<span class="cm">! Miss-spell key on R3 to observe failure</span>
R3(config-if)# <span class="cmd">ip ospf message-digest-key 1 md5 WRONG_KEY</span>

R1# <span class="cmd">show ip ospf neighbor</span>
<span class="cm">! R3 disappears from neighbor table — authentication failed</span>
<span class="cm">! Adjacency drops = routes from R3 disappear</span>

R1# <span class="cmd">debug ip ospf adj</span>
<span class="cm">! Shows: "Authentication error" for R3's Hellos</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m4-interview">
<h3>Interview Questions — OSPF Single Area</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Explain DR/BDR election in detail. What is the election process, what addresses are used, and what is the role of each?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Why it exists:</strong> On a broadcast segment, without DR/BDR, N routers would form N(N-1)/2 full adjacencies. 10 routers = 45 adjacencies. DR reduces this to N-1 adjacencies plus DR/BDR maintain Full with all routers.</p><p><strong>Election process:</strong> After Dead timer expires (40s default), routers elect:<br>1. Highest OSPF priority (0-255, default 1) → becomes DR<br>2. If tie → highest Router ID → becomes DR<br>3. Second highest priority → becomes BDR<br>Priority 0 = ineligible (never DR or BDR)</p><p><strong>Multicast addresses:</strong><br>• 224.0.0.5 (AllSPFRouters) — all OSPF routers receive from here. Used for Hellos from DROthers.<br>• 224.0.0.6 (AllDRouters) — only DR and BDR receive from here. DROthers send LSA updates to 224.0.0.6; DR then floods to 224.0.0.5.</p><p><strong>Non-preemptive:</strong> Once elected, DR keeps role even if higher-priority router joins. Prevents constant re-elections. To force re-election: <code>clear ip ospf process</code> on all routers simultaneously.</p><p><strong>2-Way state:</strong> DROthers maintain only 2-Way adjacency with each other — not Full. This is correct and expected behaviour. DROthers form Full only with DR and BDR.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What OSPF neighbour parameters must match for adjacency to form?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>These must match on both sides of the link:</p><ul><li><strong>Area ID</strong> — both interfaces must be in the same OSPF area</li><li><strong>Hello interval</strong> — default 10s on broadcast, 30s on NBMA. Can be changed but must match</li><li><strong>Dead interval</strong> — default 4× Hello. Must match</li><li><strong>Subnet</strong> — both interfaces must be on the same subnet with the same mask</li><li><strong>Authentication</strong> — type and key must match if configured</li><li><strong>Stub area flag</strong> — if one side has area configured as stub, other must too</li><li><strong>MTU</strong> — mismatch causes stuck at Exchange/Loading (DBD won't complete). Verify with <code>show ip ospf interface</code> — compare MTU values. Fix: <code>ip ospf mtu-ignore</code> (workaround) or fix actual MTU mismatch</li></ul></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Two OSPF routers are directly connected. "show ip ospf neighbor" shows R2 in EXSTART/EXCHANGE state for several minutes without reaching FULL. What is happening?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Stuck in ExStart/Exchange is almost always an <strong>MTU mismatch</strong>. Here's why:</p><p>In ExStart, routers negotiate Master/Slave and begin sending DBD (Database Description) packets. DBD packets may be larger than the path MTU. If the MTU doesn't match, one side sees oversized packets and won't acknowledge them — the exchange stalls.</p><p><strong>Diagnose:</strong><br><code>show ip ospf interface [int]</code> on both sides → compare MTU values<br><code>debug ip ospf adj</code> → will show sequence number issues in DBD exchange</p><p><strong>Fix option 1 (proper):</strong> Make MTUs match on both interfaces.<br><strong>Fix option 2 (workaround):</strong> Apply <code>ip ospf mtu-ignore</code> on one or both interfaces — tells OSPF to ignore MTU when comparing DBD packets. The adjacency will form but large packets may still be dropped in production.</p><p><strong>Other less common causes:</strong> Duplicate Router IDs (both routers claim same RID), or corrupted neighbour database (try <code>clear ip ospf process</code>).</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">You want R1 to always be the DR on a segment. You set its OSPF priority to 255. After a reload, R2 becomes the DR instead. Why?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>This is the <strong>non-preemptive</strong> nature of DR election. If R2 came up before R1 (which happens after a reload if R2 rebooted faster), R2 won the election when it was the only router present. When R1 came up with priority 255, R2 was already DR. OSPF doesn't re-run the election just because a higher-priority router appeared.</p><p><strong>The only ways to force R1 to be DR:</strong><br>1. <code>clear ip ospf process</code> on all routers simultaneously (disruptive — clears all adjacencies and routes)<br>2. Control startup order — ensure R1 (priority 255) starts before all other routers on that segment<br>3. Set all other routers' priority to 0 (ineligible) — then only R1 can be DR</p><p><strong>Best practice:</strong> Set priority 255 on the intended DR AND set all other routers to priority 0 (if you never want them as DR). This guarantees your router always wins regardless of startup order.</p></div></div>
</script>
<!-- ══════════════════ TOPIC 5: OSPF MULTI-AREA ══════════════════ -->
<script type="text/x-tmpl" id="m5-theory">
<h3>OSPF Multi-Area — LSA Types and Area Design</h3>
<p>A single OSPF area with hundreds of routers creates huge LSDBs and constant SPF calculations. Multi-area OSPF divides the topology into smaller areas, each with its own LSDB. Area 0 (backbone) is mandatory and all other areas must connect to it.</p>
<h4>OSPF Router Types</h4>
<table class="tbl"><thead><tr><th>Type</th><th>Definition</th><th>Function</th></tr></thead><tbody>
<tr><td><strong>Internal Router</strong></td><td>All interfaces in one area</td><td>Normal routing within its area</td></tr>
<tr><td><strong>Backbone Router</strong></td><td>At least one interface in Area 0</td><td>Participates in backbone routing</td></tr>
<tr><td><strong>ABR</strong> (Area Border Router)</td><td>Interfaces in 2+ areas, including Area 0</td><td>Generates Type 3 Summary LSAs. Hides intra-area topology from other areas</td></tr>
<tr><td><strong>ASBR</strong> (AS Boundary Router)</td><td>Redistributes external routes into OSPF</td><td>Generates Type 5 External LSAs (Type 7 in NSSA)</td></tr>
</tbody></table>
<h4>OSPF LSA Types — Complete Reference</h4>
<table class="tbl"><thead><tr><th>Type</th><th>Name</th><th>Generated By</th><th>Scope</th><th>Purpose</th></tr></thead><tbody>
<tr><td><strong>1</strong></td><td>Router LSA</td><td>Every router</td><td>Own area only</td><td>Describes router's links and their states. One per router per area.</td></tr>
<tr><td><strong>2</strong></td><td>Network LSA</td><td>DR on broadcast segment</td><td>Own area only</td><td>Represents the multi-access network. Lists all routers attached to segment.</td></tr>
<tr><td><strong>3</strong></td><td>Summary LSA</td><td>ABR</td><td>Backbone + other areas</td><td>Advertises routes from one area into other areas. Type 1/2 don't cross area boundaries — Type 3 does.</td></tr>
<tr><td><strong>4</strong></td><td>ASBR Summary LSA</td><td>ABR</td><td>Backbone + other areas</td><td>Tells other areas where to find the ASBR. Without this, other areas can't reach external routes.</td></tr>
<tr><td><strong>5</strong></td><td>External LSA</td><td>ASBR</td><td>Entire OSPF domain</td><td>External routes redistributed into OSPF. Type E1 (adds internal cost) or E2 (fixed cost). Blocked by stub areas.</td></tr>
<tr><td><strong>6</strong></td><td>Multicast LSA</td><td>—</td><td>—</td><td>Obsolete — used for MOSPF, not implemented in Cisco IOS</td></tr>
<tr><td><strong>7</strong></td><td>NSSA External LSA</td><td>ASBR in NSSA</td><td>NSSA area only</td><td>Like Type 5 but limited to NSSA area. Converted to Type 5 by ABR when leaving the NSSA area.</td></tr>
</tbody></table>
<div class="note y"><p><strong>Key rule:</strong> Type 1 and Type 2 LSAs NEVER leave their originating area. Type 3 LSAs carry inter-area route information. Type 5 LSAs flood the entire OSPF domain (except stub areas).</p></div>
<h4>OSPF Special Area Types</h4>
<table class="tbl"><thead><tr><th>Area Type</th><th>Blocks</th><th>ABR Injects</th><th>Allow ASBR?</th><th>Config</th></tr></thead><tbody>
<tr><td><strong>Normal Area</strong></td><td>Nothing</td><td>Nothing extra</td><td>Yes</td><td>Default</td></tr>
<tr><td><strong>Stub</strong></td><td>Type 5</td><td>Default route (Type 3)</td><td>No</td><td><code>area X stub</code></td></tr>
<tr><td><strong>Totally Stubby</strong></td><td>Type 3, 4, 5</td><td>Default route (Type 3)</td><td>No</td><td><code>area X stub no-summary</code> (ABR only)</td></tr>
<tr><td><strong>NSSA</strong></td><td>Type 5</td><td>Default route (optional)</td><td>Yes (Type 7)</td><td><code>area X nssa</code></td></tr>
<tr><td><strong>Totally NSSA</strong></td><td>Type 3, 4, 5</td><td>Default route (Type 3)</td><td>Yes (Type 7)</td><td><code>area X nssa no-summary</code> (ABR only)</td></tr>
</tbody></table>
<h4>Inter-Area Summarisation on ABR</h4>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">ABR summarises Area 1 routes into Area 0</span></div><pre><span class="cm">! Without summary: Area 0 sees 192.168.0.0/24, 192.168.1.0/24, 192.168.2.0/24, 192.168.3.0/24</span>
<span class="cm">! With summary: Area 0 sees ONE route: 192.168.0.0/22</span>

R-ABR(config)# <span class="cmd">router ospf 1</span>
R-ABR(config-router)# <span class="cmd">area 1 range 192.168.0.0 255.255.252.0</span>
<span class="cm">! "area 1 range" = summarise routes FROM Area 1 when advertising INTO backbone</span>

<span class="cm">! ASBR summarises external routes (Type 5)</span>
R-ASBR(config-router)# <span class="cmd">summary-address 10.0.0.0 255.0.0.0</span></pre></div>
</script>

<script type="text/x-tmpl" id="m5-lab">
<h3>Lab 5 — OSPF Multi-Area with LSA Analysis</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Multi-Area OSPF</span><span class="tbadge ccnp">CCNP</span></div><div class="topo-body">       <span class="lb">Area 1</span>                  <span class="lb">Area 0 (Backbone)</span>               <span class="lb">Area 2</span>
<span class="r">[ R1 ]</span>-<span class="ip">10.1.12.0/30</span>-<span class="r">[ R2/ABR ]</span>-<span class="ip">10.0.23.0/30</span>-<span class="r">[ R3/ABR ]</span>-<span class="ip">10.2.34.0/30</span>-<span class="r">[ R4 ]</span>
<span class="ip">Lo:1.1.1.1</span>        <span class="ip">Lo:2.2.2.2</span>                    <span class="ip">Lo:3.3.3.3</span>            <span class="ip">Lo:4.4.4.4</span>
<span class="ip">192.168.1.0/24</span>                                                      <span class="ip">192.168.4.0/24</span>
<span class="pc">[LAN-1]</span>           <span class="lb">Area 1</span>←→<span class="lb">Area 0</span>            <span class="lb">Area 0</span>←→<span class="lb">Area 2</span>           <span class="pc">[LAN-4]</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Configure Multi-Area OSPF (R1 Area 1, R2 ABR, R3 ABR, R4 Area 2)</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R1 — internal router in Area 1</span></div><pre>R1(config)# <span class="cmd">router ospf 1</span>
R1(config-router)# <span class="cmd">router-id 1.1.1.1</span>
R1(config-router)# <span class="cmd">network 10.1.12.0 0.0.0.3 area 1</span>
R1(config-router)# <span class="cmd">network 192.168.1.0 0.0.0.255 area 1</span>
R1(config-router)# <span class="cmd">network 1.1.1.1 0.0.0.0 area 1</span>
R1(config-router)# <span class="cmd">passive-interface gi0/1</span></pre></div>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R2 — ABR between Area 1 and Area 0</span></div><pre>R2(config)# <span class="cmd">router ospf 1</span>
R2(config-router)# <span class="cmd">router-id 2.2.2.2</span>
<span class="cm">! KEY: Different interfaces in different areas</span>
R2(config-router)# <span class="cmd">network 10.1.12.0 0.0.0.3 area 1</span>   <span class="cm">! Area 1 side</span>
R2(config-router)# <span class="cmd">network 10.0.23.0 0.0.0.3 area 0</span>   <span class="cm">! Area 0 side</span>
R2(config-router)# <span class="cmd">network 2.2.2.2 0.0.0.0 area 0</span>
<span class="cm">! Optional: Summarise Area 1 routes before sending to Area 0</span>
R2(config-router)# <span class="cmd">area 1 range 192.168.1.0 255.255.255.0</span>

<span class="cm">! R3 — ABR between Area 0 and Area 2</span>
R3(config)# <span class="cmd">router ospf 1</span>
R3(config-router)# <span class="cmd">router-id 3.3.3.3</span>
R3(config-router)# <span class="cmd">network 10.0.23.0 0.0.0.3 area 0</span>
R3(config-router)# <span class="cmd">network 10.2.34.0 0.0.0.3 area 2</span>

<span class="cm">! R4 — internal router in Area 2 (configure as totally stubby)</span>
R4(config)# <span class="cmd">router ospf 1</span>
R4(config-router)# <span class="cmd">router-id 4.4.4.4</span>
R4(config-router)# <span class="cmd">network 10.2.34.0 0.0.0.3 area 2</span>
R4(config-router)# <span class="cmd">network 192.168.4.0 0.0.0.255 area 2</span>
R4(config-router)# <span class="cmd">area 2 stub</span>   <span class="cm">! Area 2 = stub (must match ABR)</span>
R3(config-router)# <span class="cmd">area 2 stub no-summary</span>  <span class="cm">! Totally stubby on ABR side</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Analyse LSA Types in the Database</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Detailed LSA type verification</span></div><pre><span class="cm">! On R1 (Area 1) — see its LSDB</span>
R1# <span class="cmd">show ip ospf database</span>
<span class="cm">! Router Link States (Area 1): Type 1 — one per router IN Area 1</span>
<span class="cm">! Net Link States (Area 1): Type 2 — from DR on broadcast segments</span>
<span class="cm">! Summary Net Link States (Area 1): Type 3 from ABR (R2)</span>
<span class="cm">! R1 sees Type 3 summaries from Area 0 — but NOT Area 0's Type 1/2!</span>
<span class="cm">! That's the point of areas — topology isolation</span>

<span class="cm">! On R2 (ABR) — sees BOTH area databases</span>
R2# <span class="cmd">show ip ospf database</span>
<span class="cm">! Area 1 database: Type 1, 2 from Area 1</span>
<span class="cm">! Area 0 database: Type 1, 2 from Area 0</span>
<span class="cm">! Summary LSAs (Type 3): R2 generates these to link areas</span>

<span class="cm">! On R4 (Totally Stubby Area 2)</span>
R4# <span class="cmd">show ip ospf database</span>
<span class="cm">! Very small LSDB: only Type 1, 2 for Area 2 + ONE Type 3 (default route)</span>
<span class="cm">! No Type 3 summaries from other areas, no Type 5 externals</span>

R4# <span class="cmd">show ip route ospf</span>
<span class="cm">! Only one OSPF inter-area route: O*IA 0.0.0.0/0 via R3</span>
<span class="cm">! All traffic to unknown destinations goes via this default</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Redistribute External Route and Observe Type 4 + Type 5</span><span class="step-sub">R1 (as ASBR)</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Make R1 an ASBR — redistribute static route into OSPF</span></div><pre><span class="cm">! R1 has a static route to 172.16.100.0/24 (simulating external network)</span>
R1(config)# <span class="cmd">ip route 172.16.100.0 255.255.255.0 null0</span>

<span class="cm">! Redistribute it into OSPF (R1 becomes ASBR)</span>
R1(config)# <span class="cmd">router ospf 1</span>
R1(config-router)# <span class="cmd">redistribute static subnets</span>

<span class="cm">! Now observe on other routers</span>
R3# <span class="cmd">show ip ospf database</span>
<span class="cm">! Type 4 (ASBR Summary LSA): Generated by ABR R2, tells Area 0 where R1 (ASBR) is</span>
<span class="cm">! Type 5 (External LSA): 172.16.100.0/24 — originated by R1, flooded everywhere</span>
<span class="cm">! Except Area 2 (stub/totally stubby) — Type 5 is blocked at R3 ABR</span>

R4# <span class="cmd">show ip route 172.16.100.0</span>
<span class="cm">! R4 does NOT have this route (totally stubby blocks Type 5)</span>
<span class="cm">! R4 would use its default route to reach 172.16.100.0</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m5-interview">
<h3>Interview Questions — OSPF Multi-Area</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What are all OSPF LSA types and what does each carry? Which ones cross area boundaries?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Type 1 (Router LSA):</strong> Every router generates one. Describes its own links, states (up/down), and costs. Stays within its originating area only.<br><strong>Type 2 (Network LSA):</strong> DR generates one per broadcast segment. Lists all routers attached. Stays within area.<br><strong>Type 3 (Summary LSA):</strong> ABR generates when advertising routes from one area to another. This is how inter-area routes appear as "O IA" in the routing table. Crosses area boundaries.<br><strong>Type 4 (ASBR Summary):</strong> ABR generates to tell other areas where the ASBR is located. Without Type 4, areas couldn't find external routes. Crosses boundaries.<br><strong>Type 5 (External LSA):</strong> ASBR generates for redistributed external routes. Flooded across the entire OSPF domain except stub areas. "OE1" or "OE2" routes in table.<br><strong>Type 7 (NSSA External):</strong> ASBR inside NSSA area generates instead of Type 5. Stays within NSSA. Converted to Type 5 by ABR at area boundary.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between E1 and E2 external routes in OSPF?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Both E1 and E2 are generated by ASBRs for redistributed external routes. The difference is how cost is calculated:<br><br><strong>E2 (Type 2 External — default):</strong> The metric is the external cost only. It does NOT add internal OSPF cost as the route propagates. Every router sees the same metric regardless of how far it is from the ASBR. E2 is preferred when you want predictable, consistent metrics for external routes.<br><br><strong>E1 (Type 1 External):</strong> The metric is the external cost PLUS the internal OSPF cost to reach the ASBR. As the route gets further from the ASBR, the metric increases. E1 reflects actual total cost and is preferred when you have multiple ASBRs redistributing the same external routes — the router closest to the ASBR will prefer E1 routes correctly.<br><br><strong>When E2 vs E1 compete:</strong> E1 is always preferred over E2 for the same prefix (step 8 in OSPF best path).<br><br><strong>Set type during redistribution:</strong> <code>redistribute static metric-type 1</code> for E1, <code>metric-type 2</code> for E2 (default).</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">An area is configured as Stub. Routers inside can reach all inter-area OSPF routes (Type 3) but cannot reach the redistributed external route (172.16.0.0/24) on an ASBR. Why, and what are the options?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Why it fails:</strong> Stub areas block Type 5 External LSAs. The ASBR's Type 5 for 172.16.0.0/24 is stopped at the ABR and not forwarded into the stub area. The ABR only sends a Type 3 default route (0.0.0.0/0) instead. Routers in the stub area should reach 172.16.0.0/24 via this default route.</p><p><strong>If the default route isn't working:</strong> Check that the ABR is actually injecting the default. By default, stub ABR does inject it. Verify: <code>show ip route 0.0.0.0</code> on the stub router — is there an O IA entry?</p><p><strong>Options if you need direct access to external routes:</strong><br>1. <strong>Change to normal area</strong> — receives all LSA types including Type 5. Larger LSDB but full visibility.<br>2. <strong>Change to NSSA</strong> — if you need to ADD an ASBR inside this area (not just receive external routes from outside). NSSA still blocks incoming Type 5 but allows outgoing Type 7.<br>3. <strong>Use the default route</strong> — the stub's default route 0.0.0.0/0 should route to the ABR which can then reach the external route. Confirm the path works end-to-end with traceroute.</p></div></div>
</script>
<!-- ══════════════════ TOPIC 6: EIGRP ══════════════════ -->
<script type="text/x-tmpl" id="m6-theory">
<h3>EIGRP — Enhanced Interior Gateway Routing Protocol</h3>
<p>EIGRP is Cisco's advanced distance-vector protocol. Unlike OSPF (full topology map), EIGRP only knows what its neighbours tell it. But it runs the DUAL algorithm on that information to guarantee loop-free paths with instant failover to pre-computed backups.</p>
<h4>EIGRP Key Terminology</h4>
<table class="tbl"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>
<tr><td><strong>Successor</strong></td><td>Best path to a destination. Installed in routing table.</td></tr>
<tr><td><strong>Feasible Successor (FS)</strong></td><td>Pre-computed backup path. Loop-free by the Feasibility Condition. Ready for instant failover — no query needed.</td></tr>
<tr><td><strong>Feasible Distance (FD)</strong></td><td>The best metric (total cost) from this router to the destination through the Successor path.</td></tr>
<tr><td><strong>Reported Distance (RD)</strong></td><td>The neighbour's own metric (cost) to the destination. Also called Advertised Distance (AD).</td></tr>
<tr><td><strong>Feasibility Condition</strong></td><td>RD &lt; FD. If a neighbour's reported distance is less than my best distance, using that neighbour won't loop back through me.</td></tr>
<tr><td><strong>Active State</strong></td><td>Route lost, no FS available. Router sends QUERY to all neighbours asking for alternative path.</td></tr>
<tr><td><strong>Passive State</strong></td><td>Normal, stable state. No queries in progress for this prefix.</td></tr>
</tbody></table>
<h4>EIGRP Metric — K-Values</h4>
<p>EIGRP uses a composite metric. By default only <strong>bandwidth</strong> (K1=1) and <strong>delay</strong> (K3=1) are used. K2, K4, K5 = 0 by default (load, reliability, MTU not used).</p>
<div class="cb"><div class="ch"><span class="lg out">Formula</span><span class="fn">EIGRP metric calculation (simplified default)</span></div><pre>Metric = 256 × [ (10^7 / minimum_bandwidth_kbps) + (cumulative_delay / 10) ]

<span class="cm">Example: 100Mbps link (BW=100,000 kbps), delay = 100 microseconds</span>
Metric = 256 × [ (10^7 / 100,000) + (100/10) ]
       = 256 × [ 100 + 10 ]
       = 256 × 110
       = <span class="hl">28,160</span>

<span class="cm">Higher metric = worse path (opposite of OSPF cost)</span>
<span class="cm">Use "show ip eigrp topology" to see FD and RD values</span></pre></div>
<h4>EIGRP Classic vs Named Mode</h4>
<div class="g2">
  <div class="card"><h5>Classic Mode (Legacy)</h5><p>Separate <code>router eigrp [AS]</code> per address family. No address-family concept. All config under one process. Fine for IPv4-only environments. Still works and widely used.</p></div>
  <div class="card p"><h5>Named Mode (CCNP ENCOR)</h5><p>Single <code>router eigrp [name]</code> process. Address-family based (IPv4, IPv6 under same process). More consistent config. Supports additional features: wide metrics, add-paths. Recommended going forward.</p></div>
</div>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Classic vs Named mode comparison</span></div><pre><span class="cm">! Classic Mode</span>
R1(config)# <span class="cmd">router eigrp 100</span>
R1(config-router)# <span class="cmd">network 10.0.0.0 0.0.0.255</span>
R1(config-router)# <span class="cmd">no auto-summary</span>

<span class="cm">! Named Mode (CCNP ENCOR)</span>
R1(config)# <span class="cmd">router eigrp COMPANY-EIGRP</span>
R1(config-router)# <span class="cmd">address-family ipv4 unicast autonomous-system 100</span>
R1(config-router-af)# <span class="cmd">network 10.0.0.0 0.0.0.255</span>
R1(config-router-af)# <span class="cmd">eigrp router-id 1.1.1.1</span>
R1(config-router-af)# <span class="cmd">exit-address-family</span></pre></div>
<h4>EIGRP Stub Router</h4>
<p>Stub routers are spoke routers in a hub-and-spoke topology. They tell the hub "I'm a stub — don't send me QUERY packets, I have no alternative paths." This prevents SIA (Stuck In Active) events and reduces query scope.</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">EIGRP stub configuration options</span></div><pre>Spoke(config-router)# <span class="cmd">eigrp stub connected summary</span>
<span class="cm">! connected = advertise directly connected routes</span>
<span class="cm">! summary   = advertise summary routes</span>
<span class="cm">! receive-only = receive but never advertise</span>
<span class="cm">! (no options) = connected + summary (default)</span>

<span class="cm">! Verify stub status</span>
Hub# <span class="cmd">show ip eigrp neighbors detail</span>
<span class="cm">! Shows "Stub Peer Advertising connected, summary Routes" for stub peers</span></pre></div>
<h4>Unequal-Cost Load Balancing — EIGRP Variance</h4>
<p>OSPF can only load-balance across equal-cost paths. EIGRP supports unequal-cost load balancing using the <code>variance</code> multiplier. A route is included in load balancing if its FD ≤ variance × Successor's FD AND it meets the Feasibility Condition (is a Feasible Successor).</p>
</script>

<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Configure EIGRP MD5 Authentication (Named Mode)</span><span class="step-sub">HUB, SPOKE-1</span><span class="step-chv">▼</span></div><div class="step-body">
