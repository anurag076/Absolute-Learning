<script type="text/x-tmpl" id="m12-theory">
<h3>Capstone — Complete Enterprise Routing Design</h3>
<p>This capstone integrates every topic: RIPv2, Static, OSPF multi-area, EIGRP named mode, BGP with Route Reflectors, redistribution with tagging, PBR with IP SLA, and route summarisation. This is the level expected for CCNP ENCOR.</p>
<h4>Enterprise Design Summary</h4>
<table class="tbl"><thead><tr><th>Layer</th><th>Protocol</th><th>Purpose</th></tr></thead><tbody>
<tr><td>Internet Edge</td><td>eBGP (dual ISP)</td><td>Internet connectivity, inbound/outbound traffic engineering</td></tr>
<tr><td>Core / WAN</td><td>OSPF Multi-Area</td><td>Fast convergence, scalable, open standard</td></tr>
<tr><td>Branch WAN</td><td>EIGRP Named Mode</td><td>Fast convergence, unequal-cost LB, stub branches</td></tr>
<tr><td>Border (Core↔Branch)</td><td>Redistribution</td><td>Connect OSPF and EIGRP domains with loop prevention</td></tr>
<tr><td>Traffic Policy</td><td>PBR + IP SLA</td><td>Source-based routing, reliable failover</td></tr>
<tr><td>Management</td><td>Static + Floating</td><td>OOB management, backup paths</td></tr>
</tbody></table>
<h4>CCNP ENCOR Checklist — What You Must Know</h4>
<div class="g2">
  <div class="card"><h5>OSPF</h5><p>• All 8 neighbour states and what causes each<br>• DR/BDR election rules, non-preemptive nature<br>• All 7 LSA types and their scope<br>• All area types (stub/totally stubby/NSSA/totally NSSA)<br>• OSPF network types and their DR/BDR behaviour<br>• Authentication configuration and verification</p></div>
  <div class="card y"><h5>EIGRP</h5><p>• DUAL, Successor, Feasible Successor, Feasibility Condition<br>• Classic vs Named mode configuration<br>• Stub router — configuration and impact on QUERY scope<br>• SIA — causes, prevention, troubleshooting<br>• Variance for unequal-cost load balancing<br>• Authentication in Named mode</p></div>
  <div class="card g"><h5>BGP</h5><p>• iBGP vs eBGP — all differences<br>• All 13 best-path selection steps in order<br>• Route Reflectors — why needed, how configured<br>• Communities — types and use cases<br>• Traffic engineering (LP outbound, prepend inbound)<br>• next-hop-self — when and why</p></div>
  <div class="card p"><h5>Path Control</h5><p>• Route maps — match/set, sequence, implicit deny<br>• Prefix lists vs ACLs for route filtering<br>• Redistribution with mutual loop prevention<br>• PBR — ingress interface, next-hop vs default next-hop<br>• IP SLA + tracking for conditional routes<br>• Summarisation in all protocols</p></div>
</div>
</script>

<script type="text/x-tmpl" id="m12-lab">
<h3>Capstone Lab — Full Enterprise Routing</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Complete Enterprise Topology</span><span class="tbadge both">CCNA + CCNP</span></div><div class="topo-body">        <span class="r">[ ISP-A ]</span> AS100            <span class="r">[ ISP-B ]</span> AS200
          <span class="ln">|</span> eBGP                        <span class="ln">|</span> eBGP
          <span class="ln">|</span> 10.100.0.0/30               <span class="ln">|</span> 10.200.0.0/30
        <span class="r">[ INET ]</span>---iBGP--<span class="r">[ RR ]</span>---iBGP--<span class="r">[ INET2 ]</span>
            <span class="ln">|</span>        AS65000              <span class="ln">|</span>
         <span class="lb">OSPF Area 0 (Backbone)</span>
            <span class="ln">|</span>                            <span class="ln">|</span>
       <span class="r">[ CORE1 ]</span>                    <span class="r">[ CORE2 ]</span>
       <span class="lb">Area 0</span>                          <span class="lb">Area 0</span>
       <span class="ln">|</span>            <span class="lb">ABR</span>                  <span class="ln">|</span>
   <span class="r">[ ABR1 ]</span>                           <span class="r">[ ABR2 ]</span>
   <span class="lb">Area 1</span>                              <span class="lb">Area 2</span>
       <span class="ln">|</span>  EIGRP ↔ OSPF Redistribution       <span class="ln">|</span>
   <span class="r">[ BR1 ]</span>                             <span class="r">[ BR2 ]</span>
   <span class="lb">EIGRP stub</span>                          <span class="lb">EIGRP stub</span>
   <span class="ip">192.168.10.0/24</span>                     <span class="ip">192.168.20.0/24</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Phase 1 — Build OSPF Multi-Area Core</span><span class="step-sub">CORE1, CORE2, ABR1, ABR2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">OSPF backbone — all core routers</span></div><pre><span class="cm">! All CORE and ABR routers — OSPF Area 0</span>
CORE1(config)# <span class="cmd">router ospf 1</span>
CORE1(config-router)# <span class="cmd">router-id 10.1.1.1</span>
CORE1(config-router)# <span class="cmd">auto-cost reference-bandwidth 10000</span>
CORE1(config-router)# <span class="cmd">network 10.0.0.0 0.255.255.255 area 0</span>
CORE1(config-router)# <span class="cmd">network 10.1.1.1 0.0.0.0 area 0</span>   <span class="cm">! Loopback</span>

<span class="cm">! ABR1 — bridges Area 0 and Area 1</span>
ABR1(config)# <span class="cmd">router ospf 1</span>
ABR1(config-router)# <span class="cmd">router-id 10.2.1.1</span>
ABR1(config-router)# <span class="cmd">network 10.0.12.0 0.0.0.3 area 0</span>    <span class="cm">! Link to CORE</span>
ABR1(config-router)# <span class="cmd">network 10.1.0.0 0.0.0.255 area 1</span>   <span class="cm">! Area 1 links</span>
ABR1(config-router)# <span class="cmd">area 1 range 192.168.10.0 255.255.255.0</span> <span class="cm">! Summarise Area 1</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Phase 2 — EIGRP Named Mode on Branch Links with Redistribution</span><span class="step-sub">ABR1, BR1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">EIGRP + redistribution with tag-based loop prevention</span></div><pre><span class="cm">! BR1 — EIGRP stub named mode</span>
BR1(config)# <span class="cmd">router eigrp ENTERPRISE</span>
BR1(config-router)# <span class="cmd">address-family ipv4 unicast autonomous-system 100</span>
BR1(config-router-af)# <span class="cmd">eigrp router-id 1.1.1.1</span>
BR1(config-router-af)# <span class="cmd">network 10.1.0.0 0.0.0.255</span>
BR1(config-router-af)# <span class="cmd">network 192.168.10.0 0.0.0.255</span>
BR1(config-router-af)# <span class="cmd">eigrp stub connected summary</span>   <span class="cm">! STUB — no queries</span>
BR1(config-router-af)# <span class="cmd">exit-address-family</span>

<span class="cm">! ABR1 — redistribution with loop prevention tags</span>
ABR1(config)# <span class="cmd">route-map EIGRP-TO-OSPF deny 5</span>
ABR1(config-route-map)# <span class="cmd">match tag 100</span>
ABR1(config)# <span class="cmd">route-map EIGRP-TO-OSPF permit 10</span>
ABR1(config-route-map)# <span class="cmd">set tag 200</span>

ABR1(config)# <span class="cmd">route-map OSPF-TO-EIGRP deny 5</span>
ABR1(config-route-map)# <span class="cmd">match tag 200</span>
ABR1(config)# <span class="cmd">route-map OSPF-TO-EIGRP permit 10</span>
ABR1(config-route-map)# <span class="cmd">set tag 100</span>

ABR1(config)# <span class="cmd">router ospf 1</span>
ABR1(config-router)# <span class="cmd">redistribute eigrp 100 subnets route-map EIGRP-TO-OSPF</span>
ABR1(config)# <span class="cmd">router eigrp ENTERPRISE</span>
ABR1(config-router)# <span class="cmd">address-family ipv4 unicast autonomous-system 100</span>
ABR1(config-router-af)# <span class="cmd">topology base</span>
ABR1(config-router-af-topology)# <span class="cmd">redistribute ospf 1 metric 10000 100 255 1 1500 route-map OSPF-TO-EIGRP</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Phase 3 — BGP with Route Reflector and Traffic Engineering</span><span class="step-sub">INET, INET2, RR</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">iBGP via Route Reflector + dual-ISP outbound/inbound control</span></div><pre><span class="cm">! Route Reflector configuration</span>
RR(config)# <span class="cmd">router bgp 65000</span>
RR(config-router)# <span class="cmd">bgp router-id 100.100.100.100</span>
RR(config-router)# <span class="cmd">neighbor INET-1 peer-group</span>
RR(config-router)# <span class="cmd">neighbor INET-1 remote-as 65000</span>
RR(config-router)# <span class="cmd">neighbor INET-1 update-source loopback0</span>
RR(config-router)# <span class="cmd">neighbor INET-1 route-reflector-client</span>
RR(config-router)# <span class="cmd">neighbor 10.1.1.100 peer-group INET-1</span>   <span class="cm">! INET router</span>
RR(config-router)# <span class="cmd">neighbor 10.1.1.200 peer-group INET-1</span>   <span class="cm">! INET2 router</span>

<span class="cm">! INET — eBGP to ISP-A + iBGP to RR</span>
INET(config)# <span class="cmd">router bgp 65000</span>
INET(config-router)# <span class="cmd">neighbor 10.100.0.2 remote-as 100</span>        <span class="cm">! eBGP ISP-A</span>
INET(config-router)# <span class="cmd">neighbor 10.100.0.2 description ISP-A</span>
INET(config-router)# <span class="cmd">neighbor 100.100.100.100 remote-as 65000</span>  <span class="cm">! iBGP to RR</span>
INET(config-router)# <span class="cmd">neighbor 100.100.100.100 update-source loopback0</span>
INET(config-router)# <span class="cmd">neighbor 100.100.100.100 next-hop-self</span>

<span class="cm">! Outbound preference: prefer ISP-A — set high Local Pref on inbound from ISP-A</span>
INET(config)# <span class="cmd">route-map ISPA-PREFERRED permit 10</span>
INET(config-route-map)# <span class="cmd">set local-preference 200</span>
INET(config-router)# <span class="cmd">neighbor 10.100.0.2 route-map ISPA-PREFERRED in</span>

<span class="cm">! Inbound preference: AS-path prepend on ISP-B — make path look longer</span>
INET2(config)# <span class="cmd">route-map ISPB-PREPEND permit 10</span>
INET2(config-route-map)# <span class="cmd">set as-path prepend 65000 65000 65000</span>
INET2(config-router)# <span class="cmd">neighbor 10.200.0.2 route-map ISPB-PREPEND out</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">4</span><span class="step-title">Phase 4 — IP SLA + PBR for Traffic Engineering at Branch</span><span class="step-sub">BR1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">IP SLA monitored floating static + PBR</span></div><pre><span class="cm">! IP SLA to monitor primary path availability</span>
BR1(config)# <span class="cmd">ip sla 1</span>
BR1(config-ip-sla)# <span class="cmd">icmp-echo 10.0.0.1 source-interface gi0/0</span>
BR1(config-ip-sla-echo)# <span class="cmd">frequency 5</span>
BR1(config)# <span class="cmd">ip sla schedule 1 life forever start-time now</span>
BR1(config)# <span class="cmd">track 1 ip sla 1 reachability</span>

<span class="cm">! Primary route monitored by IP SLA (AD 10)</span>
BR1(config)# <span class="cmd">ip route 0.0.0.0 0.0.0.0 10.0.0.1 10 track 1</span>
<span class="cm">! Backup route via secondary link (AD 200 — only if primary fails)</span>
BR1(config)# <span class="cmd">ip route 0.0.0.0 0.0.0.0 10.0.99.1 200</span>

<span class="cm">! PBR — VoIP users (192.168.10.128/26) always use primary path</span>
BR1(config)# <span class="cmd">ip access-list standard VOIP-HOSTS</span>
BR1(config-std-nacl)# <span class="cmd">permit 192.168.10.128 0.0.0.63</span>
BR1(config)# <span class="cmd">route-map VOIP-POLICY permit 10</span>
BR1(config-route-map)# <span class="cmd">match ip address VOIP-HOSTS</span>
BR1(config-route-map)# <span class="cmd">set ip next-hop verify-availability 10.0.0.1 1 track 1</span>
BR1(config)# <span class="cmd">route-map VOIP-POLICY permit 20</span>   <span class="cm">! All others — normal routing</span>
BR1(config)# <span class="cmd">interface gi0/1</span>
BR1(config-if)# <span class="cmd">ip policy route-map VOIP-POLICY</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">5</span><span class="step-title">Final Verification Checklist</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Complete verification — every protocol layer</span></div><pre><span class="cm">!═══ OSPF ═══</span>
CORE1# <span class="cmd">show ip ospf neighbor</span>                    <span class="cm">! All Full state?</span>
ABR1#  <span class="cmd">show ip ospf border-routers</span>              <span class="cm">! ABRs/ASBRs in domain?</span>
BR1#   <span class="cmd">show ip route ospf</span>                       <span class="cm">! Seeing OSPF routes?</span>
CORE1# <span class="cmd">show ip ospf database summary</span>           <span class="cm">! Type 3 LSAs correct?</span>

<span class="cm">!═══ EIGRP ═══</span>
BR1#   <span class="cmd">show ip eigrp neighbors</span>                  <span class="cm">! Neighbours up?</span>
ABR1#  <span class="cmd">show ip eigrp topology 192.168.10.0/24</span>  <span class="cm">! Successor/FS?</span>
ABR1#  <span class="cmd">show ip eigrp neighbors detail</span>          <span class="cm">! Verify stub flag on BR1</span>

<span class="cm">!═══ BGP ═══</span>
INET#  <span class="cmd">show bgp summary</span>                        <span class="cm">! Sessions established?</span>
INET#  <span class="cmd">show bgp ipv4 unicast</span>                   <span class="cm">! Best paths selected?</span>
RR#    <span class="cmd">show bgp ipv4 unicast neighbors [ip] advertised-routes</span>  <span class="cm">! RR reflecting?</span>

<span class="cm">!═══ Redistribution ═══</span>
ABR1#  <span class="cmd">show route-map</span>                          <span class="cm">! Hit counters on deny clauses?</span>
CORE1# <span class="cmd">show ip route 192.168.10.0</span>              <span class="cm">! Redistributed route visible?</span>

<span class="cm">!═══ IP SLA and PBR ═══</span>
BR1#   <span class="cmd">show ip sla statistics 1</span>                <span class="cm">! SLA success/failure?</span>
BR1#   <span class="cmd">show track 1</span>                            <span class="cm">! Track state Up?</span>
BR1#   <span class="cmd">show route-map VOIP-POLICY</span>             <span class="cm">! PBR hit counts?</span>

<span class="cm">!═══ End-to-end ═══</span>
BR1#   <span class="cmd">traceroute 8.8.8.8 source 192.168.10.1</span> <span class="cm">! Goes via ISP-A?</span>
BR1#   <span class="cmd">traceroute 8.8.8.8 source 192.168.10.129</span><span class="cm">! VoIP host — same path?</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m12-interview">
<h3>Capstone Interview — Complex Scenarios</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">Branch routers can reach all internal networks but cannot reach the internet. OSPF and EIGRP are working. BGP is running only on the INET routers. What is the likely cause and how do you fix it?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Likely causes — in order of likelihood:</strong></p><p>1. <strong>Default route not propagated:</strong> The INET router has a BGP default route (0.0.0.0/0) from ISP-A but it's not being injected into OSPF. Branch routers have no default route. Fix: On INET, redistribute the default into OSPF: <code>router ospf 1 → default-information originate always</code></p><p>2. <strong>BGP routes not redistributed into OSPF:</strong> If you need specific internet routes (unusual), redistribution from BGP to OSPF is missing on INET.</p><p>3. <strong>BGP next-hop reachability:</strong> iBGP learned routes have next-hop set to the ISP's IP. Internal routers don't have a route to the ISP's IP (not in IGP). Fix: <code>neighbor [iBGP-peer] next-hop-self</code> on INET so iBGP peers receive a reachable next-hop.</p><p><strong>Troubleshooting commands:</strong><br><code>BR1# show ip route 0.0.0.0</code> — is there a default route?<br><code>INET# show ip route</code> — does INET have a default via BGP?<br><code>BR1# traceroute 8.8.8.8</code> — where does it fail?</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">You receive a call: "Since this morning's change, traffic between Branch 1 (192.168.10.0/24) and Branch 2 (192.168.20.0/24) is taking a path through the internet edge routers instead of through the core." What are you investigating?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Traffic taking a suboptimal path suggests a routing policy or metric issue. Investigate systematically:</p><p><strong>Step 1 — Confirm the path:</strong><br><code>traceroute 192.168.20.1 source 192.168.10.1</code> from BR1 — what hops does it show?</p><p><strong>Step 2 — Check the route on BR1:</strong><br><code>show ip route 192.168.20.0</code> — what's the next-hop? Via ABR1 (correct) or via some other path?</p><p><strong>Step 3 — Check if redistribution loop occurred:</strong> If mutual redistribution is running, a route might have been redistributed from OSPF→EIGRP→BGP and the BGP route (AD 20 or 200) is winning over the OSPF/EIGRP route. This happens if tagging broke. Check: <code>show ip route 192.168.20.0</code> — what's the source code (O, D, B, S)?</p><p><strong>Step 4 — Check this morning's change:</strong> What was changed? If an interface or process was cleared, it might have caused route reconvergence with suboptimal results. If BGP config was changed, iBGP might now be distributing routes that compete with the IGP.</p><p><strong>Step 5 — Metric comparison:</strong> An external route (redistributed with low metric) might be winning over a native protocol route. Check <code>show ip eigrp topology 192.168.20.0/24</code> — is there a D EX route competing with a D route?</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Compare OSPF and EIGRP convergence behaviour when a link fails. What happens in each protocol step by step?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>OSPF link failure convergence:</strong></p><ol><li>Link goes down → interface detects failure immediately</li><li>Router originates a new Router LSA (Type 1) with the failed link removed</li><li>LSA floods to all routers in the area via LSU packets</li><li>All routers acknowledge (LSAck)</li><li>All routers run SPF algorithm on updated LSDB</li><li>Routing tables updated — convergence time: 1-5 seconds typically</li></ol><p><strong>EIGRP link failure convergence:</strong></p><ol><li>Link goes down → EIGRP detects neighbour loss (interface down or hold timer expired)</li><li>EIGRP checks topology table for this destination</li><li><strong>If Feasible Successor exists:</strong> Successor promoted to new Successor — convergence in milliseconds (no queries needed)</li><li><strong>If no Feasible Successor:</strong> Route goes Active → QUERY sent to all neighbours → waits for REPLYs → new Successor selected → convergence in seconds to minutes depending on query scope</li></ol><p><strong>Key difference:</strong> EIGRP with pre-computed Feasible Successors converges much faster than OSPF (sub-second vs 1-5 seconds). But without FS, EIGRP's QUERY/REPLY process can be slower than OSPF's LSA flooding. OSPF convergence is more predictable. EIGRP convergence is faster in the best case but worse-case SIA can be catastrophic.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-d">DEFINE</span><span class="qa-text">What is BFD (Bidirectional Forwarding Detection) and how does it help with routing protocol convergence?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>BFD is a lightweight, protocol-independent hello mechanism that detects link failures in milliseconds — much faster than routing protocol hello/dead timers.</p><p><strong>The problem it solves:</strong> OSPF has a 10-second hello and 40-second dead timer by default. EIGRP has a 5-second hello and 15-second dead timer. A link failure might not be detected for up to 40 seconds (OSPF) — during which traffic is blackholed. Reducing timers to 1-second/3-second creates too much control-plane overhead on high-density networks.</p><p><strong>How BFD works:</strong> Two routers send BFD hello packets at sub-second intervals (default 300ms–1s). If a peer doesn't respond within 3 intervals (typically under 1 second), BFD declares the path down and immediately notifies the routing protocol. The routing protocol then re-converges instantly without waiting for its own dead timer.</p><p><strong>Configuration:</strong><br><code>router ospf 1 → bfd all-interfaces</code> — enable for OSPF<br><code>router eigrp COMPANY → address-family ... → bfd all-interfaces</code> — EIGRP<br><code>router bgp 65000 → neighbor X.X.X.X fall-over bfd</code> — BGP<br><br>BFD session runs in hardware on modern platforms — very low overhead even at fast timers.</p></div></div>
</script>

<script>
var M=[
  {id:1,  title:"Routing Fundamentals — AD, LPM, RIB/FIB",     level:"ccna"},
  {id:2,  title:"RIP v1 & v2 — Distance Vector Basics",         level:"ccna"},
  {id:3,  title:"Static & Floating Static Routes",              level:"ccna"},
  {id:4,  title:"OSPF Single Area — DR/BDR, Auth, Timers",      level:"ccna"},
  {id:5,  title:"OSPF Multi-Area — LSA Types 1–7, Area Types",  level:"ccnp"},
  {id:6,  title:"EIGRP — DUAL, Named Mode, Stub, Variance",     level:"ccna"},
  {id:7,  title:"BGP — Route Reflectors, Communities, TE",      level:"ccnp"},
  {id:8,  title:"Route Maps & Prefix Lists",                    level:"ccnp"},
  {id:9,  title:"Route Redistribution & Loop Prevention",       level:"ccnp"},
  {id:10, title:"Path Control — Summarisation, PBR, IP SLA",    level:"ccnp"},
  {id:11, title:"IPv6 Routing — OSPFv3, EIGRPv6, Static",      level:"ccnp"},
  {id:12, title:"Capstone — Full Enterprise Routing Design",    level:"both"}
];

var cur=0;
var TABS=["theory","lab","interview"];

function getSection(id,tab){
  var el=document.getElementById("m"+id+"-"+tab);
  return el?el.textContent:"<p style='color:var(--mut);padding:20px'>Content loading...</p>";
}

function renderSidebar(){
  var h="";
  for(var i=0;i<M.length;i++){
    var lv=M[i].level;
    h+="<div class='ti"+(i===cur?" active":"")+"' onclick='selectTopic("+i+")'>"
      +"<span class='tn'>"+String(M[i].id).padStart(2,"0")+"</span>"
      +"<span class='tt'>"+M[i].title+"</span>"
      +"<span class='lbx lb-"+lv+"'>"+lv.toUpperCase()+"</span>"
      +"</div>";
  }
  document.getElementById("tlist").innerHTML=h;
}

function renderContent(){
  var m=M[cur];
  document.getElementById("ttl").textContent=m.title;
  var lb=document.getElementById("tlvl");
  lb.textContent=m.level.toUpperCase();
  lb.className="bd-lv lbx lb-"+m.level;
  lb.style.display="inline-block";
  for(var i=0;i<TABS.length;i++){
    document.getElementById(TABS[i]).innerHTML=getSection(m.id,TABS[i]);
  }
  document.getElementById("sft").textContent="Topic "+m.id+" of "+M.length+"  ·  "+m.level.toUpperCase();
}

function selectTopic(i){
  cur=i;
  renderSidebar();
  renderContent();
  switchTab("theory");
  document.getElementById("ct").scrollTop=0;
  closeSidebar();
}

function switchTab(tab){
  document.querySelectorAll(".sec").forEach(function(s){s.classList.remove("active");});
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.getElementById(tab).classList.add("active");
  var idx=TABS.indexOf(tab);
  if(idx>=0) document.querySelectorAll(".tab")[idx].classList.add("active");
  document.getElementById("ct").scrollTop=0;
}

document.querySelectorAll(".tab").forEach(function(el){
  el.addEventListener("click",function(){switchTab(el.getAttribute("data-tab"));});
});

function tStep(hdr){
  var body=hdr.parentElement.querySelector(".step-body");
  var chev=hdr.querySelector(".step-chv");
  var open=body.classList.contains("open");
  body.classList.toggle("open",!open);
  if(chev) chev.classList.toggle("op",!open);
}

function tQA(hdr){
  var ans=hdr.nextElementSibling;
  var chev=hdr.querySelector(".qa-chv");
  var open=ans.classList.contains("open");
  ans.classList.toggle("open",!open);
  if(chev) chev.classList.toggle("op",!open);
}

function openSidebar(){
  document.getElementById("sb").classList.add("open");
  document.getElementById("ovl").classList.add("open");
}
function closeSidebar(){
  document.getElementById("sb").classList.remove("open");
  document.getElementById("ovl").classList.remove("open");
}
document.getElementById("hbg").addEventListener("click",function(){
  document.getElementById("sb").classList.contains("open")?closeSidebar():openSidebar();
});
document.getElementById("ovl").addEventListener("click",closeSidebar);

renderSidebar();
renderContent();
</script>
