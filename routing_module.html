<script type="text/x-tmpl" id="m6-interview">
<h3>Interview Questions — EIGRP</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Explain the Feasibility Condition in EIGRP. Why is it needed and what makes a path loop-free?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>The Feasibility Condition (FC) is EIGRP's loop-prevention mechanism for Feasible Successors.</p><p><strong>The condition:</strong> A neighbour qualifies as a Feasible Successor if its Reported Distance (RD) is strictly less than the Successor's Feasible Distance (FD).<br>In formula: <strong>neighbour_RD &lt; local_FD</strong></p><p><strong>Why it works (logic):</strong> My FD is the total cost of my best path. If a neighbour's RD (its own cost to the destination) is less than my FD, then the neighbour's path to the destination is shorter than my total path. This means the neighbour cannot be routing traffic through me — if it were, its cost would be higher than mine. Therefore, using that neighbour as a backup is guaranteed loop-free.</p><p><strong>If FC is NOT met:</strong> The path exists but is not a Feasible Successor — it's a "regular" path in the topology table. If the Successor fails and no FS exists, the route goes Active and EIGRP sends QUERY packets to all neighbours.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is SIA (Stuck in Active) in EIGRP and how do you prevent it?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>When an EIGRP route goes Active (no Feasible Successor), the router sends QUERY packets to all neighbours and waits for REPLYs. The Active Timer is 3 minutes by default. If a REPLY doesn't arrive in time, the router declares the neighbour as SIA — Stuck in Active — and resets the adjacency with that neighbour.</p><p><strong>SIA consequences:</strong> Resetting the adjacency drops ALL routes learned through that neighbour — very disruptive. SIA is EIGRP's most serious convergence problem.</p><p><strong>Common causes:</strong><br>• Query scope too large — QUERY propagates through the entire network<br>• Overloaded router can't process queries fast enough<br>• Unresponsive remote router (possibly crashed or high CPU)</p><p><strong>Prevention:</strong><br>• <strong>EIGRP stub:</strong> Spoke routers declared as stub don't receive QUERY packets from the hub (they reply immediately with "I have no path")<br>• <strong>Route summarisation:</strong> Summaries limit query scope — a QUERY for a specific prefix doesn't cross a summarisation boundary<br>• <strong>SIA timers:</strong> <code>timers active-time [minutes]</code> to adjust the timeout<br>• <strong>SIA-query:</strong> Modern IOS sends SIA-QUERY halfway through the timer to check if the neighbour is still processing</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between EIGRP Classic mode and Named mode? Why was Named mode introduced?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Classic mode issues:</strong> Separate <code>router eigrp [AS]</code> processes for IPv4 and IPv6. No address-family concept means inconsistent config between address families. Some newer features only work in Named mode.</p><p><strong>Named mode advantages:</strong><br>• Single process with address families under it (like BGP) — consistent model<br>• Supports wide metrics (32-bit FD instead of 32-bit) for high-bandwidth links — avoids metric ties on GigE and 10GigE<br>• Per-interface configuration under <code>af-interface</code> is cleaner<br>• Authentication configured inside the address-family, not on interface<br>• Supports Add-Paths (multiple paths to same destination — CCNP advanced feature)<br>• BGP-like configuration style — easier to learn</p><p><strong>In production:</strong> Both work. Classic mode is still valid and widely deployed. CCNP ENCOR exam tests Named mode, so know both. Named mode is the strategic direction going forward.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">EIGRP is running and "show ip eigrp topology" shows a route as Active for 10.5.0.0/24 for over 3 minutes. What is happening and what is your response?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>A route in Active state for over 3 minutes means SIA is imminent or already occurring. This is urgent.</p><p><strong>What's happening:</strong> The Successor for 10.5.0.0/24 failed and no Feasible Successor exists. The router sent QUERY packets to all neighbours. After 3 minutes without a REPLY, the router will declare SIA and reset adjacencies — losing all routes through those neighbours.</p><p><strong>Immediate actions:</strong><br>1. <code>show ip eigrp topology active</code> — see all routes currently in Active state<br>2. <code>show ip eigrp neighbors detail</code> — check SIA-QUERY state and which neighbours haven't replied<br>3. <code>show processes cpu | include EIGRP</code> — check if the neighbour router is overloaded<br>4. <code>show ip eigrp traffic</code> — check QUERY/REPLY counters</p><p><strong>If SIA occurs:</strong> The adjacency resets automatically. After re-convergence, investigate:<br>• Why there was no Feasible Successor (topology issue — consider EIGRP stub or summarisation)<br>• Why the neighbour didn't reply (CPU, link issue, misconfiguration)</p></div></div>
</script>
<!-- ══════════════════ TOPIC 7: BGP ══════════════════ -->
<script type="text/x-tmpl" id="m7-theory">
<h3>BGP — Border Gateway Protocol</h3>
<p>BGP is the routing protocol of the internet. Every ISP, large enterprise, and cloud provider runs BGP. It's a path-vector protocol — instead of metrics, it makes routing decisions based on a rich set of path attributes. BGP carries the internet's full routing table (900,000+ prefixes).</p>
<h4>iBGP vs eBGP</h4>
<table class="tbl"><thead><tr><th>Feature</th><th>iBGP (Internal BGP)</th><th>eBGP (External BGP)</th></tr></thead><tbody>
<tr><td>Peers in</td><td>Same AS</td><td>Different ASes</td></tr>
<tr><td>AD</td><td>200</td><td>20</td></tr>
<tr><td>TTL</td><td>255 (can span the network)</td><td>1 by default (must be directly connected)</td></tr>
<tr><td>AS-Path</td><td>Not modified</td><td>Local AS prepended to AS-Path</td></tr>
<tr><td>Next-Hop</td><td>Not changed (causes issues)</td><td>Changed to peering IP</td></tr>
<tr><td>Full mesh</td><td>Required (or use Route Reflector)</td><td>Not required</td></tr>
<tr><td>Readvertise to iBGP?</td><td>No (loop prevention)</td><td>Yes — to iBGP and eBGP peers</td></tr>
</tbody></table>
<h4>BGP Path Attributes</h4>
<table class="tbl"><thead><tr><th>Attribute</th><th>Type</th><th>Default</th><th>Higher or Lower Wins?</th><th>Scope</th></tr></thead><tbody>
<tr><td><strong>Weight</strong></td><td>Cisco proprietary</td><td>0 (received), 32768 (local)</td><td>Higher</td><td>Local router only (not advertised)</td></tr>
<tr><td><strong>Local Preference</strong></td><td>Well-known discretionary</td><td>100</td><td>Higher</td><td>Shared within AS via iBGP</td></tr>
<tr><td><strong>AS-Path</strong></td><td>Well-known mandatory</td><td>Empty (locally originated)</td><td>Shorter</td><td>Propagated to all BGP peers</td></tr>
<tr><td><strong>Origin</strong></td><td>Well-known mandatory</td><td>IGP (i)</td><td>i &gt; e &gt; ?</td><td>Propagated everywhere</td></tr>
<tr><td><strong>MED</strong></td><td>Optional non-transitive</td><td>0</td><td>Lower</td><td>Advertised to adjacent AS only</td></tr>
<tr><td><strong>Next-Hop</strong></td><td>Well-known mandatory</td><td>Peering IP (eBGP) / Unchanged (iBGP)</td><td>Must be reachable</td><td>Propagated</td></tr>
<tr><td><strong>Community</strong></td><td>Optional transitive</td><td>None</td><td>Policy-dependent</td><td>Propagated (if configured to)</td></tr>
</tbody></table>
<h4>BGP Best Path Selection — 13 Steps (Memorise This)</h4>
<div class="cb"><div class="ch"><span class="lg out">BGP</span><span class="fn">Memory aid: "We Love Oranges As Oranges Mean Pure Refreshment"</span></div><pre><span class="hl"> 1. Next-hop reachable?</span>    — Route ignored if next-hop unreachable
<span class="hl"> 2. Weight</span>                  — Highest wins (Cisco only)
<span class="hl"> 3. Local Preference</span>        — Highest wins (AS-wide outbound control)
<span class="hl"> 4. Locally originated</span>     — Prefer locally originated (network/redistribute/agg)
<span class="hl"> 5. AS-Path length</span>          — Shortest wins (loop prevention + path preference)
<span class="hl"> 6. Origin code</span>             — i (IGP) &gt; e (EGP) &gt; ? (incomplete)
<span class="hl"> 7. MED</span>                     — Lowest wins (inbound influence on adjacent AS)
<span class="hl"> 8. eBGP over iBGP</span>         — External path preferred over internal
<span class="hl"> 9. IGP metric to next-hop</span> — Lowest cost to reach next-hop in IGP
<span class="hl">10. Oldest eBGP path</span>       — Oldest (most stable) peer
<span class="hl">11. Lowest Router ID</span>       — Lowest BGP RID
<span class="hl">12. Shortest cluster list</span>  — Fewest Route Reflector hops
<span class="hl">13. Lowest neighbour IP</span>    — Last tiebreaker</pre></div>
<h4>BGP Communities</h4>
<p>Communities are 32-bit tags attached to BGP routes. Used to group routes and apply policies. Standard format: AS:value (e.g., 65001:100). Well-known communities:</p>
<div class="chips">
  <span class="chip b">internet — advertise to all</span>
  <span class="chip r">no-export — don't send outside AS</span>
  <span class="chip y">no-advertise — don't advertise to any peer</span>
  <span class="chip p">local-AS — keep within confederation sub-AS</span>
</div>
<h4>Route Reflectors — Solving iBGP Full Mesh Problem</h4>
<p>iBGP rule: routes learned from an iBGP peer are NOT re-advertised to other iBGP peers (loop prevention). This requires every iBGP router to peer with every other — O(n²) full mesh. For 100 routers: 4,950 sessions. Not scalable.</p>
<p><strong>Route Reflector (RR):</strong> A designated router that breaks the iBGP non-readvertisement rule for its clients. The RR reflects (re-advertises) iBGP routes from one client to other clients and non-clients. Clients only need to peer with the RR — not each other.</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Route Reflector configuration</span></div><pre><span class="cm">! On the Route Reflector</span>
RR(config)# <span class="cmd">router bgp 65001</span>
RR(config-router)# <span class="cmd">neighbor 1.1.1.1 remote-as 65001</span>
RR(config-router)# <span class="cmd">neighbor 1.1.1.1 route-reflector-client</span>   <span class="cm">! R1 is RR client</span>
RR(config-router)# <span class="cmd">neighbor 2.2.2.2 remote-as 65001</span>
RR(config-router)# <span class="cmd">neighbor 2.2.2.2 route-reflector-client</span>   <span class="cm">! R2 is RR client</span>
<span class="cm">! RR will reflect routes from R1 to R2 and vice versa</span>
<span class="cm">! R1 and R2 don't need to peer with each other directly</span></pre></div>
</script>

<script type="text/x-tmpl" id="m7-lab">
<h3>Lab 7 — eBGP, iBGP, Communities, and Traffic Engineering</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">BGP Dual-ISP Topology</span><span class="tbadge ccnp">CCNP</span></div><div class="topo-body">         <span class="r">[ ISP-A ]</span> AS 100                    <span class="r">[ ISP-B ]</span> AS 200
           <span class="ln">|</span> eBGP <span class="ip">10.100.0.0/30</span>                <span class="ln">|</span> eBGP <span class="ip">10.200.0.0/30</span>
           <span class="ln">|</span>                                    <span class="ln">|</span>
<span class="ip">10.100.0.1</span> <span class="ln">|</span>                                    <span class="ln">|</span> <span class="ip">10.200.0.1</span>
         <span class="r">[ EDGE-1 ]</span>---iBGP---<span class="r">[ RR ]</span>---iBGP---<span class="r">[ EDGE-2 ]</span>
         <span class="ip">Lo:1.1.1.1</span>      <span class="ip">Lo:10.10.10.10</span>      <span class="ip">Lo:2.2.2.2</span>
                    AS 65000 — Your Company</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Configure eBGP to Both ISPs</span><span class="step-sub">EDGE-1, EDGE-2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">eBGP peering to ISPs</span></div><pre><span class="cm">! EDGE-1 — eBGP to ISP-A</span>
EDGE1(config)# <span class="cmd">router bgp 65000</span>
EDGE1(config-router)# <span class="cmd">bgp router-id 1.1.1.1</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.100.0.2 remote-as 100</span>     <span class="cm">! eBGP to ISP-A</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.100.0.2 description ISP-A eBGP</span>
<span class="cm">! Advertise company prefix to ISP-A</span>
EDGE1(config-router)# <span class="cmd">network 203.0.113.0 mask 255.255.255.0</span>

<span class="cm">! EDGE-2 — eBGP to ISP-B</span>
EDGE2(config)# <span class="cmd">router bgp 65000</span>
EDGE2(config-router)# <span class="cmd">bgp router-id 2.2.2.2</span>
EDGE2(config-router)# <span class="cmd">neighbor 10.200.0.2 remote-as 200</span>     <span class="cm">! eBGP to ISP-B</span>
EDGE2(config-router)# <span class="cmd">network 203.0.113.0 mask 255.255.255.0</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Configure iBGP via Route Reflector</span><span class="step-sub">RR, EDGE-1, EDGE-2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Route Reflector solves iBGP full-mesh problem</span></div><pre><span class="cm">! Route Reflector configuration</span>
RR(config)# <span class="cmd">router bgp 65000</span>
RR(config-router)# <span class="cmd">bgp router-id 10.10.10.10</span>
<span class="cm">! Peer with EDGE-1 and mark as RR client</span>
RR(config-router)# <span class="cmd">neighbor 1.1.1.1 remote-as 65000</span>
RR(config-router)# <span class="cmd">neighbor 1.1.1.1 update-source loopback 0</span>
RR(config-router)# <span class="cmd">neighbor 1.1.1.1 route-reflector-client</span>
<span class="cm">! Peer with EDGE-2 and mark as RR client</span>
RR(config-router)# <span class="cmd">neighbor 2.2.2.2 remote-as 65000</span>
RR(config-router)# <span class="cmd">neighbor 2.2.2.2 update-source loopback 0</span>
RR(config-router)# <span class="cmd">neighbor 2.2.2.2 route-reflector-client</span>

<span class="cm">! EDGE-1 — iBGP to RR only (not to EDGE-2 directly)</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.10.10.10 remote-as 65000</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.10.10.10 update-source loopback 0</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.10.10.10 next-hop-self</span>  <span class="cm">! Fix next-hop for iBGP</span>

<span class="cm">! Same for EDGE-2</span>
EDGE2(config-router)# <span class="cmd">neighbor 10.10.10.10 remote-as 65000</span>
EDGE2(config-router)# <span class="cmd">neighbor 10.10.10.10 update-source loopback 0</span>
EDGE2(config-router)# <span class="cmd">neighbor 10.10.10.10 next-hop-self</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Traffic Engineering — Outbound (Local Preference) and Inbound (AS-Path Prepend)</span><span class="step-sub">EDGE-1, EDGE-2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Prefer ISP-A for outbound, ISP-A for inbound</span></div><pre><span class="cm">!══════ OUTBOUND CONTROL (which ISP to use to send traffic) ══════</span>
<span class="cm">! Set high Local Preference on routes received from ISP-A → use ISP-A for outbound</span>
EDGE1(config)# <span class="cmd">route-map SET-LP-HIGH permit 10</span>
EDGE1(config-route-map)# <span class="cmd">set local-preference 200</span>    <span class="cm">! Higher than default 100</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.100.0.2 route-map SET-LP-HIGH in</span>
<span class="cm">! Routes from ISP-A get LP=200, routes from ISP-B get LP=100 (default)</span>
<span class="cm">! All internal routers prefer ISP-A for internet traffic (LP shared via iBGP)</span>

<span class="cm">!══════ INBOUND CONTROL (which ISP external traffic uses to reach us) ══════</span>
<span class="cm">! AS-Path prepend on ISP-B — make our prefix look farther away via ISP-B</span>
EDGE2(config)# <span class="cmd">route-map PREPEND-OUT permit 10</span>
EDGE2(config-route-map)# <span class="cmd">set as-path prepend 65000 65000 65000</span>  <span class="cm">! Add our AS 3 times</span>
EDGE2(config-router)# <span class="cmd">neighbor 10.200.0.2 route-map PREPEND-OUT out</span>
<span class="cm">! ISP-B now sees AS-path: 65000 65000 65000 65000 (4 entries)</span>
<span class="cm">! ISP-A sees AS-path: 65000 (1 entry)</span>
<span class="cm">! Internet prefers ISP-A (shorter AS-path)</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">4</span><span class="step-title">Configure and Verify BGP Communities</span><span class="step-sub">EDGE-1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Communities — tagging routes for policy</span></div><pre><span class="cm">! Set community on routes sent to ISP-A (many ISPs use communities for policy)</span>
EDGE1(config)# <span class="cmd">ip community-list 1 permit 65001:100</span>  <span class="cm">! Define community match</span>
EDGE1(config)# <span class="cmd">route-map SET-COMMUNITY permit 10</span>
EDGE1(config-route-map)# <span class="cmd">set community 65001:100</span>         <span class="cm">! Tag our routes</span>

EDGE1(config-router)# <span class="cmd">neighbor 10.100.0.2 route-map SET-COMMUNITY out</span>
<span class="cm">! MUST enable community sending (off by default!)</span>
EDGE1(config-router)# <span class="cmd">neighbor 10.100.0.2 send-community</span>

<span class="cm">! BGP Verification</span>
EDGE1# <span class="cmd">show bgp summary</span>
<span class="cm">! State/PfxRcd: number = established + routes received</span>

EDGE1# <span class="cmd">show bgp ipv4 unicast</span>
<span class="cm">! * = valid, > = best, i = iBGP, s = suppressed, S = stale</span>

EDGE1# <span class="cmd">show bgp ipv4 unicast 0.0.0.0 0.0.0.0</span>
<span class="cm">! Verify default route and which ISP it prefers (Local Pref shows)</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m7-interview">
<h3>Interview Questions — BGP</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Why does iBGP require a full mesh and how does a Route Reflector solve this?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Why full mesh is required:</strong> iBGP has a split-horizon rule — routes learned from an iBGP peer are NOT re-advertised to other iBGP peers. This prevents routing loops within an AS. But it means every iBGP router must peer directly with every other iBGP router to receive all routes. For 100 routers: 100×99/2 = 4,950 BGP sessions.</p><p><strong>How Route Reflector (RR) solves it:</strong> The RR is given special permission to re-advertise routes received from its clients (iBGP peers marked as route-reflector-client) to other clients. It acts as a hub. Clients only need to peer with the RR, not with each other. Instead of O(n²) sessions, you need only O(n) sessions (each client to the RR).</p><p><strong>RR loop prevention:</strong> RR uses Cluster-ID and ORIGINATOR_ID attributes to prevent loops. If a router receives a route with its own Cluster-ID or Router-ID in these fields, it discards the route.</p><p><strong>Placement:</strong> RRs should be placed in the middle of the network with good connectivity to all clients. Deploy at least two RRs for redundancy (both peer with all clients — clients receive duplicate routes but select best path).</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Explain BGP communities and give three practical use cases.</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>BGP communities are 32-bit tags attached to route advertisements. They're used to group routes and apply consistent policies across routers without configuring each router individually. Format: AS:value or numeric (e.g., 65001:100 = "customer A routes").</p><p><strong>Use case 1 — ISP traffic engineering:</strong> Tag your routes with a community value when advertising to ISP-A. ISP uses that community to apply LOCAL_PREF internally (e.g., community 65001:200 = "set LP 200 = prefer this path"). This lets you influence where ISP sends your inbound traffic without configuring anything on the ISP's routers directly.</p><p><strong>Use case 2 — no-export:</strong> Mark routes with the well-known <code>no-export</code> community. ISP-A won't advertise these routes to other ISPs. Useful for suppressing subnet announcements while still advertising the aggregate.</p><p><strong>Use case 3 — blackholing:</strong> Many ISPs support a blackhole community (e.g., 65535:666). If you're under DDoS, advertise the target IP/prefix with the blackhole community. The ISP drops all traffic to that prefix at their edge — before it reaches your network. Immediately stops the DDoS from consuming your bandwidth.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">iBGP is configured between R1 and R2 using Loopback addresses. The BGP session won't establish despite OSPF running between them. What are you checking?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>iBGP via Loopback is very common — it provides stability (session survives individual link failures). When it doesn't establish:</p><ul><li><strong>update-source missing:</strong> R1 configured <code>neighbor 2.2.2.2 remote-as 65001</code> but forgot <code>neighbor 2.2.2.2 update-source loopback0</code>. Without update-source, BGP uses the physical interface IP as source. R2 receives a TCP connection from a different IP than configured as neighbour — refuses it. <code>show ip bgp summary</code> — if state shows "Active" or "Idle", check update-source on both sides.</li><li><strong>OSPF not advertising Loopbacks:</strong> OSPF doesn't have a network statement for 1.1.1.1/32 or 2.2.2.2/32. R1 can't reach 2.2.2.2. Check: <code>ping 2.2.2.2</code> from R1. If it fails, check OSPF network statements.</li><li><strong>AS number mismatch:</strong> R1 configured <code>neighbor 2.2.2.2 remote-as 65002</code> but R2 is actually in AS 65001. BGP OPEN message will be rejected. <code>debug ip bgp</code> shows "BGP: open failed - AS mismatch".</li><li><strong>TTL issue:</strong> eBGP by default uses TTL=1. iBGP uses TTL=255. If both routers think it's eBGP (wrong remote-as), TTL=1 won't reach a Loopback across multiple hops. Verify both routers have matching AS numbers.</li></ul></div></div>
</script>
<!-- ══════════════════ TOPIC 8: ROUTE MAPS & PREFIX LISTS ══════════════════ -->
<script type="text/x-tmpl" id="m8-theory">
<h3>Route Maps and Prefix Lists — Traffic Policy Tools</h3>
<p>Route maps and prefix lists are the policy tools of network engineering. They're used in redistribution, BGP policy, PBR, NAT, and anywhere you need to match specific routes and take action on them. Mastering these is essential for CCNP.</p>
<h4>Prefix Lists — More Precise than ACLs for Routing</h4>
<p>A prefix list matches routing prefixes (network + mask). Unlike ACLs, prefix lists allow you to match both the prefix AND the prefix length, giving you fine-grained control.</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Prefix list syntax and examples</span></div><pre><span class="cm">! Syntax: ip prefix-list [name] [seq] [permit|deny] [prefix/len] [ge min] [le max]</span>

<span class="cm">! Match exactly 192.168.1.0/24</span>
ip prefix-list EXACT seq 5 permit <span class="ip">192.168.1.0/24</span>

<span class="cm">! Match any prefix between /24 and /32 (host routes to subnets)</span>
ip prefix-list LONG-MASKS seq 10 permit <span class="ip">0.0.0.0/0</span> ge 24

<span class="cm">! Match all /32 host routes</span>
ip prefix-list HOST-ROUTES seq 5 permit <span class="ip">0.0.0.0/0</span> ge 32 le 32

<span class="cm">! Match 10.0.0.0/8 and any subnet of it (/9 through /32)</span>
ip prefix-list RFC1918-10 seq 5 permit <span class="ip">10.0.0.0/8</span> ge 8 le 32

<span class="cm">! Block default route, permit everything else</span>
ip prefix-list NO-DEFAULT seq 5 deny <span class="ip">0.0.0.0/0</span>
ip prefix-list NO-DEFAULT seq 10 permit <span class="ip">0.0.0.0/0</span> le 32   <span class="cm">! permit all others</span>

<span class="cm">! Verify prefix-list</span>
R1# <span class="cmd">show ip prefix-list EXACT</span>
R1# <span class="cmd">show ip prefix-list EXACT 192.168.1.0/24</span>   <span class="cm">! Test a specific prefix</span></pre></div>
<h4>Route Maps — Match and Set</h4>
<p>A route map is a series of numbered clauses. Each clause has a <code>match</code> (what to match) and a <code>set</code> (what to do). Processing is sequential — first matching clause wins. Implicit deny at the end.</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Route map structure and common examples</span></div><pre><span class="cm">! Clause 10 — match and set BGP Local Preference</span>
ip prefix-list CORP-PREFIX permit <span class="ip">203.0.113.0/24</span>

route-map BGP-POLICY permit 10
  match ip address prefix-list CORP-PREFIX
  set local-preference 200
  set community 65001:100

<span class="cm">! Clause 20 — match different prefix, different action</span>
route-map BGP-POLICY permit 20
  match ip address prefix-list OTHER-PREFIXES
  set local-preference 50

<span class="cm">! Clause 30 — permit everything else (no match = match all, no set = no change)</span>
route-map BGP-POLICY permit 30

<span class="cm">! Without clause 30 → implicit deny → all non-matching routes dropped!</span>
<span class="cm">! This is the most common route-map mistake — forgetting the final permit</span></pre></div>
<h4>Route Map Match Options</h4>
<table class="tbl"><thead><tr><th>Match Command</th><th>Matches</th></tr></thead><tbody>
<tr><td><code>match ip address [acl|prefix-list]</code></td><td>Specific prefixes/addresses</td></tr>
<tr><td><code>match ip next-hop [acl|prefix-list]</code></td><td>Routes with specific next-hop</td></tr>
<tr><td><code>match as-path [as-path-list]</code></td><td>BGP routes with matching AS-path</td></tr>
<tr><td><code>match community [community-list]</code></td><td>BGP routes with matching community</td></tr>
<tr><td><code>match metric [value]</code></td><td>Routes with specific metric</td></tr>
<tr><td><code>match tag [tag]</code></td><td>Routes with specific route tag</td></tr>
<tr><td><code>match interface [interface]</code></td><td>Routes with specific exit interface</td></tr>
</tbody></table>
<h4>Route Map Set Options</h4>
<table class="tbl"><thead><tr><th>Set Command</th><th>Does</th><th>Used In</th></tr></thead><tbody>
<tr><td><code>set local-preference [val]</code></td><td>Set BGP Local Preference</td><td>BGP inbound policy</td></tr>
<tr><td><code>set community [community]</code></td><td>Set/add BGP community</td><td>BGP tagging</td></tr>
<tr><td><code>set as-path prepend [AS]</code></td><td>Prepend AS numbers to AS-path</td><td>BGP inbound influence</td></tr>
<tr><td><code>set metric [value]</code></td><td>Set route metric</td><td>Redistribution</td></tr>
<tr><td><code>set tag [value]</code></td><td>Tag the route</td><td>Loop prevention in redistribution</td></tr>
<tr><td><code>set ip next-hop [ip]</code></td><td>Change next-hop</td><td>PBR</td></tr>
<tr><td><code>set weight [value]</code></td><td>Set BGP Weight</td><td>Local BGP policy</td></tr>
</tbody></table>
</script>

<script type="text/x-tmpl" id="m8-lab">
<h3>Lab 8 — Route Maps for BGP and Redistribution</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Route Map Lab</span><span class="tbadge ccnp">CCNP</span></div><div class="topo-body"><span class="r">[ R1/OSPF ]</span>---<span class="r">[ R2/Border ]</span>---eBGP---<span class="r">[ ISP ]</span> AS 100
<span class="lb">OSPF Area 0</span>    <span class="lb">Redistribution + BGP Policy</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Use Prefix List to Filter Redistributed Routes</span><span class="step-sub">R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Only redistribute specific OSPF routes into BGP</span></div><pre><span class="cm">! Only redistribute OSPF routes in 192.168.0.0/16 range into BGP</span>
ip prefix-list CORP-SUBNETS seq 10 permit <span class="ip">192.168.0.0/16</span> ge 16 le 24
ip prefix-list CORP-SUBNETS seq 20 deny <span class="ip">0.0.0.0/0</span> le 32     <span class="cm">! block everything else</span>

route-map OSPF-TO-BGP permit 10
  match ip address prefix-list CORP-SUBNETS
  set metric 50                    <span class="cm">! Set MED for BGP</span>

R2(config)# <span class="cmd">router bgp 65000</span>
R2(config-router)# <span class="cmd">redistribute ospf 1 route-map OSPF-TO-BGP</span>

<span class="cm">! Verify what BGP received</span>
R2# <span class="cmd">show bgp ipv4 unicast</span>
<span class="cm">! Only 192.168.x.x routes should appear — not other OSPF routes</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Use Route Map for BGP Inbound Policy (LP)</span><span class="step-sub">R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Set Local Preference based on received community</span></div><pre><span class="cm">! ISP sends routes with communities indicating their preference</span>
<span class="cm">! community 100:10 = high priority routes</span>
<span class="cm">! community 100:20 = backup routes</span>

ip community-list 1 permit 100:10
ip community-list 2 permit 100:20

route-map INBOUND-POLICY permit 10
  match community 1
  set local-preference 200          <span class="cm">! Prefer routes tagged 100:10</span>

route-map INBOUND-POLICY permit 20
  match community 2
  set local-preference 50           <span class="cm">! Low preference for backup routes</span>

route-map INBOUND-POLICY permit 30  <span class="cm">! Default — don't forget this!</span>

R2(config-router)# <span class="cmd">neighbor 10.0.0.2 route-map INBOUND-POLICY in</span>

<span class="cm">! After applying inbound route-map:</span>
R2# <span class="cmd">clear ip bgp 10.0.0.2 soft in</span>   <span class="cm">! Apply new inbound policy without resetting session</span>
R2# <span class="cmd">show bgp ipv4 unicast</span>           <span class="cm">! Verify LP values changed</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">AS-Path Access List for BGP Filtering</span><span class="step-sub">R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">AS-path access list — regex-based BGP filtering</span></div><pre><span class="cm">! ip as-path access-list uses regular expressions</span>
<span class="cm">! ^ = start, $ = end, _ = any delimiter (space, comma, start, end)</span>

<span class="cm">! Match routes originated by AS 100 only (single hop)</span>
ip as-path access-list 1 permit <span class="ip">^100$</span>

<span class="cm">! Match routes that PASSED THROUGH AS 200</span>
ip as-path access-list 2 permit <span class="ip">_200_</span>

<span class="cm">! Match routes originated locally (empty AS-path = originated here)</span>
ip as-path access-list 3 permit <span class="ip">^$</span>

<span class="cm">! Block routes from AS 65100 (competitor AS)</span>
ip as-path access-list 4 deny <span class="ip">_65100_</span>
ip as-path access-list 4 permit <span class="ip">.*</span>          <span class="cm">! permit everything else</span>

<span class="cm">! Apply to BGP neighbor</span>
R2(config-router)# <span class="cmd">neighbor 10.0.0.2 filter-list 4 in</span>

<span class="cm">! Verify AS-path filter</span>
R2# <span class="cmd">show ip bgp regexp ^100$</span>   <span class="cm">! Show routes matching the regex</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m8-interview">
<h3>Interview Questions — Route Maps and Prefix Lists</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between an ACL and a prefix list when used for route filtering?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>ACL for route matching:</strong> Matches on the network address only. Wildcard mask acts like a regular ACL wildcard — matching the bit pattern of the network. The mask length is not considered. A standard ACL for 10.1.1.0 with wildcard 0.0.0.255 would match 10.1.1.0/24 AND 10.1.1.0/28 AND 10.1.1.0/30 — all have the same network bits.</p><p><strong>Prefix list:</strong> Matches on BOTH the network address AND the prefix length. <code>permit 10.1.1.0/24</code> matches ONLY the exact /24 — not /28 or /30. You can also use <code>ge</code> (greater-or-equal) and <code>le</code> (less-or-equal) to match a range of prefix lengths. This is far more precise.</p><p><strong>Best practice:</strong> Always use prefix lists for route filtering in routing protocols and BGP. ACLs are for traffic filtering. Prefix lists were specifically designed for routing policy and are cleaner and less error-prone.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">A route-map has clauses at sequence 10, 20, and 30. What happens if a route matches clause 10 which has a deny action? Does it check clause 20?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>No. Route-map processing stops at the FIRST matching clause. If clause 10 matches and it's a <code>deny</code>, the route is denied and clauses 20 and 30 are never checked. This is the ordered, first-match processing model.</p><p><strong>Example:</strong><br>Clause 10: deny — match 192.168.1.0/24<br>Clause 20: permit — match 192.168.0.0/16<br>Clause 30: permit — no match (permit all)<br><br>A route 192.168.1.0/24 hits clause 10 → denied → done. Never reaches clause 20 (even though it also matches 192.168.0.0/16).<br>A route 192.168.5.0/24 doesn't match clause 10 → checks clause 20 → matches → permitted with no set actions.<br><br><strong>Implicit deny:</strong> If a route doesn't match ANY clause, it's denied by the implicit deny at the end. This is why you often need a final <code>permit</code> clause with no match statement — to allow all non-explicitly-matched routes through.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">You apply a route-map to a BGP neighbor. After the change, many routes disappear from the BGP table. The route-map only has permit clauses for specific prefixes. Why are other routes disappearing?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>This is the <strong>implicit deny</strong> at the end of every route-map. If a route-map only has specific permit clauses and a route doesn't match any of them, it hits the implicit deny and is rejected.</p><p><strong>The scenario:</strong> You have a route-map to set Local Preference on routes from ISP-A. You wrote:<br><code>route-map POLICY permit 10 → match ip address prefix-list IMPORTANT → set local-preference 200</code><br><br>Only routes matching IMPORTANT get through. All other routes from ISP-A are silently dropped by the implicit deny.</p><p><strong>Fix:</strong> Always add a final catch-all permit clause:<br><code>route-map POLICY permit 20</code> (no match, no set = match all, pass through unchanged)<br><br>This is one of the most common BGP misconfiguration issues. Always review your route-maps to ensure you have the correct final clause. Check with <code>show bgp summary</code> — if the prefix count drops after applying the route-map, check for missing permit clauses.</p></div></div>
</script>
<!-- ══════════════════ TOPIC 9: REDISTRIBUTION ══════════════════ -->
<script type="text/x-tmpl" id="m9-theory">
<h3>Route Redistribution — Connecting Routing Domains</h3>
<p>Redistribution takes routes learned by one routing protocol and injects them into another. Real networks often need this: merging companies, migration, legacy protocols, or connecting different domains.</p>
<h4>Seed Metric — Required on Import</h4>
<table class="tbl"><thead><tr><th>Redistributing Into</th><th>Default Behaviour</th><th>Solution</th></tr></thead><tbody>
<tr><td>OSPF</td><td>Default metric 20, Type E2</td><td>Specify: <code>metric [cost] metric-type [1|2]</code></td></tr>
<tr><td><strong>EIGRP</strong></td><td><strong>Infinite metric — routes NOT redistributed!</strong></td><td>Must specify 5-value metric: <code>metric bw delay reliability load mtu</code></td></tr>
<tr><td>RIP</td><td>Infinite — not redistributed</td><td><code>default-metric [1-15]</code></td></tr>
<tr><td>BGP</td><td>Metric = 0 (MED not set)</td><td><code>default-metric</code></td></tr>
</tbody></table>
<h4>Mutual Redistribution — The Loop Problem</h4>
<p>When redistributing in both directions (OSPF↔EIGRP), a route can travel: EIGRP → OSPF (via ASBR) → EIGRP (back into EIGRP with a different metric). Now EIGRP has two entries for the same prefix — the original and the redistributed one. If the redistributed one has a better metric, traffic loops.</p>
<div class="note r"><p><strong>Always use loop prevention in mutual redistribution.</strong> The two reliable methods are: route tagging (mark routes on entry, filter tagged routes on re-exit) and prefix lists (explicitly define what gets redistributed in each direction).</p></div>
<h4>Route Tagging — The Reliable Method</h4>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Tag-based loop prevention — complete example</span></div><pre><span class="cm">! ASBR sits between OSPF and EIGRP</span>
<span class="cm">! TAG 100 = "this route came from OSPF — don't send back to OSPF"</span>
<span class="cm">! TAG 200 = "this route came from EIGRP — don't send back to EIGRP"</span>

<span class="cm">!═══ Step 1: EIGRP → OSPF: Tag EIGRP routes as they enter OSPF ═══</span>
route-map EIGRP-INTO-OSPF deny 5
  match tag 100              <span class="cm">! Block routes that came FROM OSPF (tag 100)</span>
route-map EIGRP-INTO-OSPF permit 10
  set tag 200                <span class="cm">! Tag all others as "came from EIGRP"</span>

<span class="cm">!═══ Step 2: OSPF → EIGRP: Tag OSPF routes as they enter EIGRP ═══</span>
route-map OSPF-INTO-EIGRP deny 5
  match tag 200              <span class="cm">! Block routes that came FROM EIGRP (tag 200)</span>
route-map OSPF-INTO-EIGRP permit 10
  set tag 100                <span class="cm">! Tag all others as "came from OSPF"</span>

<span class="cm">!═══ Apply on ASBR ═══</span>
router ospf 1
  redistribute eigrp 100 subnets route-map EIGRP-INTO-OSPF
router eigrp 100
  redistribute ospf 1 metric 10000 100 255 1 1500 route-map OSPF-INTO-EIGRP</pre></div>
</script>

<script type="text/x-tmpl" id="m9-lab">
<h3>Lab 9 — Bidirectional Redistribution with Loop Prevention</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Redistribution — OSPF + EIGRP</span><span class="tbadge ccnp">CCNP</span></div><div class="topo-body">   <span class="lb">EIGRP AS 100</span>                                    <span class="lb">OSPF Area 0</span>
<span class="r">[ R1 ]</span>---<span class="ip">10.1.0.0/30</span>---<span class="r">[ R2/ASBR ]</span>---<span class="ip">10.0.0.0/30</span>---<span class="r">[ R3 ]</span>
<span class="ip">192.168.1.0/24</span>         <span class="lb">Redistribution</span>               <span class="ip">192.168.3.0/24</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Set Up EIGRP and OSPF Domains</span><span class="step-sub">R1, R2, R3</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Separate routing domains</span></div><pre><span class="cm">! R1 — EIGRP only</span>
R1(config)# <span class="cmd">router eigrp 100</span>
R1(config-router)# <span class="cmd">network 10.1.0.0 0.0.0.3</span>
R1(config-router)# <span class="cmd">network 192.168.1.0 0.0.0.255</span>
R1(config-router)# <span class="cmd">no auto-summary</span>

<span class="cm">! R2 — both EIGRP and OSPF (the ASBR)</span>
R2(config)# <span class="cmd">router eigrp 100</span>
R2(config-router)# <span class="cmd">network 10.1.0.0 0.0.0.3</span>   <span class="cm">! EIGRP side only</span>
R2(config-router)# <span class="cmd">no auto-summary</span>
R2(config)# <span class="cmd">router ospf 1</span>
R2(config-router)# <span class="cmd">router-id 2.2.2.2</span>
R2(config-router)# <span class="cmd">network 10.0.0.0 0.0.0.3 area 0</span>  <span class="cm">! OSPF side only</span>

<span class="cm">! R3 — OSPF only</span>
R3(config)# <span class="cmd">router ospf 1</span>
R3(config-router)# <span class="cmd">router-id 3.3.3.3</span>
R3(config-router)# <span class="cmd">network 10.0.0.0 0.0.0.3 area 0</span>
R3(config-router)# <span class="cmd">network 192.168.3.0 0.0.0.255 area 0</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Configure Bidirectional Redistribution with Tags</span><span class="step-sub">R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Full mutual redistribution with loop prevention</span></div><pre><span class="cm">! Create route maps with tag-based loop prevention</span>
R2(config)# <span class="cmd">route-map EIGRP-TO-OSPF deny 5</span>
R2(config-route-map)# <span class="cmd">match tag 100</span>         <span class="cm">! Block routes tagged as "from OSPF"</span>
R2(config)# <span class="cmd">route-map EIGRP-TO-OSPF permit 10</span>
R2(config-route-map)# <span class="cmd">set tag 200</span>            <span class="cm">! Tag EIGRP routes entering OSPF</span>

R2(config)# <span class="cmd">route-map OSPF-TO-EIGRP deny 5</span>
R2(config-route-map)# <span class="cmd">match tag 200</span>         <span class="cm">! Block routes tagged as "from EIGRP"</span>
R2(config)# <span class="cmd">route-map OSPF-TO-EIGRP permit 10</span>
R2(config-route-map)# <span class="cmd">set tag 100</span>            <span class="cm">! Tag OSPF routes entering EIGRP</span>

<span class="cm">! Apply redistribution</span>
R2(config)# <span class="cmd">router ospf 1</span>
R2(config-router)# <span class="cmd">redistribute eigrp 100 subnets metric 20 metric-type 2 route-map EIGRP-TO-OSPF</span>

R2(config)# <span class="cmd">router eigrp 100</span>
R2(config-router)# <span class="cmd">redistribute ospf 1 metric 10000 100 255 1 1500 route-map OSPF-TO-EIGRP</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Verify Redistribution and Loop Prevention</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Confirm correct routes and no loops</span></div><pre>R1# <span class="cmd">show ip route</span>
<span class="cm">! R1 (EIGRP domain) should see 192.168.3.0/24 as D EX (EIGRP external)</span>
<span class="cm">! D EX = EIGRP external = redistributed from another protocol</span>

R3# <span class="cmd">show ip route</span>
<span class="cm">! R3 (OSPF domain) should see 192.168.1.0/24 as O E2 (OSPF external Type 2)</span>

<span class="cm">! Verify tags are working</span>
R1# <span class="cmd">show ip route 192.168.3.0</span>
<span class="cm">! Check the route — should be D EX [170/...] via R2</span>
<span class="cm">! If R1 sees 192.168.3.0 as D (not D EX), loop prevention may have failed</span>

R2# <span class="cmd">show route-map</span>
<span class="cm">! Shows match/set statistics — check "matches" counters are incrementing</span>
<span class="cm">! The deny clauses should show hits when routes are being correctly filtered</span>

R1# <span class="cmd">ping 192.168.3.1 source 192.168.1.1</span>  <span class="cm">! End-to-end test</span>
R3# <span class="cmd">ping 192.168.1.1 source 192.168.3.1</span>  <span class="cm">! Return path test</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m9-interview">
<h3>Interview Questions — Redistribution</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Why must you always specify a metric when redistributing into EIGRP? What happens if you don't?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>EIGRP's composite metric requires specific values for bandwidth, delay, reliability, load, and MTU. When a route comes from an external source, EIGRP has no way to calculate these values automatically. If you redistribute without specifying a metric, EIGRP sets the metric to infinity (4,294,967,295) and the route is silently dropped — it never appears in the topology table or routing table. The redistribution appears to succeed but no routes actually get in.</p><p><strong>Correct syntax:</strong> <code>redistribute ospf 1 metric 10000 100 255 1 1500</code><br>(bandwidth kbps, delay 10μs, reliability, load, MTU)</p><p><strong>Alternative:</strong> Configure a default metric under the EIGRP process: <code>default-metric 10000 100 255 1 1500</code> — this applies to all redistribution into EIGRP.</p><p><strong>OSPF is different:</strong> Default metric for routes redistributed into OSPF is 20 (Type E2). So redistribution into OSPF works without specifying a metric, though you should specify it explicitly for control.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">After configuring mutual redistribution between OSPF and EIGRP, you notice that routes are being suboptimally routed. R1 (EIGRP) has a direct path to 10.5.0.0/24 with metric 28,160 but is using a longer path via the OSPF domain with metric 170/5000. Why?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>This is a metric comparison issue between native EIGRP routes and redistributed routes.</p><p><strong>What's happening:</strong> 10.5.0.0/24 is being redistributed from OSPF into EIGRP with a seed metric (e.g., 10000 100 255 1 1500 = metric ~5000). This metric is lower than the native EIGRP path's metric of 28,160. EIGRP picks the lower metric — the redistributed path wins even though it's longer physically.</p><p><strong>Fix options:</strong><br>1. <strong>Increase seed metric for redistribution:</strong> Use a higher metric when redistributing OSPF into EIGRP so native EIGRP paths always win: <code>metric 100 10000 255 1 1500</code> (reduces bandwidth → higher metric)<br>2. <strong>Use route tags + prefer native routes:</strong> Tag redistributed routes and set higher administrative distance for them with <code>distance</code> command<br>3. <strong>Use prefix lists:</strong> Don't redistribute routes that already exist in the native protocol — only redistribute routes unique to each domain<br>4. <strong>Metric type for OSPF E1 vs E2:</strong> Use E1 (adds internal OSPF cost) so redistributed routes reflect actual distance</p></div></div>
</script>

<!-- ══════════════════ TOPIC 10: PATH CONTROL (PBR + SUMMARISATION + IP SLA) ══════════════════ -->
<script type="text/x-tmpl" id="m10-theory">
<h3>Path Control — Summarisation, PBR, and IP SLA</h3>
<h4>Route Summarisation</h4>
<p>Summarisation aggregates multiple specific prefixes into one larger prefix. Fewer routes = smaller tables, faster convergence, topology changes stay hidden.</p>
<div class="cb"><div class="ch"><span class="lg out">Binary</span><span class="fn">Calculate summary for 192.168.0–3.x</span></div><pre>192.168.0.0 = 11000000.10101000.0000<span class="hl">00</span>00.xxxxxxxx
192.168.1.0 = 11000000.10101000.0000<span class="hl">00</span>01.xxxxxxxx
192.168.2.0 = 11000000.10101000.0000<span class="hl">00</span>10.xxxxxxxx
192.168.3.0 = 11000000.10101000.0000<span class="hl">00</span>11.xxxxxxxx
                                 <span class="hl">^^ 22 bits match</span>
Summary = 192.168.0.0/<span class="hl">22</span> = 255.255.252.0</pre></div>
<table class="tbl"><thead><tr><th>Protocol</th><th>Command</th><th>Where</th></tr></thead><tbody>
<tr><td>OSPF (inter-area)</td><td><code>area X range [net] [mask]</code></td><td>ABR only</td></tr>
<tr><td>OSPF (external)</td><td><code>summary-address [net] [mask]</code></td><td>ASBR only</td></tr>
<tr><td>EIGRP</td><td><code>ip summary-address eigrp [AS] [net] [mask]</code></td><td>Interface config</td></tr>
<tr><td>BGP</td><td><code>aggregate-address [net] [mask] [summary-only]</code></td><td>Router BGP</td></tr>
</tbody></table>
<h4>Policy-Based Routing (PBR)</h4>
<p>Normal routing uses only the destination IP. PBR overrides the routing table based on source IP, protocol, port, or DSCP — for any traffic the ACL can match.</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">PBR — route VoIP different from data</span></div><pre><span class="cm">! Match VoIP traffic (source VLAN 10)</span>
ip access-list standard VOIP-TRAFFIC
  permit <span class="ip">192.168.10.0 0.0.0.255</span>

<span class="cm">! Route-map: VoIP → ISP-A, everything else → normal routing</span>
route-map PBR-POLICY permit 10
  match ip address VOIP-TRAFFIC
  set ip next-hop verify-availability <span class="ip">10.1.1.1</span> 1 track 1  <span class="cm">! Only if ISP-A is reachable</span>
route-map PBR-POLICY permit 20   <span class="cm">! All other traffic → normal routing</span>

<span class="cm">! Apply to INCOMING interface (where traffic enters)</span>
interface gi0/0
  ip policy route-map PBR-POLICY

<span class="cm">! Verify</span>
R1# <span class="cmd">show ip policy</span>           <span class="cm">! Which interfaces have PBR</span>
R1# <span class="cmd">show route-map PBR-POLICY</span> <span class="cm">! Hit counters per clause</span></pre></div>
<h4>IP SLA — Monitoring and Tracking for Reliable Failover</h4>
<p>IP SLA sends synthetic test packets (ICMP, UDP, TCP) to verify path availability. Combined with Object Tracking, it can trigger route failover more reliably than just monitoring interface state (which may stay "up" even if the far-end is broken).</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">IP SLA + tracking — reliable failover</span></div><pre><span class="cm">! Create IP SLA probe — ping 8.8.8.8 via ISP-A every 5 seconds</span>
R1(config)# <span class="cmd">ip sla 1</span>
R1(config-ip-sla)# <span class="cmd">icmp-echo 8.8.8.8 source-interface gi0/1</span>
R1(config-ip-sla-echo)# <span class="cmd">frequency 5</span>       <span class="cm">! Test every 5 seconds</span>
R1(config)# <span class="cmd">ip sla schedule 1 life forever start-time now</span>

<span class="cm">! Create tracking object — track 1 = "up if IP SLA 1 is reachable"</span>
R1(config)# <span class="cmd">track 1 ip sla 1 reachability</span>

<span class="cm">! Static route that activates only when track 1 is Up</span>
R1(config)# <span class="cmd">ip route 0.0.0.0 0.0.0.0 10.1.1.1 track 1</span>
<span class="cm">! If ISP-A becomes unreachable → track 1 goes Down → route removed</span>
<span class="cm">! Backup static (higher AD) activates automatically</span>

R1# <span class="cmd">show ip sla statistics 1</span>    <span class="cm">! SLA results — success/failure counts</span>
R1# <span class="cmd">show track 1</span>               <span class="cm">! Track state: Up or Down</span></pre></div>
</script>

<script type="text/x-tmpl" id="m10-lab">
<h3>Lab 10 — Summarisation, PBR, and IP SLA Tracking</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Path Control Lab</span><span class="tbadge ccnp">CCNP</span></div><div class="topo-body">          <span class="r">[ ISP-A ]</span> 8.8.8.8                   <span class="r">[ ISP-B ]</span>
           <span class="ln">|</span> 10.1.1.0/30                         <span class="ln">|</span> 10.2.2.0/30
           <span class="ln">|</span>                                    <span class="ln">|</span>
         <span class="r">[ EDGE-R ]</span> Gi0/0 Gi0/1 Gi0/2 (LAN)
                    <span class="lb">PBR: VoIP → ISP-A, Data → ISP-B</span>
                    <span class="ip">192.168.10.0/24 (VoIP VLAN)</span>
                    <span class="ip">192.168.20.0/24 (Data VLAN)</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">IP SLA with Tracking and Conditional Static Route</span><span class="step-sub">EDGE-R</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">IP SLA probes both ISPs — conditional failover</span></div><pre><span class="cm">! SLA 1 — test ISP-A reachability</span>
EDGE-R(config)# <span class="cmd">ip sla 1</span>
EDGE-R(config-ip-sla)# <span class="cmd">icmp-echo 8.8.8.8 source-interface gi0/0</span>
EDGE-R(config-ip-sla-echo)# <span class="cmd">threshold 500</span>       <span class="cm">! Fail if RTT > 500ms</span>
EDGE-R(config-ip-sla-echo)# <span class="cmd">frequency 10</span>
EDGE-R(config)# <span class="cmd">ip sla schedule 1 life forever start-time now</span>

<span class="cm">! Track object 1 = "is ISP-A up?"</span>
EDGE-R(config)# <span class="cmd">track 1 ip sla 1 reachability</span>
EDGE-R(config-track)# <span class="cmd">delay down 10 up 5</span>   <span class="cm">! Debounce: 10s to declare down, 5s to come up</span>

<span class="cm">! Primary default route via ISP-A — only active when Track 1 is Up</span>
EDGE-R(config)# <span class="cmd">ip route 0.0.0.0 0.0.0.0 10.1.1.2 10 track 1</span>
<span class="cm">! AD=10, conditional on track 1</span>

<span class="cm">! Backup default route via ISP-B — always active but higher AD</span>
EDGE-R(config)# <span class="cmd">ip route 0.0.0.0 0.0.0.0 10.2.2.2 200</span>
<span class="cm">! AD=200 — only used when primary (AD 10) disappears</span>

EDGE-R# <span class="cmd">show track 1</span>
EDGE-R# <span class="cmd">show ip sla statistics 1</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">PBR for Traffic Splitting with Verify-Availability</span><span class="step-sub">EDGE-R</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Smart PBR — only policy if path is available</span></div><pre><span class="cm">! Match traffic by source VLAN</span>
EDGE-R(config)# <span class="cmd">ip access-list standard VOIP-VLAN</span>
EDGE-R(config-std-nacl)# <span class="cmd">permit 192.168.10.0 0.0.0.255</span>
EDGE-R(config)# <span class="cmd">ip access-list standard DATA-VLAN</span>
EDGE-R(config-std-nacl)# <span class="cmd">permit 192.168.20.0 0.0.0.255</span>

<span class="cm">! Route-map with verify-availability — uses track object</span>
EDGE-R(config)# <span class="cmd">route-map SPLIT-TRAFFIC permit 10</span>
EDGE-R(config-route-map)# <span class="cmd">match ip address VOIP-VLAN</span>
EDGE-R(config-route-map)# <span class="cmd">set ip next-hop verify-availability 10.1.1.2 1 track 1</span>
<span class="cm">! If ISP-A (track 1) is down → don't use this clause → fall to clause 20</span>

EDGE-R(config)# <span class="cmd">route-map SPLIT-TRAFFIC permit 20</span>
EDGE-R(config-route-map)# <span class="cmd">match ip address DATA-VLAN</span>
EDGE-R(config-route-map)# <span class="cmd">set ip next-hop 10.2.2.2</span>    <span class="cm">! Data always via ISP-B</span>

EDGE-R(config)# <span class="cmd">route-map SPLIT-TRAFFIC permit 30</span>  <span class="cm">! Permit all remaining</span>

EDGE-R(config)# <span class="cmd">interface gi0/2</span>
EDGE-R(config-if)# <span class="cmd">ip policy route-map SPLIT-TRAFFIC</span>

EDGE-R# <span class="cmd">show route-map SPLIT-TRAFFIC</span>  <span class="cm">! Hit counters</span>
EDGE-R# <span class="cmd">debug ip policy</span>              <span class="cm">! Live PBR decisions</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m10-interview">
<h3>Interview Questions — Path Control</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is a Null0 route and why is it automatically created when you summarise?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>A Null0 route is a virtual discard interface — any traffic sent to Null0 is dropped with an ICMP Unreachable reply. When a router creates a summary route, IOS automatically installs a Null0 route for the summary prefix at AD 5 (for EIGRP) or AD 110 (for OSPF).</p><p><strong>Why it's needed — the loop scenario:</strong> R1 summarises 10.0.0.0/8 and advertises it to R2. R1 has specific routes for 10.1.1.0/24 and 10.2.2.0/24, but NOT 10.99.99.0/24. If a packet for 10.99.99.1 arrives, R1 has no specific route and might forward it via a default route → R2 receives it → R2 routes it back to R1 (because R1 advertised the /8) → routing loop.</p><p><strong>Null0 prevents this:</strong> R1's Null0 route for 10.0.0.0/8 is more specific than the default. Packets for 10.99.99.1 match 10.0.0.0/8 → Null0 → dropped. No loop. ICMP Unreachable sent to source.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between "set ip next-hop" and "set ip default next-hop" in PBR?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Both are used in PBR route-maps but they interact with the routing table differently:</p><p><strong>set ip next-hop [ip]:</strong> Always uses the specified next-hop for matched traffic, OVERRIDING the routing table completely. Even if the routing table has a more specific route, PBR takes precedence.</p><p><strong>set ip default next-hop [ip]:</strong> Only uses the specified next-hop if the routing table has NO match for the destination (falls back to default route). If the routing table already has a specific route, that route is used instead.</p><p><strong>Practical example:</strong> You want VoIP to go via ISP-A. If you use <code>set ip next-hop 10.1.1.1</code>, ALL VoIP traffic goes via ISP-A regardless. If you use <code>set ip default next-hop 10.1.1.1</code>, VoIP traffic uses ISP-A only if there's no more specific route — if a specific route exists in the table for that destination, it wins.</p><p><strong>Most common mistake:</strong> Using <code>set ip default next-hop</code> when you want unconditional forwarding — policy appears to not work because the routing table has existing routes that override it.</p></div></div>
</script>
<!-- ══════════════════ TOPIC 11: IPv6 ROUTING ══════════════════ -->
<script type="text/x-tmpl" id="m11-theory">
<h3>IPv6 Routing — OSPFv3, EIGRPv6, and Static</h3>
<p>IPv6 uses 128-bit addresses in hexadecimal. The routing protocols you know have IPv6 versions with identical concepts and different syntax. IPv6 routing must be enabled globally before any IPv6 routing works.</p>
<h4>IPv6 Address Types</h4>
<table class="tbl"><thead><tr><th>Type</th><th>Prefix</th><th>Purpose</th></tr></thead><tbody>
<tr><td>Global Unicast</td><td>2000::/3</td><td>Routable on internet — equivalent to public IPv4</td></tr>
<tr><td>Link-Local</td><td>FE80::/10</td><td>Auto-configured on every interface. Not routed. Used by routing protocols for neighbour discovery and hellos.</td></tr>
<tr><td>Unique Local</td><td>FC00::/7</td><td>Private — like RFC1918. Not routed on internet.</td></tr>
<tr><td>Multicast</td><td>FF00::/8</td><td>One-to-many — replaces IPv4 broadcast</td></tr>
<tr><td>Loopback</td><td>::1/128</td><td>Equivalent to 127.0.0.1</td></tr>
<tr><td>Solicited-Node Multicast</td><td>FF02::1:FF00:0/104</td><td>Used by NDP (Neighbour Discovery — replaces ARP)</td></tr>
</tbody></table>
<h4>Key IPv6 Routing Differences</h4>
<ul>
<li><strong>Must enable first:</strong> <code>ipv6 unicast-routing</code> globally — nothing works without this</li>
<li><strong>Link-local always present:</strong> Auto-configured (EUI-64 or random) on every IPv6 interface. Routing protocols use link-local for peering</li>
<li><strong>No ARP:</strong> Replaced by NDP (Neighbour Discovery Protocol)</li>
<li><strong>No broadcast:</strong> Multicast used instead (e.g., FF02::5 = all OSPF routers, FF02::A = all EIGRP routers)</li>
<li><strong>OSPFv3 uses link-local addresses for hellos</strong> (not global unicast)</li>
<li><strong>Router ID still 32-bit:</strong> Even in IPv6, OSPF/EIGRP Router IDs are 32-bit values (dotted-decimal format). Must be explicitly set if no IPv4 address exists</li>
</ul>
<h4>OSPFv3 — OSPF for IPv6</h4>
<p>OSPFv3 is the IPv6 version of OSPF. Same areas, same DR/BDR, same SPF algorithm. New LSA types for IPv6 (Type 8 = Link LSA, Type 9 = Intra-Area-Prefix LSA). Uses link-local addresses for hello packets.</p>
<h4>EIGRPv6 — EIGRP for IPv6</h4>
<p>Same DUAL algorithm, same feasibility condition, same neighbour relationships. Enabled per-interface (not via network statement). Uses FF02::A multicast. Named mode is preferred (address-family ipv6).</p>
<h4>IPv6 Static Routes</h4>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">IPv6 static route examples</span></div><pre><span class="cm">! Standard static route</span>
R1(config)# <span class="cmd">ipv6 route 2001:db8:3::/64 2001:db8:12::2</span>

<span class="cm">! Using link-local next-hop — MUST specify interface</span>
R1(config)# <span class="cmd">ipv6 route 2001:db8:3::/64 GigabitEthernet0/0 FE80::2</span>

<span class="cm">! IPv6 default route</span>
R1(config)# <span class="cmd">ipv6 route ::/0 2001:db8:12::2</span></pre></div>
</script>

<script type="text/x-tmpl" id="m11-lab">
<h3>Lab 11 — OSPFv3 and EIGRPv6 Configuration</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">IPv6 Routing Lab</span><span class="tbadge ccnp">CCNP</span></div><div class="topo-body"><span class="r">[ R1 ]</span>---<span class="ip">2001:db8:12::/64</span>---<span class="r">[ R2 ]</span>---<span class="ip">2001:db8:23::/64</span>---<span class="r">[ R3 ]</span>
<span class="ip">Lo0:2001:db8:1::1/128</span>   <span class="ip">Lo0:2001:db8:2::2/128</span>   <span class="ip">Lo0:2001:db8:3::3/128</span>
<span class="ip">LAN:2001:db8:100::/64</span>                               <span class="ip">LAN:2001:db8:300::/64</span>
<span class="lb">All in OSPFv3 Area 0 — R1 and R2 also run EIGRPv6 on their link</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Enable IPv6 and Configure Addresses</span><span class="step-sub">R1, R2, R3</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R1 — enable IPv6 routing and configure addresses</span></div><pre><span class="cm">! FIRST: Enable IPv6 routing globally — MANDATORY</span>
R1(config)# <span class="cmd">ipv6 unicast-routing</span>

R1(config)# <span class="cmd">interface loopback 0</span>
R1(config-if)# <span class="cmd">ipv6 address 2001:db8:1::1/128</span>

R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">ipv6 address 2001:db8:12::1/64</span>
R1(config-if)# <span class="cmd">no shutdown</span>

R1(config)# <span class="cmd">interface gi0/1</span>
R1(config-if)# <span class="cmd">ipv6 address 2001:db8:100::1/64</span>
R1(config-if)# <span class="cmd">no shutdown</span>

<span class="cm">! Link-local is auto-configured — check it</span>
R1# <span class="cmd">show ipv6 interface gi0/0</span>
<span class="cm">! Shows: Link-Local address FE80::xxxx — this is used for OSPF hellos</span>
R1# <span class="cmd">show ipv6 interface brief</span>   <span class="cm">! Summary of all IPv6 interfaces</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Configure OSPFv3 (Modern Address-Family Method)</span><span class="step-sub">R2, R3</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">OSPFv3 — address-family method (recommended)</span></div><pre><span class="cm">! R2 — OSPFv3 using address-family (modern IOS)</span>
R2(config)# <span class="cmd">router ospfv3 1</span>
R2(config-router)# <span class="cmd">router-id 2.2.2.2</span>   <span class="cm">! RID must be 32-bit even for IPv6</span>
R2(config-router)# <span class="cmd">address-family ipv6 unicast</span>
R2(config-router-af)# <span class="cmd">exit-address-family</span>

<span class="cm">! Apply OSPFv3 to interfaces</span>
R2(config)# <span class="cmd">interface gi0/0</span>
R2(config-if)# <span class="cmd">ospfv3 1 ipv6 area 0</span>

R2(config)# <span class="cmd">interface gi0/1</span>
R2(config-if)# <span class="cmd">ospfv3 1 ipv6 area 0</span>

<span class="cm">! R3 — same pattern</span>
R3(config)# <span class="cmd">router ospfv3 1</span>
R3(config-router)# <span class="cmd">router-id 3.3.3.3</span>
R3(config)# <span class="cmd">interface gi0/0</span>
R3(config-if)# <span class="cmd">ospfv3 1 ipv6 area 0</span>
R3(config)# <span class="cmd">interface gi0/1</span>
R3(config-if)# <span class="cmd">ospfv3 1 ipv6 area 0</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Configure EIGRPv6 Named Mode (R1–R2)</span><span class="step-sub">R1, R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">EIGRPv6 in Named Mode — address-family ipv6</span></div><pre><span class="cm">! R1 — EIGRPv6 named mode</span>
R1(config)# <span class="cmd">router eigrp COMPANY</span>
R1(config-router)# <span class="cmd">address-family ipv6 unicast autonomous-system 100</span>
R1(config-router-af)# <span class="cmd">eigrp router-id 1.1.1.1</span>
R1(config-router-af)# <span class="cmd">af-interface gi0/0</span>
R1(config-router-af-interface)# <span class="cmd">no shutdown</span>   <span class="cm">! EIGRPv6 interfaces need explicit enable</span>
R1(config-router-af)# <span class="cmd">exit-address-family</span>

<span class="cm">! Note: EIGRPv6 uses no "network" statement — active on all IPv6 interfaces</span>
<span class="cm">! Use "shutdown" under af-interface to exclude an interface</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">4</span><span class="step-title">Verify IPv6 Routing</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">IPv6 verification commands</span></div><pre>R1# <span class="cmd">show ipv6 ospf neighbor</span>
<span class="cm">! Neighbours shown with Link-Local address, not global unicast</span>
<span class="cm">! Should be FULL state (same as OSPFv2)</span>

R1# <span class="cmd">show ipv6 route ospf</span>
<span class="cm">! Routes marked OI (inter-area) or O (intra-area)</span>
<span class="cm">! Next-hop will be Link-Local address of neighbour</span>

R1# <span class="cmd">show ipv6 eigrp neighbors</span>   <span class="cm">! EIGRPv6 neighbours</span>
R1# <span class="cmd">show ipv6 eigrp topology</span>    <span class="cm">! EIGRPv6 topology table</span>
R1# <span class="cmd">show ipv6 route</span>             <span class="cm">! Combined IPv6 routing table</span>

R1# <span class="cmd">ping 2001:db8:300::1</span>         <span class="cm">! IPv6 ping</span>
R1# <span class="cmd">traceroute 2001:db8:300::1</span>  <span class="cm">! IPv6 traceroute</span>

<span class="cm">! IPv6 specific NDP commands</span>
R1# <span class="cmd">show ipv6 neighbors</span>         <span class="cm">! Like "show ip arp" — NDP cache</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m11-interview">
<h3>Interview Questions — IPv6 Routing</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is a link-local address in IPv6 and why do routing protocols use it instead of global unicast for neighbour peering?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>A link-local address (prefix FE80::/10) is automatically assigned to every interface when IPv6 is enabled. It is valid only on the local link and is never routed beyond it.</p><p><strong>Why routing protocols prefer link-local for peering:</strong><br>• Always present — even if no global unicast address is configured, link-local exists<br>• Stable — doesn't change if the global address changes (renumbering scenario)<br>• Simple — no need to know what global subnet the neighbour uses<br>• Routing protocol hellos (OSPF, EIGRP) are link-local scope by design — they should never leave the link anyway</p><p><strong>Implication for static routes:</strong> If you use a link-local as next-hop, you MUST specify the exit interface because the router can't determine which interface the link-local belongs to just from the address: <code>ipv6 route 2001:db8:3::/64 GigabitEthernet0/0 FE80::2</code></p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">OSPFv3 is configured on R1 and R2. "show ipv6 ospf neighbor" shows empty output on R1. Both routers have global unicast IPv6 addresses configured and can ping each other. What is likely wrong?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Several common causes — check in order:</p><ul><li><strong>ipv6 unicast-routing missing:</strong> Without <code>ipv6 unicast-routing</code> globally, IPv6 routing is disabled. The router won't process OSPFv3 hellos even if the interface has an IPv6 address. Check: <code>show running-config | include ipv6 unicast-routing</code></li><li><strong>OSPFv3 not applied to interface:</strong> Modern OSPFv3 requires <code>ospfv3 1 ipv6 area 0</code> on each interface. Unlike OSPFv2 with the network statement, OSPFv3 is interface-activated. Check: <code>show ipv6 ospf interface gi0/0</code> — does it show OSPFv3 is enabled?</li><li><strong>Router ID not set — no IPv4 address exists:</strong> OSPFv3 still requires a 32-bit Router ID. If no IPv4 address exists on the router, OSPFv3 can't auto-derive an RID. Must manually configure: <code>router-id 1.1.1.1</code> under <code>router ospfv3 1</code></li><li><strong>Area mismatch:</strong> R1 has interface in area 0, R2 in area 1 — they won't form adjacency. Check both sides with <code>show ipv6 ospf interface</code></li></ul></div></div>
</script>
