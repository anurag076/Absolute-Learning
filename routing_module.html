<!-- ══════════════════ TOPIC 1: ROUTING FUNDAMENTALS ══════════════════ -->
<script type="text/x-tmpl" id="m1-theory">
<h3>How Routing Works — The Complete Picture</h3>
<p>Every router has one job: receive a packet, look up the destination IP in the routing table, forward the packet out the right interface. Everything in routing theory is either explaining <em>how routes get into the table</em> or <em>how the best route is selected</em>.</p>
<h4>The Routing Table — Reading It Like a Pro</h4>
<div class="cb"><div class="ch"><span class="lg out">IOS</span><span class="fn">show ip route — annotated</span></div><pre>R1# <span class="cmd">show ip route</span>
Codes: <span class="st">C</span> - connected, <span class="st">S</span> - static, <span class="hl">R</span> - RIP,
       <span class="cmd">O</span> - OSPF, <span class="rt">D</span> - EIGRP, <span class="kw">B</span> - BGP
       <span class="cm">i - IS-IS, L - local, * - candidate default</span>

Gateway of last resort is <span class="ip">10.0.0.1</span> to network <span class="ip">0.0.0.0</span>

<span class="st">C</span>     <span class="ip">10.1.1.0/24</span>  is directly connected, GigabitEthernet0/0
<span class="st">L</span>     <span class="ip">10.1.1.1/32</span>  is directly connected, GigabitEthernet0/0
<span class="hl">R</span>     <span class="ip">10.2.2.0/24</span>  [<span class="hl">120/2</span>] via <span class="ip">10.1.1.2</span>, 00:00:25, GigabitEthernet0/0
<span class="cmd">O</span>     <span class="ip">10.3.3.0/24</span>  [<span class="cmd">110/20</span>] via <span class="ip">10.1.1.3</span>, 00:14:12, GigabitEthernet0/0
<span class="rt">D</span>     <span class="ip">10.4.4.0/24</span>  [<span class="rt">90/2170112</span>] via <span class="ip">10.1.1.4</span>, 00:05:44, GigabitEthernet0/0
<span class="kw">B</span>     <span class="ip">10.5.5.0/24</span>  [<span class="kw">20</span>/0] via <span class="ip">10.1.1.5</span>, 00:01:33
<span class="st">S*</span>    <span class="ip">0.0.0.0/0</span>    [<span class="st">1</span>/0] via <span class="ip">10.0.0.1</span>

<span class="cm">Format: [AD/Metric] via next-hop, age, interface</span></pre></div>
<h4>Administrative Distance (AD) — Source Trustworthiness</h4>
<p>When the same prefix is learned from multiple sources, AD decides which route enters the routing table. Lower AD = more trusted = wins.</p>
<table class="tbl"><thead><tr><th>Source</th><th>AD</th><th>Memory Tip</th></tr></thead><tbody>
<tr><td>Directly Connected</td><td><strong>0</strong></td><td>You're physically on it — zero doubt</td></tr>
<tr><td>Static Route</td><td><strong>1</strong></td><td>Admin manually configured it</td></tr>
<tr><td>EIGRP Summary</td><td><strong>5</strong></td><td>Special case — EIGRP auto-summary</td></tr>
<tr><td>eBGP</td><td><strong>20</strong></td><td>External BGP — internet routing</td></tr>
<tr><td>EIGRP Internal</td><td><strong>90</strong></td><td>EIGRP best paths in same AS</td></tr>
<tr><td>IGRP</td><td><strong>100</strong></td><td>Legacy Cisco — retired</td></tr>
<tr><td>OSPF</td><td><strong>110</strong></td><td>Open standard — very common</td></tr>
<tr><td>IS-IS</td><td><strong>115</strong></td><td>SP protocol, common at ISPs</td></tr>
<tr><td>RIP</td><td><strong>120</strong></td><td>Old, hop-count only</td></tr>
<tr><td>EIGRP External</td><td><strong>170</strong></td><td>Redistributed into EIGRP</td></tr>
<tr><td>iBGP</td><td><strong>200</strong></td><td>Internal BGP — within your AS</td></tr>
<tr><td>Unknown / Unreachable</td><td><strong>255</strong></td><td>Never used — effectively infinite</td></tr>
</tbody></table>
<h4>Longest Prefix Match — The Forwarding Decision</h4>
<p>AD decides which routes GET INTO the table. Longest prefix match decides which route IS USED to forward a packet. The router picks the route with the most specific (longest) match.</p>
<div class="cb"><div class="ch"><span class="lg out">Example</span><span class="fn">Routing table has these four routes</span></div><pre>S     <span class="ip">0.0.0.0/0</span>   via 1.1.1.1   <span class="cm">← matches EVERYTHING (default)</span>
O     <span class="ip">10.0.0.0/8</span>  via 2.2.2.2   <span class="cm">← matches 10.x.x.x</span>
D     <span class="ip">10.1.0.0/16</span> via 3.3.3.3   <span class="cm">← matches 10.1.x.x</span>
B     <span class="ip">10.1.1.0/24</span> via 4.4.4.4   <span class="cm">← matches 10.1.1.x</span>

Packet destined to <span class="ip">10.1.1.50</span>:
→ Matches /0, /8, /16, /24 — router picks <span class="hl">/24 (most specific)</span> → via 4.4.4.4

Packet destined to <span class="ip">10.1.5.10</span>:
→ Matches /0, /8, /16 — router picks <span class="hl">/16</span> → via 3.3.3.3

Packet destined to <span class="ip">172.16.1.1</span>:
→ Only matches /0 — router picks <span class="hl">default route</span> → via 1.1.1.1</pre></div>
<h4>How Routes Enter the Table — Three Methods</h4>
<div class="g3">
  <div class="card"><h5>Connected (C/L)</h5><p>Automatic. When interface is assigned an IP and brought up with <code>no shutdown</code>. C = network, L = host /32 route for the interface IP itself. AD = 0.</p></div>
  <div class="card y"><h5>Static (S)</h5><p>Manual. Admin types <code>ip route</code>. Stays until removed. Doesn't adapt to failures. AD = 1 by default.</p></div>
  <div class="card g"><h5>Dynamic (R/O/D/B)</h5><p>Automatic via a routing protocol. Adapts to topology changes. Scalable. Different protocols have different AD values and metrics.</p></div>
</div>
<h4>Metric — Choosing Among Routes from Same Protocol</h4>
<p>When multiple routes to the same destination are learned from the <em>same protocol</em>, metric determines the best one. Each protocol uses a different metric.</p>
<table class="tbl"><thead><tr><th>Protocol</th><th>Metric</th><th>Lower or Higher is Better?</th></tr></thead><tbody>
<tr><td>RIP</td><td>Hop count (max 15)</td><td>Lower is better</td></tr>
<tr><td>OSPF</td><td>Cost (100Mbps / BW)</td><td>Lower is better</td></tr>
<tr><td>EIGRP</td><td>Composite (BW + Delay)</td><td>Lower is better</td></tr>
<tr><td>BGP</td><td>AS-Path length + attributes</td><td>Depends on attribute</td></tr>
<tr><td>IS-IS</td><td>Wide metric (default 10/link)</td><td>Lower is better</td></tr>
</tbody></table>
<div class="note y"><p><strong>AD vs Metric:</strong> AD compares routes from <em>different protocols</em>. Metric compares routes from the <em>same protocol</em>. AD happens first. Only if two routes from the same protocol compete does metric matter.</p></div>
</script>

<script type="text/x-tmpl" id="m1-lab">
<h3>Lab 1 — Reading and Analysing the Routing Table</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Lab Topology</span><span class="tbadge ccna">CCNA</span></div><div class="topo-body"><span class="r">[ R1 ]</span>---<span class="ip">10.0.12.0/30</span>---<span class="r">[ R2 ]</span>---<span class="ip">10.0.23.0/30</span>---<span class="r">[ R3 ]</span>
<span class="ip">Lo0:1.1.1.1/32</span>          <span class="ip">Lo0:2.2.2.2/32</span>          <span class="ip">Lo0:3.3.3.3/32</span>
<span class="ip">LAN:192.168.1.0/24</span>       <span class="ip">LAN:192.168.2.0/24</span>       <span class="ip">LAN:192.168.3.0/24</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Configure Interfaces and Verify Connected Routes</span><span class="step-sub">R1, R2, R3</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R1 — interface setup + loopback</span></div><pre>R1(config)# <span class="cmd">interface loopback 0</span>
R1(config-if)# <span class="cmd">ip address 1.1.1.1 255.255.255.255</span>
R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">ip address 192.168.1.1 255.255.255.0</span>
R1(config-if)# <span class="cmd">no shutdown</span>
R1(config)# <span class="cmd">interface gi0/1</span>
R1(config-if)# <span class="cmd">ip address 10.0.12.1 255.255.255.252</span>
R1(config-if)# <span class="cmd">no shutdown</span>
R1(config-if)# <span class="cmd">end</span>

<span class="cm">! Routing table — only connected routes appear at this stage</span>
R1# <span class="cmd">show ip route</span>
<span class="cm">! C = network route, L = local /32 host route (your IP)</span>
<span class="cm">! "Gateway of last resort is not set" — no default route yet</span>

R1# <span class="cmd">show ip route connected</span>  <span class="cm">! Filter: only connected</span>
R1# <span class="cmd">show ip interface brief</span>  <span class="cm">! Verify all interfaces up/up</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Add Static Routes and Observe AD in Action</span><span class="step-sub">R1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Add static routes and see AD comparison</span></div><pre><span class="cm">! Static route to R3's LAN (goes through R2)</span>
R1(config)# <span class="cmd">ip route 192.168.3.0 255.255.255.0 10.0.12.2</span>

<span class="cm">! Now add OSPF on same link (we'll study OSPF later, just observe AD)</span>
<span class="cm">! If OSPF also learns 192.168.3.0/24, static AD=1 wins over OSPF AD=110</span>
<span class="cm">! The OSPF route exists but is not installed (AD comparison)</span>

R1# <span class="cmd">show ip route 192.168.3.0</span>
<span class="cm">! Shows: S 192.168.3.0/24 [1/0] via 10.0.12.2</span>
<span class="cm">! The [1/0] = [AD/Metric]</span>

<span class="cm">! Simulate floating static (backup) — AD higher than any protocol</span>
R1(config)# <span class="cmd">ip route 192.168.3.0 255.255.255.0 10.0.12.2 210</span>
<span class="cm">! AD 210 — only activates if all lower-AD routes disappear</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Demonstrate Longest Prefix Match</span><span class="step-sub">R1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Prove longest prefix match with overlapping routes</span></div><pre><span class="cm">! Create overlapping static routes to prove longest prefix match</span>
R1(config)# <span class="cmd">ip route 10.0.0.0 255.0.0.0 10.0.12.2</span>        <span class="cm">! /8 via R2</span>
R1(config)# <span class="cmd">ip route 10.99.99.0 255.255.255.0 10.0.12.2</span>  <span class="cm">! /24 via R2</span>

<span class="cm">! Check what route is used for 10.99.99.5</span>
R1# <span class="cmd">show ip route 10.99.99.5</span>
<span class="cm">! Shows: 10.99.99.0/24 — /24 wins (more specific than /8)</span>

<span class="cm">! Check what route is used for 10.55.55.5</span>
R1# <span class="cmd">show ip route 10.55.55.5</span>
<span class="cm">! Shows: 10.0.0.0/8 — only /8 matches</span>

<span class="cm">! The "show ip route [ip]" command is your best friend for troubleshooting</span>
<span class="cm">! It shows EXACTLY which route the router will use for that destination</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m1-interview">
<h3>Interview Questions — Routing Fundamentals</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">A router has OSPF (AD 110) and EIGRP (AD 90) both advertising 10.5.0.0/16. Which route appears in the routing table and why? What happens to the other route?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>The <strong>EIGRP route (AD 90)</strong> wins and is installed in the routing table. EIGRP's lower AD makes it more trusted. The OSPF route exists in OSPF's topology database (LSDB) but is not installed in the RIB (Routing Information Base). It stays hidden unless the EIGRP route disappears — then OSPF's route would be promoted automatically.</p><p><strong>Verify:</strong> <code>show ip route 10.5.0.0</code> → shows D (EIGRP). <code>show ip ospf database</code> → OSPF still has the route in its LSDB but it's not in the forwarding table.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is the difference between a C route and an L route in the routing table?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>C (Connected)</strong> — represents the entire subnet. If Gi0/0 has IP 10.1.1.1/24, the C entry is for the network: <code>10.1.1.0/24</code>. This allows the router to forward packets destined to any host in that subnet out Gi0/0.<br><br><strong>L (Local)</strong> — introduced in IOS 15. Represents the specific IP address assigned to the interface: <code>10.1.1.1/32</code>. This allows the router to identify packets destined to itself (for processing, not forwarding). The /32 ensures longest prefix match applies — packets to 10.1.1.1 are processed by the router, not forwarded.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">You add a new OSPF route to the network. Users report intermittent connectivity to the new destination. "show ip route" shows the OSPF route. What could cause this?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>If the route is in the table but connectivity is intermittent, the issue is likely not the routing table itself. Check these:</p><ul><li><strong>Return path:</strong> The destination can receive the packet but can't route the reply back. Run <code>traceroute [dest] source [source-ip]</code> — does the path complete in both directions?</li><li><strong>Route flapping:</strong> The OSPF adjacency may be unstable. Check <code>show ip ospf neighbor</code> — is the neighbour in FULL state consistently or dropping?</li><li><strong>ECMP load balancing:</strong> Two equal-cost paths exist and one is broken. <code>show ip route [dest]</code> — are there multiple via entries? Test each next-hop.</li><li><strong>CEF issues:</strong> Routing table is correct but CEF (forwarding plane) has stale entry. <code>clear ip cef</code> or check <code>show ip cef [dest]</code>.</li></ul></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-d">DEFINE</span><span class="qa-text">Explain the difference between the RIB, FIB, and CEF.</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>RIB (Routing Information Base)</strong> — the routing table you see with <code>show ip route</code>. Contains all best routes selected from various routing protocols. This is the control-plane view.</p><p><strong>FIB (Forwarding Information Base)</strong> — a flattened, optimised copy of the routing table used for actual packet forwarding. Built from the RIB. Stored in line cards/ASICs on hardware platforms. View with <code>show ip cef</code>.</p><p><strong>CEF (Cisco Express Forwarding)</strong> — Cisco's switching mechanism that uses the FIB for fast packet forwarding without CPU lookup. Also builds an adjacency table (Layer 2 info for next-hops). CEF is always on in modern IOS. Process switching (CPU per-packet lookup) is the slow fallback when CEF fails or is disabled.</p></div></div>
</script>
<!-- ══════════════════ TOPIC 2: RIP ══════════════════ -->
<script type="text/x-tmpl" id="m2-theory">
<h3>RIP — Routing Information Protocol</h3>
<p>RIP is the oldest distance-vector routing protocol. It's simple, easy to configure, and still appears in CCNA exams and legacy networks. RIP's core logic: every 30 seconds, send your entire routing table to your neighbours. Pick routes with the fewest hops. Max 15 hops (16 = infinity = unreachable).</p>
<h4>RIPv1 vs RIPv2</h4>
<table class="tbl"><thead><tr><th>Feature</th><th>RIPv1</th><th>RIPv2</th></tr></thead><tbody>
<tr><td>Standard</td><td>RFC 1058</td><td>RFC 2453</td></tr>
<tr><td>Classful / Classless</td><td>Classful only — no subnet mask</td><td>Classless — carries subnet mask</td></tr>
<tr><td>VLSM support</td><td><strong>No</strong> — doesn't advertise mask</td><td><strong>Yes</strong> — mask included in update</td></tr>
<tr><td>Authentication</td><td>None</td><td>Plain text or MD5</td></tr>
<tr><td>Update destination</td><td>Broadcast 255.255.255.255</td><td>Multicast 224.0.0.9</td></tr>
<tr><td>Auto-summarisation</td><td>Always (can't disable)</td><td>On by default, can disable</td></tr>
<tr><td>Next-hop field</td><td>No</td><td>Yes (next-hop in update)</td></tr>
</tbody></table>
<h4>RIP Key Timers</h4>
<table class="tbl"><thead><tr><th>Timer</th><th>Default</th><th>Purpose</th></tr></thead><tbody>
<tr><td>Update</td><td>30 seconds</td><td>How often full routing table is sent</td></tr>
<tr><td>Invalid</td><td>180 seconds</td><td>If no update received — mark route invalid (metric=16)</td></tr>
<tr><td>Holddown</td><td>180 seconds</td><td>After route goes invalid — ignore better-metric updates (prevents loops)</td></tr>
<tr><td>Flush</td><td>240 seconds</td><td>Remove invalid route from table completely</td></tr>
</tbody></table>
<h4>RIP Loop Prevention Mechanisms</h4>
<div class="g2">
  <div class="card"><h5>Split Horizon</h5><p>Don't advertise a route back out the interface you learned it from. If R2 learned about 10.1.0.0 from R1 via Gi0/0, R2 will NOT send 10.1.0.0 back out Gi0/0 in its updates. Prevents simple two-router loops.</p></div>
  <div class="card y"><h5>Route Poisoning</h5><p>When a route fails, immediately advertise it with metric=16 (infinity). This tells neighbours "this network is unreachable" rather than waiting for the route to time out (180s). Faster convergence.</p></div>
  <div class="card g"><h5>Poison Reverse</h5><p>When a router receives a poisoned route (metric=16), it sends back the same route with metric=16. Confirms to the originator that the failure is known. Overrides split horizon for this purpose.</p></div>
  <div class="card p"><h5>Holddown Timer</h5><p>After a route is poisoned, RIP waits (180s default) before accepting new information about that route. Prevents a slow-converging router from advertising a stale good metric and reinstating a looping route.</p></div>
</div>
<h4>Why RIP is Limited</h4>
<ul>
<li><strong>Max 15 hops</strong> — can't scale to large networks</li>
<li><strong>Slow convergence</strong> — 30-second updates, 180-second invalid timer</li>
<li><strong>Bandwidth waste</strong> — sends full table every 30s regardless of changes</li>
<li><strong>Metric only counts hops</strong> — ignores bandwidth (a 1Mbps path with 2 hops beats 10Gbps with 3 hops)</li>
<li>Not used in modern enterprise — OSPF or EIGRP are used instead</li>
</ul>
<div class="note y"><p><strong>RIPng</strong> is RIP for IPv6. Same timers, same 15-hop limit, same loop prevention. Commands differ: <code>ipv6 router rip [name]</code> and applied per-interface with <code>ipv6 rip [name] enable</code>. Updates to multicast FF02::9.</p></div>
</script>

<script type="text/x-tmpl" id="m2-lab">
<h3>Lab 2 — RIPv2 Configuration and Verification</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">RIPv2 Lab</span><span class="tbadge ccna">CCNA</span></div><div class="topo-body"><span class="r">[ R1 ]</span>---<span class="ip">10.0.12.0/30</span>---<span class="r">[ R2 ]</span>---<span class="ip">10.0.23.0/30</span>---<span class="r">[ R3 ]</span>
<span class="ip">192.168.1.0/24</span>                                    <span class="ip">192.168.3.0/24</span>
  <span class="pc">[PC-A]</span>              <span class="ip">192.168.2.0/24</span>               <span class="pc">[PC-C]</span>
                          <span class="pc">[PC-B]</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Configure RIPv2 on All Routers</span><span class="step-sub">R1, R2, R3</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R1 — RIPv2 configuration</span></div><pre><span class="cm">! Step 1: Start RIP process</span>
R1(config)# <span class="cmd">router rip</span>

<span class="cm">! Step 2: Use version 2 (MUST — version 1 is classful, no VLSM)</span>
R1(config-router)# <span class="cmd">version 2</span>

<span class="cm">! Step 3: Disable auto-summary (MUST for VLSM to work correctly)</span>
<span class="cm">! Without this, 192.168.1.0/24 gets summarised to 192.168.0.0/16 — wrong!</span>
R1(config-router)# <span class="cmd">no auto-summary</span>

<span class="cm">! Step 4: Announce networks using CLASSFUL address (no mask)</span>
<span class="cm">! RIP uses classful network statement — the mask is applied based on class</span>
R1(config-router)# <span class="cmd">network 10.0.0.0</span>        <span class="cm">! covers 10.0.12.0/30</span>
R1(config-router)# <span class="cmd">network 192.168.1.0</span>    <span class="cm">! covers LAN</span>

<span class="cm">! Step 5: Passive interface on LAN (no need to send RIP updates to PCs)</span>
R1(config-router)# <span class="cmd">passive-interface gi0/1</span>

<span class="cm">! Same config on R2 and R3 with their respective networks</span></pre></div>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">R2 and R3</span></div><pre>R2(config)# <span class="cmd">router rip</span>
R2(config-router)# <span class="cmd">version 2</span>
R2(config-router)# <span class="cmd">no auto-summary</span>
R2(config-router)# <span class="cmd">network 10.0.0.0</span>
R2(config-router)# <span class="cmd">network 192.168.2.0</span>
R2(config-router)# <span class="cmd">passive-interface gi0/0</span>

R3(config)# <span class="cmd">router rip</span>
R3(config-router)# <span class="cmd">version 2</span>
R3(config-router)# <span class="cmd">no auto-summary</span>
R3(config-router)# <span class="cmd">network 10.0.0.0</span>
R3(config-router)# <span class="cmd">network 192.168.3.0</span>
R3(config-router)# <span class="cmd">passive-interface gi0/0</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Verify RIPv2 Operation</span><span class="step-sub">All Routers</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">RIPv2 verification commands</span></div><pre>R1# <span class="cmd">show ip protocols</span>
<span class="cm">! Shows: Routing Protocol is "rip"</span>
<span class="cm">! Version: 2, Sending updates every 30 seconds</span>
<span class="cm">! Passive interfaces listed</span>
<span class="cm">! Networks: 10.0.0.0, 192.168.1.0</span>
<span class="cm">! Routing Information Sources: R2's IP, last update time</span>

R1# <span class="cmd">show ip route rip</span>
<span class="cm">! Routes marked R — learned via RIP</span>
<span class="cm">! [120/2] = AD 120, metric 2 hops</span>

R1# <span class="cmd">debug ip rip</span>
<span class="cm">! Live updates — shows what's being sent/received every 30 seconds</span>
<span class="cm">! Use this to verify version 2 updates going to 224.0.0.9 (not broadcast)</span>
R1# <span class="cmd">no debug ip rip</span>   <span class="cm">! Always turn off debug when done</span>

R1# <span class="cmd">ping 192.168.3.1 source 192.168.1.1</span>
<span class="cm">! End-to-end connectivity test</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Configure Default Route Propagation via RIP</span><span class="step-sub">R1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Inject default route into RIP domain</span></div><pre><span class="cm">! Scenario: R1 connects to internet via 10.0.1.1</span>
<span class="cm">! Make all routers use R1 as their internet gateway</span>

<span class="cm">! Method 1: Static default + redistribute into RIP</span>
R1(config)# <span class="cmd">ip route 0.0.0.0 0.0.0.0 10.0.1.1</span>     <span class="cm">! Internet default</span>
R1(config)# <span class="cmd">router rip</span>
R1(config-router)# <span class="cmd">default-information originate</span>    <span class="cm">! Advertise default via RIP</span>

<span class="cm">! R2 and R3 will now receive: R* 0.0.0.0/0 [120/1] via R1</span>
<span class="cm">! Verify on R2:</span>
R2# <span class="cmd">show ip route 0.0.0.0</span>
<span class="cm">! Should show: R* 0.0.0.0/0 [120/1] via 10.0.12.1</span>
<span class="cm">! R* = RIP default route candidate</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">4</span><span class="step-title">Configure RIPv2 MD5 Authentication</span><span class="step-sub">R1, R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Prevent rogue routers injecting false routes</span></div><pre><span class="cm">! Create key chain (same name and key string on both routers)</span>
R1(config)# <span class="cmd">key chain RIP-AUTH</span>
R1(config-keychain)# <span class="cmd">key 1</span>
R1(config-keychain-key)# <span class="cmd">key-string Cisco@123</span>

<span class="cm">! Apply authentication on the RIP-facing interface</span>
R1(config)# <span class="cmd">interface gi0/1</span>
R1(config-if)# <span class="cmd">ip rip authentication mode md5</span>
R1(config-if)# <span class="cmd">ip rip authentication key-chain RIP-AUTH</span>

<span class="cm">! Repeat identical config on R2's interface toward R1</span>
<span class="cm">! Mismatch = no RIP updates exchanged = routes disappear</span>

R1# <span class="cmd">debug ip rip</span>
<span class="cm">! Will show "authentication failed" if keys don't match</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m2-interview">
<h3>Interview Questions — RIP</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Why is "no auto-summary" critical in RIPv2 and what happens if you forget it?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>RIPv2 auto-summary summarises routes at classful boundaries when sending updates to a different major network. If R1 has 192.168.1.0/24 and 192.168.2.0/24 and auto-summary is on, when advertising to a neighbour in a different class-C block, both get summarised into 192.168.0.0/16 — a vague, potentially incorrect advertisement.</p><p><strong>Problem scenario:</strong> R1 has 192.168.1.0/24 and R3 has 192.168.3.0/24. Both are in different /24s but same /16. With auto-summary on, R1 advertises 192.168.0.0/16 (not /24). R3 might not be able to distinguish between destinations. VLSM breaks completely.</p><p><strong>Always use</strong> <code>no auto-summary</code> in RIPv2. It's one of the first commands to type after <code>version 2</code>.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">What is split horizon and how does it prevent routing loops?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p><strong>Split horizon:</strong> A router will not advertise a route back out the same interface through which it learned that route.</p><p><strong>How it prevents loops:</strong> Without it — R1 tells R2 about network A. R2 sends updates back to R1 including network A (learned from R1). R1 might think R2 has an independent path to A. If A goes down, R1 removes its direct route but still gets the stale advertisement from R2, causing a count-to-infinity loop.</p><p><strong>With split horizon:</strong> R2 learned A from R1's Gi0/0 → R2 will NOT advertise A back out Gi0/0. R1 only hears about A from its own direct connection. Loop prevented.</p><p><strong>Exception:</strong> Split horizon can cause problems on hub-and-spoke WAN topologies (Frame Relay, DMVPN) where the hub needs to re-advertise spoke routes to other spokes via the same interface. Solution: disable split horizon on the hub's interface with <code>no ip split-horizon</code>.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">RIP is configured between R1 and R2. R1 is advertising 10.1.1.0/24. R2 runs "show ip route" and does not see the route. What are the most likely causes?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Systematically check each layer:</p><ul><li><strong>Version mismatch:</strong> R1 sends RIPv2 updates (multicast 224.0.0.9) but R2 only listens for RIPv1 (broadcast). Run <code>show ip protocols</code> on both — confirm both run version 2.</li><li><strong>auto-summary enabled:</strong> 10.1.1.0/24 is being summarised to 10.0.0.0/8. R2 receives /8 not /24. Confirm with <code>debug ip rip</code> on R2 — what metric and network does the update show?</li><li><strong>Network statement missing:</strong> R1's 10.1.1.0 interface isn't included in the RIP <code>network</code> statement. <code>show ip protocols</code> on R1 — is 10.0.0.0 listed under "Routing for Networks"?</li><li><strong>passive-interface on wrong side:</strong> The WAN link between R1 and R2 is set passive on R1's outbound interface — no updates sent. <code>show ip protocols</code> — check passive interfaces.</li><li><strong>Authentication mismatch:</strong> MD5 configured on one side only. <code>debug ip rip</code> on R2 shows "authentication failed" messages.</li></ul></div></div>
</script>
<!-- ══════════════════ TOPIC 3: STATIC ROUTING ══════════════════ -->
<script type="text/x-tmpl" id="m3-theory">
<h3>Static Routing — Manual, Predictable, Precise</h3>
<p>Static routing is you telling the router exactly where to send traffic. No protocol, no neighbour discovery, no automatic updates. What you type is what the router does. It's the simplest possible routing — and completely correct for stub networks, internet edges, and backup paths.</p>
<h4>Types of Static Routes</h4>
<table class="tbl"><thead><tr><th>Type</th><th>Command Example</th><th>Use Case</th></tr></thead><tbody>
<tr><td><strong>Standard Static</strong></td><td><code>ip route 10.2.0.0 255.255.255.0 10.1.1.2</code></td><td>Reach a specific remote network</td></tr>
<tr><td><strong>Default Route</strong></td><td><code>ip route 0.0.0.0 0.0.0.0 10.1.1.1</code></td><td>Gateway of last resort — matches everything</td></tr>
<tr><td><strong>Summary Static</strong></td><td><code>ip route 10.0.0.0 255.0.0.0 10.1.1.2</code></td><td>One route covering many networks</td></tr>
<tr><td><strong>Floating Static</strong></td><td><code>ip route 10.2.0.0 255.255.255.0 10.1.1.2 210</code></td><td>Backup path — higher AD, only used when primary fails</td></tr>
<tr><td><strong>Null0 (Black Hole)</strong></td><td><code>ip route 10.0.0.0 255.0.0.0 null0</code></td><td>Drop traffic for a summary range (loop prevention)</td></tr>
<tr><td><strong>Recursive Static</strong></td><td><code>ip route 10.2.0.0 255.255.255.0 2.2.2.2</code></td><td>Next-hop resolved via another route (recursive lookup)</td></tr>
</tbody></table>
<h4>Next-Hop IP vs Exit Interface vs Both</h4>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Three ways to specify forwarding</span></div><pre><span class="cm">! Method 1: Next-hop IP only (RECOMMENDED for Ethernet)</span>
R1(config)# <span class="cmd">ip route 10.2.0.0 255.255.255.0 10.1.1.2</span>
<span class="cm">! Router recursively resolves 10.1.1.2 to find exit interface</span>
<span class="cm">! Works on multi-access networks</span>

<span class="cm">! Method 2: Exit interface only (only safe on serial/point-to-point)</span>
R1(config)# <span class="cmd">ip route 10.2.0.0 255.255.255.0 Serial0/0</span>
<span class="cm">! On Ethernet: causes proxy ARP for every destination — NOT recommended</span>

<span class="cm">! Method 3: Fully specified (next-hop + interface) — BEST for Ethernet</span>
R1(config)# <span class="cmd">ip route 10.2.0.0 255.255.255.0 GigabitEthernet0/1 10.1.1.2</span>
<span class="cm">! Most efficient — no recursive lookup, no proxy ARP issues</span>
<span class="cm">! Best practice for Ethernet static routes</span></pre></div>
<h4>Floating Static Route — Automatic Failover</h4>
<p>A floating static route is a backup route with a higher-than-normal AD. Normally hidden behind a dynamic protocol's route — only promoted when the dynamic route disappears.</p>
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Floating static — backup for OSPF</span></div><pre><span class="cm">! Primary: OSPF learns 10.2.0.0/24 via normal OSPF (AD=110)</span>
<span class="cm">! This static route has AD=200 — higher than OSPF, so OSPF wins</span>
R1(config)# <span class="cmd">ip route 10.2.0.0 255.255.255.0 10.99.99.1 200</span>
<span class="cm">! "200" at the end is the custom AD</span>

<span class="cm">! When OSPF adjacency drops → OSPF route disappears</span>
<span class="cm">! Static route (AD 200) activates automatically</span>
<span class="cm">! When OSPF comes back → OSPF route (AD 110) wins again</span>
<span class="cm">! Floating static goes back to hiding — seamless failover</span></pre></div>
</script>

<script type="text/x-tmpl" id="m3-lab">
<h3>Lab 3 — Static Routing with Floating Backup</h3>
<div class="topo"><div class="topo-hdr"><span class="tlabel">Static Routing Lab</span><span class="tbadge ccna">CCNA</span></div><div class="topo-body"><span class="r">[ R1 ]</span>===<span class="ip">Primary 10.0.12.0/30</span>===<span class="r">[ R2 ]</span>
  <span class="ln">|</span>                               <span class="ln">|</span>
  <span class="ip">Backup 10.0.13.0/30</span>          <span class="ip">LAN: 192.168.2.0/24</span>
  <span class="ln">|</span>                              <span class="pc">[PC-B]</span>
<span class="r">[ R3 ]</span>---<span class="ip">10.0.23.0/30</span>---<span class="r">[ R2 ]</span>
<span class="ip">LAN: 192.168.1.0/24</span>
  <span class="pc">[PC-A]</span>

<span class="lb">Goal: Primary path R1→R2 via Gi0/0. Backup via R3 if primary fails.</span></div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">1</span><span class="step-title">Configure Primary Static Routes</span><span class="step-sub">R1, R2</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Primary static routes (default AD = 1)</span></div><pre><span class="cm">! R1 — reach R2's LAN via primary link (Gi0/0 → 10.0.12.2)</span>
R1(config)# <span class="cmd">ip route 192.168.2.0 255.255.255.0 10.0.12.2</span>

<span class="cm">! R2 — reach R1's LAN (R1's LAN 192.168.1.0 is via R1's Gi0/0)</span>
R2(config)# <span class="cmd">ip route 192.168.1.0 255.255.255.0 10.0.12.1</span>

<span class="cm">! Verify connectivity on primary path</span>
R1# <span class="cmd">ping 192.168.2.1 source 192.168.1.1</span>
R1# <span class="cmd">traceroute 192.168.2.1 source 192.168.1.1</span>
<span class="cm">! traceroute should show: R1 → 10.0.12.2 (R2)</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">2</span><span class="step-title">Add Floating Static Backup Route (via R3)</span><span class="step-sub">R1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Floating static — AD 200, only used if primary fails</span></div><pre><span class="cm">! Backup route: R1 → R3 → R2 → 192.168.2.0/24</span>
<span class="cm">! AD = 200 (higher than normal static AD=1, so primary wins)</span>
R1(config)# <span class="cmd">ip route 192.168.2.0 255.255.255.0 10.0.13.2 200</span>

<span class="cm">! Also need R3 to know about R2's LAN (full path must be configured)</span>
R3(config)# <span class="cmd">ip route 192.168.2.0 255.255.255.0 10.0.23.1</span>
R3(config)# <span class="cmd">ip route 192.168.1.0 255.255.255.0 10.0.13.1</span>

R2(config)# <span class="cmd">ip route 192.168.1.0 255.255.255.0 10.0.23.2 200</span>  <span class="cm">! Backup return</span>

<span class="cm">! Verify: show ip route — floating static NOT shown (hidden by primary)</span>
R1# <span class="cmd">show ip route 192.168.2.0</span>
<span class="cm">! Shows: S 192.168.2.0 [1/0] via 10.0.12.2 ← primary</span>
<span class="cm">! Floating static (AD 200) is hidden</span></pre></div>
</div></div>
<div class="step"><div class="step-hdr" onclick="tStep(this)"><span class="step-num">3</span><span class="step-title">Simulate Primary Link Failure and Test Failover</span><span class="step-sub">R1</span><span class="step-chv">▼</span></div><div class="step-body">
<div class="cb"><div class="ch"><span class="lg ios">IOS</span><span class="fn">Fail the primary link — watch floating static activate</span></div><pre><span class="cm">! Shut down the primary interface on R1 (simulate link failure)</span>
R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">shutdown</span>

<span class="cm">! IOS removes static routes when the next-hop becomes unreachable</span>
R1# <span class="cmd">show ip route 192.168.2.0</span>
<span class="cm">! Now shows: S 192.168.2.0 [200/0] via 10.0.13.2 ← FLOATING STATIC activated!</span>

R1# <span class="cmd">traceroute 192.168.2.1 source 192.168.1.1</span>
<span class="cm">! Now shows path: R1 → R3 → R2</span>

<span class="cm">! Restore primary link</span>
R1(config)# <span class="cmd">interface gi0/0</span>
R1(config-if)# <span class="cmd">no shutdown</span>
<span class="cm">! Primary route [1/0] returns → floating static goes back to hiding</span></pre></div>
</div></div>
</script>

<script type="text/x-tmpl" id="m3-interview">
<h3>Interview Questions — Static Routing</h3>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">Why is using an exit interface (rather than next-hop IP) in a static route problematic on Ethernet?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>When you specify only an exit interface in a static route on Ethernet, IOS treats the route as directly connected to that interface. For any destination matching that route, the router will ARP for the destination IP address itself — this is called <strong>proxy ARP</strong>.</p><p><strong>The problem:</strong> If R1 has <code>ip route 10.0.0.0 255.0.0.0 GigabitEthernet0/0</code>, every time it needs to forward a packet to any 10.x.x.x address, it sends an ARP request for that specific IP. On a network with thousands of destinations, this floods the network with ARP and consumes router CPU.</p><p><strong>The fix:</strong> Always specify the next-hop IP for Ethernet static routes, or use the fully specified form: <code>ip route 10.0.0.0 255.0.0.0 GigabitEthernet0/0 10.1.1.2</code>. This resolves to a single ARP for 10.1.1.2 rather than ARPing for every destination.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-q">Q</span><span class="qa-text">How does a floating static route work, and what AD value should you choose?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>A floating static route is a static route with a manually configured AD higher than the primary routing protocol. It stays hidden as long as the primary protocol's route is in the table. When the primary route disappears (protocol fails), the floating static activates automatically.</p><p><strong>Choosing the AD:</strong> Set it higher than the primary protocol but not 255 (which means "never use").<br>• Backup for OSPF (AD 110): use AD 115–150<br>• Backup for EIGRP (AD 90): use AD 95–150<br>• General backup: use AD 200–254</p><p><strong>Important caveat:</strong> Floating statics are tied to next-hop reachability, not to the dynamic protocol's state. If the next-hop IP is still reachable (link up) but OSPF adjacency drops, the floating static won't activate — OSPF route is gone from table but the static's next-hop is still "reachable." Use IP SLA + tracking for more reliable failover.</p></div></div>
<div class="qa"><div class="qa-hdr" onclick="tQA(this)"><span class="qbadge qb-s">SCENARIO</span><span class="qa-text">You add a static route: "ip route 10.5.5.0 255.255.255.0 10.1.1.2". It appears in "show ip route" but traffic to 10.5.5.10 is dropped. What are you checking?</span><span class="qa-chv">▼</span></div><div class="qa-ans"><p>Route in table + traffic dropped = forwarding problem, not a routing table problem. Investigate in order:</p><ul><li><strong>Return path:</strong> 10.5.5.10 receives the packet but has no route back to your source. The packet arrives, reply is dropped. Run <code>traceroute 10.5.5.10 source [your-source-ip]</code> — does it respond to ICMP?</li><li><strong>Next-hop reachability:</strong> Can R1 actually reach 10.1.1.2? Run <code>ping 10.1.1.2</code>. If the next-hop is unreachable, IOS should have removed the route — but check <code>show ip route 10.5.5.0</code> to confirm it's still there.</li><li><strong>Recursive lookup failure:</strong> If 10.1.1.2 itself requires a route that's missing, the static route becomes inactive. Check <code>show ip cef 10.5.5.10</code> — does it show "drop" or "no route"?</li><li><strong>ACL blocking:</strong> An access list on the path is dropping packets. <code>show ip access-lists</code> — check for hit counts incrementing on deny rules.</li><li><strong>Destination unreachable:</strong> 10.5.5.10 doesn't exist or is down. Test from the next-hop router: <code>ping 10.5.5.10</code> from 10.1.1.2.</li></ul></div></div>
</script>
